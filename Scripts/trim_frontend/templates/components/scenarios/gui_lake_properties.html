
<form id="lake-props-gui"
    data-async-form="true"
    data-form-src="scenario_lake_props_form"
>
    <section class="container px-0">
        <div class="row">
            <div class="col-md">
                <div class="pill pill-alert col-sm">
                    <small>
                        <strong>
                            <u>Click on the table cells to edit properties.</u>Please note that the values displayed in the table at the time of the "Save" operation are the values that will be incorporated into the calculations
                        </strong>
                    </small>
                </div>
                <h4 class="mt-4">Water Column Properties</h4>
                <table class="hover" id="LakeTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div class="row">
             <div class="col-md">
                 <h4 class="mt-4">Sediment Properties</h4>
                 <table class="hover" id="SedTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                        </tr>
                    </thead>
                </table>
             </div>
        </div>
    </section>
</form>
 <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="ModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ModalLabel">Modal title</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                </div>
                <div class="modal-footer">
                    <a  class="btn btn-secondary" data-dismiss="modal">Close</a>
<!--                    <button type="button"  id="saveModalButton" class="btn btn-primary" data-dismiss="modal">Save</button>-->
                    <button type="button"  id="saveModalButton" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
 </div>
<style>
    .parcelMultiselect {
      width: 100%;
    }

    .selectBox {
      position: relative;
    }

    .selectBox select {
      width: 100%;
    }

    .overSelect {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .parcelSelectOptions {
      display: none;
      border: 0.5px #7c7c7c solid;
      background-color: #ffffff;
      max-height: 150px;
      overflow-y: scroll;
    }

    .parcelSelectOptions label {
      display: block;
      font-weight: normal;
      display: block;
      white-space: nowrap;
      min-height: 1.2em;
      background-color: #ffffff00;
      padding: 0 2.25rem 0 .75rem;
    }

    .parcelSelectOptions label:hover {
      background-color: #1e90ff;
    }
</style>
<script src="{{url_for('static', filename='js/lib/jquery-3.4.1.min.js')}}">
</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/jquery.dataTables.min.js') }}">
</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/dataTables.bootstrap4.min.js') }}">
</script>
<script>
    onDomLoad(function() {
        let lkTable = $('#LakeTable').removeAttr('width').DataTable()
        let sdTable = $('#SedTable').removeAttr('width').DataTable()
        let default_water_data = {
            'Water Column pH':{
                'short_name':'pH',
                'default_value': 7.3,
                'unit': '',
                'helpText': 'Enter the pH of the water column. Valid values are 0 to 14. The default value of 7.3 is the midpoint of the optimal pH range for most aquatic organisms (6.5 to 8.0, a range provided by the U.S. EPA Casual Analysis/Diagnosis Decision Information System (CADDIS; available online at: https://www.epa.gov/caddis-vol2/caddis-volume-2-sources-stressors-responses-ph). Typical sources of site-specific values include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs.'
            },
            'Water Temperature':{
                'short_name':'waterTemp',
                'default_value': 298,
                'unit': 'K',
                'helpText': 'Enter the average water temperature. Valid values are >= 0. The default value of 298 is from Table B-4-12 of Human Health Risk Assessment Protocol for Hazardous Waste Combustion Facilities (including the Hazardous Waste Companion Database of chemical-specific parameter values). U.S. Environmental Protection Agency, Office of Solid Waste and Emergency Response, Washington, DC. EPA-530-R-05-006. September 2005. Available online at: https://archive.epa.gov/epawaste/hazard/tsd/td/web/html/risk.html. Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs.'
            },
            'Water Column Depth':{
                'short_name':'waterDepth',
                'default_value': 1,
                'unit': 'm',
                'helpText': 'Enter the average depth of the water column (i.e., lake depth). Valid values are > 0. There is no recommended default value. Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs.'
            },
            'Water Column Algae Density':{
                'short_name':'algaeDens',
                'default_value': 0.0025,
                'unit': 'g [algae wet weight]/L [water]',
                'helpText': 'Enter the algae density (wet weight) in the water column. Valid values are >= 0. The default value of 0.0025 is from XX of Millard, E.S., D.D. Myles, O.E. Johannsson, and K.M. Ralph. 1996. Phytoplankton photosynthesis at two index stations in Lake Ontario 1987–1992: assessment of the long-term response to phosphorus control. Canadian Journal of Fisheries and Aquatic Sciences 53: 1092–1111. Available online at: https://doi.org/10.1016/S0380-1330(91)71370-1. A typical way of calculating a site-specific value uses lake depth and total phosphorus level: (0.4*TPhos+0.2*TPhos^1.4)/WaterColumnDepth, where Tphos = average total phosphorus level (µg/L = mg/m3; not a model input parameter) and WaterColumnDepth = Water Column Depth (m; a model input parameter), as adapted from Table 2 of Peters, R.H. 1986. The role of prediction in limnology. Limnol. Oceanogr. 31(5): 1143–1159. Available online at: XX.'
            },
            'Water Column Chloride Concentration':{
                'short_name':'chlorideConc',
                'default_value': 8,
                'unit': 'mg [chloride]/L [water]',
                'helpText': 'Enter the chloride ion concentration in the water column. Valid values are >= 0. The default value of 8 is from Table 1 (maximum value from streams without nearby roadways) of Kaushal, S.S., P.M. Groffman, G.E. Likens, K.T. Belt, W.P. Stack, V.R. Kelly, L.E. Band, and G.T. Fisher. 2005. Increased salinization of fresh water in the northeastern United States. Proceedings of the National Academy of Sciences 102: 13517–13520. Available online at: https://www.pnas.org/doi/full/10.1073/pnas.0506414102. Typical sources of site-specific values include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses) and local watershed watch programs.'
            },
            'Water Column Chlorophyll Concentration':{
                'short_name':'chlorophyllConc',
                'default_value': 0.0029,
                'unit': 'mg [chlorophyll]/L [water]',
                'helpText': 'Enter the chlorophyll concentration in the water column. Valid values are >= 0. The default value of 0.0029 is from Table 1 (2.9 µg/L; median of average epilimnetic summer chlorophyll values from 43 North American lakes) of Nürnberg, G.K. 1996. Trophic state of clear and colored, soft- and hardwater lakes with special consideration of nutrients, anoxia, phytoplankton and fish. Journal of Lake and Reservoir Management 12(4): 432–447. Available online at: https://doi.org/10.1080/07438149609354283. A typical source of site-specific values is the respective state department of environment or natural resources.'
            },
            'Water Column Organic Carbon Fraction in Suspended Sediments':{
                'short_name':'organicCSuspSeds',
                'default_value': 0.02,
                'unit': 'unitless',
                'helpText': 'Enter the organic carbon fraction in sediments suspended in the water column. Valid values are 0 to 1. The default value of 0.02 is from Table 3 (assumed equivalent to the organic carbon fraction in sediments) of McKone, T.E., A.B. Bodnar, and E.G. Hertwich. 2001. Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models. Lawrence Berkeley National Laboratory. LBNL-43722. Available online at: https://escholarship.org/uc/item/9f1164rk. For site-specific values, it is typical to assume the same value as Water Body Organic Carbon Fraction in Sediment Bed (also a model input).'
            },
            'Water Column Suspended Sediment Concentration':{
                'short_name':'suspSedConc',
                'default_value': 0.05,
                'unit': 'kg [sediment particles]/m<sup>3</sup> [water]',
                'helpText': 'Enter the concentration of suspended sediments in the water column. Valid values are >= 0. The default value of 0.05 is based on the value of 0.088 used in the CalTOX model (see Table 1 of: CalEPA (California Environmental Protection Agency), Department of Toxic Substances Control. 1996. The Distribution of California Landscape Variables for CalTOX. Draft (February). Available online at: https://dtsc.ca.gov/wp-content/uploads/sites/31/2018/01/landscap-2.pdf). The data from which the 0.088 average was calculated (from 14 California water quality sites) had a large standard deviation (also 0.088). Screening scenarios have shown TRIM to be sensitive to this parameter, with higher values generally leading to lower concentrations in fish. As such, we utilize a more conservative default value of 0.05 (professional judgment), but we recommend utilizing site-specific values where available. Sources of site-specific data might include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs.'
            },
            'Water Column Flush Rate':{
                'short_name':'flushRate',
                'default_value': 0,
                'unit': 'y<sup>-1</sup>',
                'helpText': 'Enter the flush rate of the water column (the number of times per year that the water column is completely refreshed with new water). Valid values are > 0. There is no default value recommended. Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs. Otherwise, if water column retention time is available, the flush rate is a simple conversion: the ratio of 365 d to the water column retention time (also in unit of d). If a value is not available for flush rate or retention time, then flush rate will be calculated for you as the ratio of the water body’s estimated annual discharge and the water body’s volume, with the assumption that the water body maintains a constant volume—that is, water input (from precipitation, watershed runoff, groundwater seepage, and any contributions from other water bodies) is balanced against output (from evaporation and discharge).'
            },
            'Water Column External Water Inflow from Other Water Bodies':{
                'short_name':'externalWaterInflow',
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Enter the volumetric inflow rate of water received from other water bodies. Valid values are >= 0. The default value is 0 (i.e., assumption of no inflow from other water bodies). If that assumption is not valid, this inflow can be equal to (or some fraction of) the other water body’s discharge, which is based on that other water body’s Water Column Flush Rate.'
            },
            'Water Column External Sediment Inflow from Other Water Bodies':{
                'short_name':'externalSedInflow',
                'default_value': 0,
                'unit': 'kg [sediment particles]/d',
                'helpText': 'Enter the volumetric inflow rate of suspended sediment received from other water bodies. Valid values are >= 0. The default value is 0 (i.e., assumption of no inflow from other water bodies). If that assumption is not valid, this inflow can be equal to (or some fraction of) the product of the other water body’s discharge (which is based on that other water body’s Water Column Flush Rate) and its Water Column Suspended Sediment Concentration, divided by 365 d.'
            },
            'Water Column Evaporation Rate':{
                'short_name':'evaporationRate',
                'default_value': 0.7,
                'unit': 'm [water]/y',
                'helpText': 'Enter the evaporation rate of the water body. Valid values are >= 0. The default value is 0.7, from Table 11 (approximately the value of 0.002 m/d [0.73 m/y] estimated for Wisconsin and Illinois, and similar to the value of 0.0021 m/d [0.77 m/y] estimated for many northeastern states) of McKone, T.E., A.B. Bodnar, and E.G. Hertwich. 2001. Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models. Lawrence Berkeley National Laboratory. LBNL-43722. Available online at: https://escholarship.org/uc/item/9f1164rk. This reference provides values for other states that range from 0.0011 m/d [0.40 m/y] in Maine and New Hampshire to 0.007 m/d [2.6 m/y] in Arizona, which might be more appropriate for site-specific simulations.'
            },
            'Water Column Sediment Deposition Velocity':{
                'short_name':'sedDepositionVelocity',
                'default_value': 2,
                'unit': 'm [water]/y',
                'helpText': 'N/A'
            },
            'Water Column Discharge Volumetric Rate':{
                'short_name':'dischargeRate',
                'default_value': 2,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'The Water Column Evaporation Volumetric Rate subtracted from the sum of the Precipitation Runoff Volumetric Rate from Land to Water Body, Precipitation Volumetric Rate to Water Body, Precipitation Seepage Volumetric Rate to Groundwater, and Water Column External Inflow from Other Water Bodies, assuming the lake maintains a constant volume (a simplifying assumption). That is, water inputs minus loss to evaporation.' +
                    'Math: = ( Precipitation Runoff Volumetric Rate from Land to Water Body + Precipitation Volumetric Rate to Water Body + Precipitation Seepage Volumetric Rate to Groundwater + Water Column External Inflow from Other Water Bodies ) - Water Column Evaporation Volumetric Rate.'
            }

        }
        let default_sed_data = {
            'Sediment Bed Thickness':{
                'short_name':'bedThick',
                'default_value': 0.05,
                'unit': 'm',
                'helpText': 'Enter the average thickness of the water body sediment bed (i.e., the unburied sediment). Valid values are > 0. There is no recommended default value or typical source of site-specific values.'
            },
            'Sediment Bed Density':{
                'short_name':'bedDens',
                'default_value': 2600,
                'unit': 'kg [sediment particles]/m<sup>3</sup> [sediment particles]',
                'helpText': 'Enter the density of dry sediment in the water body’s sediment bed (i.e., the unburied sediment). Valid values are > 0. The default value of 2600 is from Table 3 of McKone, T.E., A.B. Bodnar, and E.G. Hertwich. 2001. Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models. Lawrence Berkeley National Laboratory. LBNL-43722. Available online at: https://escholarship.org/uc/item/9f1164rk. There is no typical source of site-specific values.'
            },
            'Sediment Bed pH':{
                'short_name':'bedPh',
                'default_value': 7.3,
                'unit': 'unitless',
                'helpText': 'Enter the pH of the water body sediment bed (i.e., the unburied sediment). Valid values are 0 to 14. The default value of 7.3 assumes equilibrium with the overlying surface water and is the midpoint of the optimal pH range for most aquatic organisms (6.5 to 8.0, a range provided by the U.S. EPA Casual Analysis/Diagnosis Decision Information System (CADDIS; available online at: https://www.epa.gov/caddis-vol2/caddis-volume-2-sources-stressors-responses-ph). Typical sources of site-specific values of water column pH include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs.'
            },
            'Organic Carbon Fraction in Sediment Bed':{
                'short_name':'bedOrganicCarb',
                'default_value': 0.02,
                'unit': 'unitless',
                'helpText': 'Enter the organic carbon fraction in sediments in the sediment bed (i.e., the unburied sediment). Valid values are 0 to 1. The default value of 0.02 is from Table 3 of McKone, T.E., A.B. Bodnar, and E.G. Hertwich. 2001. Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models. Lawrence Berkeley National Laboratory. LBNL-43722. Available online at: https://escholarship.org/uc/item/9f1164rk. Also, approximately the lowest value obtained from surface sediments in 46 Minnesota lakes (range: 0.029 to 28.6), from appendix to Dean, W.E., E. Gorham, and D.J. Swaine. 1993, Geochemistry of surface sediments of Minnesota lakes, in Bradbury, J.P., and W.E. Dean, eds., Elk Lake, Minnesota—Evidence for rapid climate change in the north-central United States: Geological Society of America, Special Paper 276, p. 115–134. Many contaminants will sorb to organic carbon, so it is health-protective to assume a lower value. Sources of site-specific data might include state departments of natural resources or environmental protection—organic carbon content is measured when sediment samples are analyzed for organic contaminants.'
            },
            'Sediment Bed Porosity':{
                'short_name':'bedPorosity',
                'default_value': 0.6,
                'unit': 'unitless',
                'helpText': 'Enter the porosity of the sediment bed (i.e., the ratio of the volume of the pore space in the sediment bed to the overall volume of the sediment bed). Valid values are 0 to 1. The default value of 0.6 is from …. There are no typical sources of site-specific values.'
            }
        }
        let Auto_calculable = ["Water Column Flush Rate"]
        let linked_data = ["Water Column External Water Inflow from Other Water Bodies"]
        function TableRedraw(table_data, table_type){
            let tblHandle = table_type == "lake" ? lkTable : sdTable
            let tblId = table_type == "lake" ? '#LakeTable' : '#SedTable'
            tblHandle.clear().draw();
            tblHandle.destroy()
            tblHandle = $(tblId).removeAttr('width').DataTable({
                data : table_data,
                paging: false,
                bFilter: false,
                info: false,
                bAutoWidth: false,
                columns: get_pivoted_columns(table_type),
                initComplete: function (settings, json) {
                    $(tblId).wrap("<div style='overflow:auto; width: 100%; position:relative;'></div>");
                    $('[data-toggle="tooltip"]').tooltip()
                    $('[data-toggle="popover"]').popover()
                }
            });

            if (table_type == "lake") {
                lkTable = tblHandle
            }
            else if (table_type == "sed") {
                sdTable = tblHandle
            }

            let sort_order = "asc"
            $('.sortClass').click(function(e){
                e.preventDefault();
                let Table = $(tblId).dataTable()
                let cellIndex = $(this).closest("th").index()
                Table.fnSort([[cellIndex,sort_order]]);//use asc/desc as you want
                sort_order= sort_order == "desc" ? "asc" : "desc"
            });

            $('label.editableCell').click(function () {
                $(this).siblings("input").show()
                $(this).siblings("select").show()
                $(this).prev("input").focus()
                $(this).prev("select").focus()
                $(this).hide();
            });

            $('label.editableCell').click(function () {
                $(this).siblings("input").show()
                $(this).siblings("select").show()
                $(this).prev("input").focus()
                $(this).prev("select").focus()
                $(this).hide();
            });

            $('button.auto_calc').click(function () {
                if ($(this).data("active") == "False") {
                    $(this).data("active","True")
                    $(this).removeClass("btn-outline-dark")
                    $(this).addClass("btn-success")
                    let calcInfo = $(this).data("calcinfo")
                    let tbl_id = $(this).parents("table").attr("id")
                    tbl_id = "#" + tbl_id
                    let tbl_data = get_Data_from_table(tbl_id)
                    let parcel_name = calcInfo.parcel
                    let res = null
                    if (calcInfo.property == "flushRate") {
                        res = calculate_flush_rate(tbl_data, parcel_name)
                    }
                    if (calcInfo.property == "dischargeRate") {
                        res = calculate_discharge_rate(tbl_data, parcel_name)
                    }
                    $(this).parent().siblings("label").text(res)
                    $(this).parent().siblings("input").attr("value",res)
                }
            });

            // toggleCheckboxArea
            $("div[id^='psl_']").each(function(i,e){
                if (tblId == "#LakeTable") {
                    $(e).click(function(evt){
                    var checkboxes = $(e).siblings("div.parcelSelectOptions");
                    var displayValue = $(checkboxes).css("display");
                    if (displayValue != "block") {
                        $(checkboxes).css("display", "block");
                    } else {
                        $(checkboxes).css("display", "none");
                    }
                })
                }
            })

            $("input[id^='MS_']").each(function(i,e) {
                if (tblId == "#LakeTable") {
                    $(e).change(function(evt){
                        let this_parcel_name = $(e).closest("td").find("div.parcelMultiselect").data("parcelname")
                        var multiselectDiv = $(e).closest("td").find("div.divLinkedPropBtn");
                        // var multiselectOptions = $(multiselectDiv).find('input[type|="button"]');

                        var values = [];
                        var checkboxes = $(e).closest("div.parcelMultiselect").find("div.parcelSelectOptions");
                        var checkedCheckboxes = checkboxes.find('input[type|="checkbox"]:checked');
                        for (const item of checkedCheckboxes) {
                            var checkboxValue = $(item).attr('value');
                            values.push(checkboxValue);
                            // Need to disable corresponding component on other columns to avoid cyclic flow
                            let disabledInput = "input#MS_" + $(e).closest("div.parcelMultiselect").attr("data-parcelname")
                            $(tblId).find(disabledInput).attr("disabled","disabled")
                        }

                        var uncheckedCheckboxes = checkboxes.find('input[type|="checkbox"]:not(:checked)');
                        for (const item of uncheckedCheckboxes) {
                            // Need to activate corresponding components on other columns if unchecked
                            let enabledInput = "input#MS_" + $(e).closest("div.parcelMultiselect").attr("data-parcelname")
                            $(tblId).find(enabledInput).removeAttr("disabled")
                        }

                        var no_select_Value = "0";
                        if (values.length > 0) {
                            // Loop through checked parcels/lakes and calculate total cumulative inflow to this parcel/lake
                            let table_col_headers = $("#LakeTable thead th").map((i,h)=>h.innerHTML).toArray()
                            let table_row_headers = $("#LakeTable tbody tr td:nth-child(1) label").map((i,r) => r.innerHTML).toArray()
                            let total_inflow = 0
                            for (const this_val of values){
                                let row_idx = table_row_headers.indexOf("Water Column Discharge Volumetric Rate")
                                let col_idx = table_col_headers.indexOf(this_val)
                                let other_discharge_val = parseFloat($("#LakeTable").find('tr').eq(row_idx+1).find('td').eq(col_idx).find("label").first().text())
                                let this_ratio_data_tag = this_val.toLowerCase() + "_ratio"
                                let inflow_ratio = parseFloat($(e).data(this_ratio_data_tag))
                                total_inflow = total_inflow + (other_discharge_val * inflow_ratio)
                            }
                            // Update "Inflow from other water bodies" using the calculated total inflow
                            $(multiselectDiv).find("label").text(total_inflow)
                            // Setup "List" button to allow users change inflow ratios
                            let this_btn = '<a class="badge badge-secondary-accent ml-2"><i class="fa fa-list" aria-hidden="true"></i></a>'
                            // On click display list of checked parcels and form fields to type in ratios
                            this_btn = $(this_btn).click(
                                function(evt1) {
                                    let valueFormDiv = $('div.modal-body')
                                    $('h5.modal-title').text("Lake Inflow")
                                    $(valueFormDiv).empty()
                                    for (const this_val of values){
                                        // Display the value of the ratio using data tag of the checkbox input (0 by default)
                                        let this_ratio_data_tag = this_val.toLowerCase() + "_ratio"
                                        let inflow_ratio = parseFloat($(e).data(this_ratio_data_tag))
                                        let this_label = '<label> Fraction of discharge from ' + this_val + ' as inflow into ' + this_parcel_name + '</label>'
                                        let this_inp = '<input type="text" data-validate="True" data-valtype="numValue" data-chkval="1" id="FRatio_input_' + this_val + '" class="form-control mb-2" value="' + inflow_ratio + '"/>'
                                        this_inp = $(this_inp).change(function(evt2) {
                                            let is_valid = validate_input(this)
                                            if (is_valid){
                                                // Loop through the ratio input and recalculate the total inflow
                                                let total_IF = 0
                                                for (const this_prc of values) {
                                                    let this_FR_id = "#FRatio_input_" + this_prc
                                                    let fraction_val = parseFloat($(this_FR_id).val())
                                                    let row_idx = table_row_headers.indexOf("Water Column Discharge Volumetric Rate")
                                                    let col_idx = table_col_headers.indexOf(this_prc)
                                                    let inflow_val = parseFloat($("#LakeTable").find('tr').eq(row_idx + 1).find('td').eq(col_idx).find("label").first().text())
                                                    total_IF += inflow_val * fraction_val
                                                    // Update the data tag of the checkbox to current value
                                                    let this_inp_id = "#MS_" + this_prc
                                                    let this_ratio_data_tag = this_prc.toLowerCase() + "_ratio"
                                                    $(this_inp_id).data(this_ratio_data_tag, fraction_val)
                                                }
                                                // Display new value
                                                $(multiselectDiv).find("label").text(total_IF)
                                                $(multiselectDiv).find("label").parent("div").append($(this_btn))

                                                // Calculate Flush rate if auto calculate = on
                                                let tbl_data = get_Data_from_table("#LakeTable")
                                                let parcel_name = this_val
                                                let fr_row_idx = table_row_headers.indexOf("Water Column Flush Rate")
                                                let col_idx = table_col_headers.indexOf(this_val)
                                                let is_auto_calculated = $("#LakeTable").find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("button").data("active")
                                                let res = null
                                                if (is_auto_calculated == "True") {
                                                    res = calculate_flush_rate(tbl_data, parcel_name)
                                                }
                                                $("#LakeTable").find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("label").text(res)
                                                $("#LakeTable").find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("input").attr("value",res)
                                            }
                                        })
                                        // Add Parcel name label and ratio input field in the modal body
                                        $(valueFormDiv).append(this_label)
                                        $(valueFormDiv).append(this_inp)
                                    }
                                    $("#editModal").modal("show")
                                }
                            )
                            let lbl = $(multiselectDiv).find("label").parent("div")
                            $(lbl).append($(this_btn))
                        } else {
                            $(multiselectDiv).find('a[class|="badge badge-secondary-accent ml-2"]').remove()
                            $(multiselectDiv).find("label").text(no_select_Value);
                            $(multiselectDiv).find("div.MultiselectInput").remove()
                        }
                    })
                }
            })

            $("#saveModalButton").click(function(evt_save){
                $(this).removeAttr("data-dismiss")
                let is_valid = validate_input(this)
                if (is_valid) {
                    $(this).attr("data-dismiss","modal")
                }
            })

            function validate_input(e) {
                let elem = $(e).closest("div.modal-content").find("input.form-control")
                elem = elem[0]
                let isValidated = $(elem).data("validate")
                if (isValidated == "True") {
                    let validation_type = $(elem).data("valtype")
                    if (validation_type == "numValue") {
                        let chk_val = parseFloat($(elem).data("chkval"))
                        let val = parseFloat($(elem).val())
                        if (val > chk_val) {
                            $("label.warningTT").tooltip('dispose')
                            $("label.warningTT").remove()
                            let tt = '<label class="warningTT" data-toggle="tooltip" data-placement="right" data-html="true" title="Sum of the fractions for given consuming organism should be 1"><i class="ml-1 fas fa-exclamation-triangle"></i></label>'
                            let this_cell = $(elem).siblings("label")
                            $(this_cell).append(tt)
                            $("label.warningTT").tooltip('show')
                            return false
                        } else {
                            $("label.warningTT").tooltip('hide')
                            $("label.warningTT").remove()
                            return true
                        }
                    }
                }
            }

            $('input.editableCell,select.editableCell').blur(function () {
                let data = $(this).val()
                let $label = $(this).next("label")
                $label.siblings().hide()
                $label.show().text(data)
                let parcel_info = $(this).data('parcelinfo')
                if (parcel_info) {
                    parcel_info[parcel_info.findIndex(e => e.type == 'input')].value = data
                    TRIM.api.updateParcel(parcel_info)
                    table_data = get_Data_from_table(tblId)

                            e['shortProperty'] = default_data[e['Property']]['short_name']
                        }
                    )
                    TableRedraw(table_data, table_type)
                }
            })
        }

        function get_Data_from_table(thisTableID){
            var myRows = [];
            var headersText = [];
            var head_section = thisTableID + ' thead th'
            var $headers = $(head_section);

            // Loop through grabbing everything
            thisRows = thisTableID + ' tbody tr'
            var $rows = $(thisRows).each(function(index) {
                $cells = $(this).find("td");
                myRows[index] = {};
                $cells.each(function(cellIndex) {
                    // Set the header text
                    if(headersText[cellIndex] === undefined) {
                        headersText[cellIndex] = $($headers[cellIndex]).text();
                    }
                    // Update the row object with the header/cell combo
                    myRows[index][headersText[cellIndex]] = $(this).find("label").first().text();
                });
            });
            return myRows
        }

        function calculate_flush_rate(fr_data, parcel_name){
            let loadedData = $('#root').data('loadedParcels')
            let wc_discharge_vol_rate = Number(fr_data.find(e=>e.Property == "Water Column Discharge Volumetric Rate")[parcel_name])
            let wc_depth = Number(fr_data.find(e=>e.Property == "Water Column Depth")[parcel_name])
            let area = Number(loadedData.scenario.find(e => e.name == parcel_name).area)
            let fr = wc_discharge_vol_rate/(area * wc_depth)
            return fr.toPrecision(2)
        }

        function calculate_discharge_rate(dr_data, parcel_name){
            let loadedData = $('#root').data('loadedParcels')
            let runoff_gain = 1
            let precipitation_gain = 1
            let precipitation_gw_seepage_gain = 1
            let external_inflow_gain = Number(dr_data.find(e=>e.Property == "Water Column External Water Inflow from Other Water Bodies")[parcel_name])
            let evaporation_loss = Number(dr_data.find(e=>e.Property == "Water Column Evaporation Rate")[parcel_name])
            let dr = (runoff_gain + precipitation_gain + precipitation_gw_seepage_gain + external_inflow_gain) - evaporation_loss
            return dr.toPrecision(2)
        }
