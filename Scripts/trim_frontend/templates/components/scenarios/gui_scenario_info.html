
<form id="scenario-info-gui"
    data-async-form="true"
    data-form-src="scenario_info_form"
>
    <section class="container px-0">
        <div class="row mb-1">
            <div class="col-md">
                <div data-slot="true" data-target="description"></div>
            </div>
            <div class="col-md">
                <div class="row-fluid">
                    <div data-slot="true" data-target="time_zone"></div>
                </div>
                <div class="row">
                    <div class="col-md">
                        <input id="simStartDate" type="date" name="startDate">
<!--                        <div data-slot="true" data-target="start_date"></div>-->
                    </div>
                    <div class="col-md">
                            <input id="simEndDate" type="date" name="endDate">
<!--                        <div data-slot="true" data-target="end_date"></div>-->
                    </div>
                </div>
                <div class="row-fluid">
                    <div data-slot="true" data-target="simulation_duration"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md">
                <div data-slot="true" data-target="fraction_concentrations_included"></div>
                <div data-slot="true" data-target="time_step_duration"></div>
            </div>
            <div class="col-md">
                <div data-slot="true" data-target="use_steady_state"></div>
                <div data-slot="true" data-target="enable_air_contributions"></div>
            </div>
        </div>
    </section>
</form>
<script>
    onDomLoad(function() {
        var form = document.getElementById('scenario-info-gui');
        form.addEventListener('form:loaded', function() {
            document.body.addEventListener('parcels:loaded', function () {
                let loadedData = $('#root').data('loadedParcels')
                $('#simStartDate').val(loadedData.scenario_head.simulation_start_date)
                $('#simEndDate').val(loadedData.scenario_head.simulation_end_date)
                enableDateCalculations();
            })
        });

        function get_form_data(elem) {
            let param_name = $(elem).attr("name")
            let param_info = [
                {
                    'type': 'data',
                    'name': 'id',
                    'value': {{ scenario.id }}
                }, {
                    'type': 'data',
                    'name': 'field',
                    'value': param_name
                }, {
                    'type': 'input',
                    'name': param_name,
                    'value': ''
                }
            ]
            let param_data = ""
            if ($(elem).attr('type') == "date") {
                param_data = $(elem).val()
            }
            param_info[param_info.findIndex(e => e.type == 'input')].value = param_data;
            return param_info
        }

        function submit_scenario_value(elem) {
            let param_info = get_form_data(elem)
            let resp = TRIM.api.updateScenario(param_info).on('load',function(){
                let val_resp = this.responseJSON
                if (val_resp) {
                }
            })
        }

        function enableDateCalculations() {
            var startDate = $('#simStartDate');
            var endDate = $('#simEndDate');

            startDate.add(endDate).blur(function(e) {
                var start = startDate.val();
                var end = endDate.val();

                var exportDate = $('#html_export_date');

                if (exportDate.length) {
                    exportDate.attr('min', start + 'T00:00');
                    exportDate.attr('max', end + 'T12:00');
                }

                var disp = calculateDateDistance(start, end);

                if (!disp.length) {
                    $('#simulation_duration').addClass('is-invalid pl-5').val(
                        'Invalid date range');
                }
                else {
                    $('#simulation_duration').removeClass('is-invalid pl-5').val(
                        disp.join(', '));
                    submit_scenario_value(startDate)
                    submit_scenario_value(endDate)
                }
            });
            startDate.blur();
        }
    });
</script>
