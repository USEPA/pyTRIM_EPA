{% from 'macros/mirc/form_macros.html' import render_input, render_label %}

<h4>
    <button type="button"
        class="btn btn-lg btn-block px-0 text-primary text-left border-light border-top-0 border-left-0 border-right-0 rounded-0"
        data-toggle="collapse" aria-expanded="true"
        data-target="#pp-collapse" aria-controls="pp-collapse"
        style="font-weight: 500;"
    >
        {{ form.product_parameters.label.text }}&nbsp;
        <small class="text-muted">
            <i class="fa fa-eye-slash"></i>
        </small>
    </button>
</h4>

<div id="pp-collapse" class="collapse show">
    <div class="form-row mb-3">
        <div class="col-sm-2">
            <label for="product-filter">
                Product
            </label>
            <select id="product-filter" class="form-control form-control-sm">
                {% for p in products|selectattr('is_food') %}
                    <option value="{{ p.id }}">{{ p.name|title }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="table-responsive">
    <table id="general-product-parameters" class="table table-sm table-bordered">
        <thead>
            <tr class="text-center">
                <th scope="col"
                    class="border-top-0 border-left-0 border-primary align-middle"
                >
                    Parameter
                </th>
                <th scope="col" class="table-primary border-primary align-middle">
                    Value
                </th>
                <th scope="col" class="table-primary border-primary align-middle">
                    Unit
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th colspan="3" class="table-light align-middle text-center">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </th>
            </tr>
        </tbody>
    </table>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var tbl = $('#general-product-parameters tbody');
        $('#product-filter').change(function() {
            var p = $(this).val();

            var filter = '.product-' + p;

            var rows = tbl.find('tr');
            var relevant = rows.filter(filter);

            if (!relevant.length) {
                if (rows.length > 1) {
                    LoadingScreen.show('p_params');
                }
                $.ajax({
                    url: '{{ url_for("mirc_scenario.get_form_fragment") }}',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        name: 'product_parameter',
                        product: p,
                        parent: '{{ form.parent.data or "" }}',
                        scenario_id: '{{ form.scenario_id.data or "" }}',
                        i: rows.length
                    })
                }).then(function(data) {
                    tbl.append(data);
                    rows = tbl.find('tr').hide();
                    rows.filter(filter).show();
                    // Enable popups
                    $('[data-toggle="popover"]').popover();
                }).always(function() {
                    LoadingScreen.hide('p_params');
                });
            }
            else {
                rows.hide();
                relevant.show();
            }
        }).change();
    });
    </script>
</div>

<hr />
