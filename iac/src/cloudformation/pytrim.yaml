  DatabaseMySQLEngineVersion:
    Description: version number to use; see DescribeDBEngineVersions for up-to-date values
    Type: String
    Default: "8.0.35"
  DatabaseMasterAccountUsername:
    Description: master user name
    Type: String
  DatabaseMasterAccountPassword:
    Description: master user password - 8+ characters
    Type: String
    MinLength: 8

Conditions:
  DoCreateDatabaseInfrastructure: !Equals [!Ref "KludgeDoDb", "true"]
  DoCreateBeanstalkInfrastructure: !Equals [!Ref "KludgeDoBeanstalk", "true"]


Resources:
  #
  #
  # S3
  #
  #
  ModelRunOutputStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-model-run-storage-bucket'
      AccessControl: Private

  #
  #
  # BASIC VPC CONFIGURATION
  #
  #
  Vpc:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Sub '10.${CidrSegmentVPC}.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}_vpc'

  SubnetPrivateAlphaAZ:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${AlphaAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentPrivateSubnetAlphaAZ}.0/24'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_private_${AlphaAZSuffix}'

  SubnetPrivateBravoAZ:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${BravoAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentPrivateSubnetBravoAZ}.0/24'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_private_${BravoAZSuffix}'
  SubnetPublicAlphaAZ:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${AlphaAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentPublicSubnetAlphaAZ}.0/24'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_public_${AlphaAZSuffix}'
  SubnetPublicBravoAZ:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${BravoAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentPublicSubnetBravoAZ}.0/24'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_public_${BravoAZSuffix}'

  SubnetRdsPrivateAlphaAZ:
    Condition: DoCreateDatabaseInfrastructure
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${AlphaAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentRdsPrivateSubnetAlphaAZ}.0/24'
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_rds_private_${AlphaAZSuffix}'

  SubnetRdsPrivateBravoAZ:
    Condition: DoCreateDatabaseInfrastructure
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${BravoAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentRdsPrivateSubnetBravoAZ}.0/24'
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_rds_private_${BravoAZSuffix}'

  SubnetForNAT:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub '${AWS::Region}${BravoAZSuffix}'
      CidrBlock: !Sub '10.${CidrSegmentVPC}.${CidrSegmentNatSubnet}.0/24'
      Tags:
        - Key: Name
          Value: !Sub 'subnet_${EnvironmentName}_public_forNAT'

  NATGatewayForPrivateSubnets:
    Type: AWS::EC2::NatGateway
    Properties: 
      ConnectivityType: public
      AllocationId: !Ref NATGatewayElasticIPAllocationID
      SubnetId: !Ref SubnetForNAT
      Tags:
        - Key: Name
          Value: !Sub 'natgateway-${EnvironmentName}'

  RouteTableNGW:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'rtb-${EnvironmentName}-nat'

  NGWRoute:
    Type: AWS::EC2::Route
    Properties: 
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NATGatewayForPrivateSubnets
      RouteTableId: !Ref RouteTableNGW
            
  InternetGatewayForVPC:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'igw-${EnvironmentName}'

  VpcGatewayAssociation:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGatewayForVPC

  RouteTableIGW:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'rtb-${EnvironmentName}-igw'

  IGWRoute:
    Type: AWS::EC2::Route
    Properties: 
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGatewayForVPC
      RouteTableId: !Ref RouteTableIGW
        
  # there's no way to alter the default route table that comes wiht the VPC in a CloudFormation template
  # (at least not without a custom lambda-backed resource) so instead we make manual associations for
  # the appropriate subnet/RouteTable
  SubnetRouteTableAssociationOne:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetPublicAlphaAZ
      RouteTableId:
        Ref: RouteTableIGW

  SubnetRouteTableAssociationTwo:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetPublicBravoAZ
      RouteTableId:
        Ref: RouteTableIGW

  SubnetRouteTableAssociationThree:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetForNAT
      RouteTableId:
        Ref: RouteTableIGW

  SubnetRouteTableAssociationFour:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetPrivateAlphaAZ
      RouteTableId:
        Ref: RouteTableNGW

  SubnetRouteTableAssociationFive:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetPrivateBravoAZ
      RouteTableId:
        Ref: RouteTableNGW
            
  #
  #
  # BastionSecurityGroup
  #
  #
  
  # TODO - do I need this?
  BastionSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'security group for bastion instance in ${EnvironmentName}'
      GroupName: !Sub '${EnvironmentName}-secgrp-bastion'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-secgrp-bastion'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
#START_DYNAMIC_SECTION ec2_ingress
#END_DYNAMIC_SECTION ec2_ingress
            
  #
  #
  # IAM
  #
  #

  # TODO - more restrictive role permissions...
  
                
  # this is the role the script running within the Docker container runs as...
  # TODO CURRENLTY NOT IN USE?!?!
  DockerRuntimeAssumedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      # in IAM console, search for the managed policy to find the arn for it
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSStepFunctionsFullAccess" # needed for token access
        # TODO - will need database access?
        
  # this is the role the web tier runs as - used e.g. for making AWS SDK calls
  WebTierInstanceProfileRole:
    Condition: DoCreateBeanstalkInfrastructure
    Type: AWS::IAM::Role
    # Description: !Sub 'Instance profile role for the PyTRIM ${EnvironmentName} web tier'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      # in IAM console, search for the managed policy to find the arn for it
      ManagedPolicyArns:
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSQSFullAccess"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSESFullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSElasticBeanstalkWebTier"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "states:*"
                Resource: !Ref DockerStateMachineWrapper
              - Effect: "Allow"
                Action: "states:DescribeExecution"
                Resource: "*"
                # Resource is like: arn:aws:states:us-east-1:426714360284:execution:DockerStateMachineWrapper-6igLbCu7FQcL:70e6b149-0e1d-4f43-b689-bdeda0d30f96 but I can't get wildcards working with that, so for now just allow on all. Just describe so low-risk.
                #Resource:
                #- !Join
                #- ''
                #-
                #- 'arn:'
                #- !Sub "${AWS::Partition}"
                #- ':states:::execution:'
                #- !GetAtt DockerStateMachineWrapper.Name
                #- ':*'
              - Effect: "Allow"
                Action: "s3:*"
                Resource:
                  - !GetAtt ModelRunOutputStorageBucket.Arn
                  - !Join
                    - ''
                    -
                      - 'arn:'
                      - !Sub "${AWS::Partition}"
                      - ':s3:::'
                      - !Ref ModelRunOutputStorageBucket
                      - '/*'
      Path: /

  WebTierInstanceProfile:
    Condition: DoCreateBeanstalkInfrastructure
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref WebTierInstanceProfileRole
        
  # role Elastic Beanstalk uses when constructing resources for the web tier
  WebTierServiceRole:
    Type: AWS::IAM::Role
    # Description: !Sub 'Service role for the PyTRIM ${EnvironmentName} web tier'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              # see https://gist.github.com/shortjared/4c1e3fe52bdfa47522cfe5b41e5d6f22
              Service:
                - 'elasticbeanstalk.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': elasticbeanstalk
      # in IAM console, search for the managed policy to find the arn for it
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AutoScalingFullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ElasticLoadBalancingFullAccess"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSQSFullAccess"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Path: /

  #
  #
  # BASTION
  #
  #

  # see https://aws-ia.github.io/cfn-ps-linux-bastion/#_deployment_options
  #
  # BASTION AMI OS? (Amazon-Linux2-HVM)
  # ROOT VOLUME SIZE (10)
  # BASTION HOST NAME (LinuxBastion)
  # BASTION TENANCY (default)
  # BASTION BANNER (false)
  # BANNER TEXT ("")
  # TCP FORWARDING (false)
  # X11 FORWARDING (false)
  # QUICK START S3 BUCKTE NAME (aws-quickstart)
  # quickstart s3 prefix (quickstart-linux-bastion/)
  # QS bucket region (us-east-1)

  # how can we embed one template:
  # https://aws-quickstart.s3.amazonaws.com/quickstart-linux-bastion/templates/linux-bastion.template
  # inside this one?
  BastionJumpbox:
    Type: 'AWS::CloudFormation::Stack'
    # DeletionPolicy: Retain
    Properties:
      # TemplateURL: 'https://aws-quickstart.s3.amazonaws.com/quickstart-linux-bastion/templates/linux-bastion.template'
      TemplateURL: 'https://aws-ia-us-east-1.s3.us-east-1.amazonaws.com/cfn-ps-linux-bastion/templates/linux-bastion-entrypoint-existing-vpc.template.yaml'
      Parameters:
        BastionHostName: !Sub '${EnvironmentName}-bastionhost'
        BastionInstanceType: 't2.micro'
        NumBastionHosts: 1
        RemoteAccessCIDR: '0.0.0.0/0' # TODO - how to lock this down a bit, maybe post-construction?
        VPCID: !Ref Vpc
        PublicSubnet1ID: !Ref SubnetPublicAlphaAZ
        PublicSubnet2ID: !Ref SubnetPublicBravoAZ
        KeyPairName: !Ref BastionPassthroughKeyPairName
        EnableTCPForwarding: true
            
  #
  #
  # DOCKER
  #
  #
  ContainerRepository:
    Type: 'AWS::ECR::Repository' # private; "PublicRepository" is a different type altogether
    Properties:
      EmptyOnDelete: false
      RepositoryName: !Sub '${EnvironmentName}/private_ecr_repo'

  # NOTE - for some reason this fails the first time you try it; I had to create one manual cluster first before it would work?
  ContainerCluster:
    Type: 'AWS::ECS::Cluster'
    Properties:
      ClusterName: !Sub '${EnvironmentName}_container_cluster'
      CapacityProviders: 
        - 'FARGATE'

  DockerTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchLogsFullAccess"

  DockerTaskTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSStepFunctionsFullAccess"
        # - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess"
        # TODO - will need database access? network access for getting outside the dcker container?
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "secretsmanager:GetSecretValue"
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pytrim/*"
              - Effect: "Allow"
                Action: "s3:*"
                Resource:
                  - !GetAtt ModelRunOutputStorageBucket.Arn
                  - !Join
                    - ''
                    -
                      - 'arn:'
                      - !Sub "${AWS::Partition}"
                      - ':s3:::'
                      - !Ref ModelRunOutputStorageBucket
                      - '/*'
    
  # this is the role the step function assumes when running...
  # TODO CURRENTLY NOT IN USE?!?!?!
  StepFunctionAssumedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'states.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      # in IAM console, search for the managed policy to find the arn for it
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonECS_FullAccess"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXrayFullAccess"
      Policies:
        - PolicyName: !Sub '${EnvironmentName}CustomStepFunctionRolePolicy'
          PolicyDocument:
             Version: 2012-10-17
             Statement:
                - Sid: CloudWatchAccessStmt
                  Effect: Allow
                  Action: "cloudwatch:*"
                  Resource: '*'
                # Path: /

  DockerTaskDef:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      # 1 vCPU / 4 GB RAM. hangs eventually...
      # Cpu: "1024"
      # Memory: "4096"

      # 4 vCPU / 16 GB RAM. Works, took about 20 minutes on scenario 2
      # Cpu: "4096"
      # Memory: "16384"
      
      # 8 vCPU / 32 GB RAM. Again, about 20 minutes
      # Cpu: "8192"
      # Memory: "32768"
      
      # 8 vCPU / 60 GB RAM. Works, took about 19 minutes.
      Cpu: "8192"
      Memory: "61440"
      ContainerDefinitions: 
        - Image: !Join
          - ':'
          -
            - !GetAtt ContainerRepository.RepositoryUri
            - 'latest'
          Cpu: 0
          DisableNetworking: false

          Environment:
            - Name: STORAGE_BUCKET_NAME
              Value: !Ref ModelRunOutputStorageBucket
            - Name: RDS_HOSTNAME
              # Value: pytrim-dev-stalk-mysql.c4kmy933ys6z.us-east-1.rds.amazonaws.com
              Value: !GetAtt DatabaseInstance.Endpoint.Address
            - Name: RDS_PORT
              Value: !GetAtt DatabaseInstance.Endpoint.Port
            - Name: RDS_DB_NAME
              Value: !Ref DatabaseName
            # RDS_USERNAME, RDS_PASSWORD, SQLALCHEMY_DATABASE_URI get set on-the-fly by the Docker image...

          Essential: true
          Interactive: false
          LogConfiguration: 
            LogDriver: "awslogs"
            Options:
              "awslogs-create-group": "true"
              "awslogs-group": "/ecs/pytrim_sample_taskdef"
              "awslogs-region": "us-east-1"
              "awslogs-stream-prefix": "ecs"

          Name: "pytrim_runmodel_container"
          PortMappings: 
            - Name: "pytrim_runmodel_container-80-tcp"
              ContainerPort: 80
              HostPort: 80
              Protocol: "tcp"
              AppProtocol: "http"
          #Secrets: 
            #- Secret
      #EphemeralStorage: 
        #EphemeralStorage
      ExecutionRoleArn: !GetAtt DockerTaskExecutionRole.Arn
      Family: "pytrim_runmodel_taskdef_family"
      #InferenceAccelerators: 
        #- InferenceAccelerator
      # IpcMode: String
      NetworkMode: "awsvpc"
      # PidMode: String
      # PlacementConstraints: 
        #- TaskDefinitionPlacementConstraint
      # ProxyConfiguration: 
        # ProxyConfiguration
      RequiresCompatibilities: 
        - "FARGATE"
      RuntimePlatform: 
        CPUArchitecture: "X86_64"
        OperatingSystemFamily: "LINUX"
      Tags: 
        - Key: Name
          Value: !Sub '${EnvironmentName}-runmodel-taskdef'
      TaskRoleArn: !GetAtt DockerTaskTaskRole.Arn
      # Volumes: 
        # - Volume
          
  StateMachineSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'controls statemachine access for ${EnvironmentName}'
      GroupName: !Sub '${EnvironmentName}-secgrp-statemachine'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-secgrp-statemachine'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        -
          CidrIp: '0.0.0.0/0'
          Description: !Sub 'incoming access for the statemachine on ${EnvironmentName}'
          FromPort: 0
          ToPort: 65535
          IpProtocol: "tcp"
      SecurityGroupEgress:
        -
          CidrIp: '0.0.0.0/0'
          Description: !Sub 'outgoing access for the statemachine on ${EnvironmentName}'
          FromPort: 0
          ToPort: 65535
          IpProtocol: "tcp"

  DockerStateMachineWrapper:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      RoleArn: !GetAtt StepFunctionAssumedRole.Arn
      Definition:
        Comment: State Machine that launches Docker container to perform PyTrim model running
        StartAt: ECS RunTask
        States:
          #ECS RunTask:
          #Type: Pass
          #Result: Hello
          #End: true
          ECS RunTask:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.waitForTaskToken
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt ContainerCluster.Arn
              TaskDefinition: !GetAtt DockerTaskDef.TaskDefinitionArn
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: ENABLED
                  Subnets:
                  - !Ref SubnetPublicAlphaAZ
                  - !Ref SubnetPublicBravoAZ
                  SecurityGroups:
                  - !Ref StateMachineSecurityGroup
              Overrides:
                ContainerOverrides:
                - Environment:
                  - Name: TASK_TOKEN_ENV_VARIABLE
                    Value.$: $$.Task.Token
                  - Name: TRIM_SCENARIO_ID.$
                    Value.$: $.scenarioId
                  - Name: GENERATE_FAKE_RESULTS.$
                    Value.$: $.generateFakeResults
                  Name: pytrim_runmodel_container
            End: true
      Tags:
        - Key: StateMachineName
          Value: !Sub '${EnvironmentName}-dockerized-runmodel-statemachine'
  
  #
  #
  # RDS/MYSQL
  
  
  DatabaseSubnetGroup:
    Condition: DoCreateDatabaseInfrastructure
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: !Sub 'rds db subnet group for ${EnvironmentName}'
      SubnetIds:
        - !Ref SubnetRdsPrivateBravoAZ
        - !Ref SubnetRdsPrivateAlphaAZ
  
  DatabaseSecurityGroup:
    Condition: DoCreateDatabaseInfrastructure
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'controls rds instance access for ${EnvironmentName}'
      GroupName: !Sub '${EnvironmentName}-secgrp-rds'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-secgrp-rds'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        -
          CidrIp: !Sub '10.${CidrSegmentVPC}.0.0/16'
          Description: !Sub 'access to the RDS instance from the ${EnvironmentName} VPC'
          FromPort: 0
          ToPort: 65535
          IpProtocol: "tcp"

  DatabaseInstance:
    Condition: DoCreateDatabaseInfrastructure
    Type: 'AWS::RDS::DBInstance'
    Properties:
      AllocatedStorage: "100"
      AllowMajorVersionUpgrade: true
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7
      DBInstanceClass: !Ref DatabaseInstanceType
      DBInstanceIdentifier: !Sub '${EnvironmentName}-mysql'
      DBName: !Ref DatabaseName
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Engine: "mysql"
      EngineVersion: !Ref DatabaseMySQLEngineVersion
      MasterUsername: !Ref DatabaseMasterAccountUsername
      MasterUserPassword: !Ref DatabaseMasterAccountPassword
      PubliclyAccessible: false
      StorageType: "gp2"

  #
  #
  # SECRETS
  # 
  #
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties: 
      Description: !Sub 'MySQL credentials for ${EnvironmentName}'
      Name: !Sub 'pytrim/mysql'
      SecretString: !Sub '{"username":"${DatabaseMasterAccountUsername}","password":"${DatabaseMasterAccountPassword}"}'

    
  #
  #
  # Beanstalk
  # 
  #
  BeanstalkApp:
    Condition: DoCreateBeanstalkInfrastructure
    Type: AWS::ElasticBeanstalk::Application
    Properties: 
      ApplicationName: !Sub '${EnvironmentName}'

  BeanstalkWebSecurityGroup:
    Condition: DoCreateBeanstalkInfrastructure
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'security group for web tier in ${EnvironmentName}'
      GroupName: !Sub '${EnvironmentName}-secgrp-webtier'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-secgrp-webtier'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        -
          CidrIp: !Sub '10.${CidrSegmentVPC}.0.0/16'
          Description: !Sub 'access to the web tier instances from the ${EnvironmentName} VPC'
          FromPort: 22
          ToPort: 22
          IpProtocol: "tcp"

  BeanstalkWebEnv:
    Condition: DoCreateBeanstalkInfrastructure
    Type: AWS::ElasticBeanstalk::Environment
    Properties: 
      ApplicationName: !Ref BeanstalkApp
      Description: !Sub 'web tier for ${EnvironmentName}'
      EnvironmentName: !Sub '${EnvironmentName}-web'
      SolutionStackName: '64bit Amazon Linux 2023 v4.0.11 running Python 3.11' # see https://docs.aws.amazon.com/elasticbeanstalk/latest/platforms/platforms-supported.html#platforms-supported.python
      OptionSettings: 
        -
          Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: IamInstanceProfile
          Value: !Ref WebTierInstanceProfile
          # Value: 'aws-elasticbeanstalk-ec2-role'
        -
          Namespace: 'aws:ec2:vpc'
          OptionName: AssociatePublicIpAddress
          Value: false
        -
          Namespace: 'aws:ec2:vpc'
          OptionName: VPCId
          Value: !Ref Vpc
        -
          Namespace: 'aws:ec2:vpc'
          OptionName: Subnets
          Value: !Join
            - ','
            -
              - !Ref SubnetPrivateAlphaAZ
              - !Ref SubnetPrivateBravoAZ
        -
          Namespace: 'aws:ec2:vpc'
          OptionName: ELBSubnets
          Value: !Join
            - ','
            -
              - !Ref SubnetPublicAlphaAZ
              - !Ref SubnetPublicBravoAZ
        -
          Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: SecurityGroups
          Value: !Ref BeanstalkWebSecurityGroup
          # Value: !Sub '${EnvironmentName}-secgrp-webtier'
        - 
          Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: ServiceRole
          Value: !Ref WebTierServiceRole
          # Value: 'aws-elasticbeanstalk-service-role'  
        - 
          Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: EnvironmentType
          Value: 'LoadBalanced'
        - 
          Namespace: 'aws:autoscaling:asg'
          OptionName: MinSize
          Value: !Ref WebTierMinNumOfInstances
        - 
          Namespace: 'aws:autoscaling:asg'
          OptionName: MaxSize
          Value: !Ref WebTierMaxNumOfInstances
        - 
          Namespace: 'aws:ec2:instances'
          OptionName: InstanceTypes
          Value: !Ref WebTierInstanceType
        -
          Namespace: 'aws:elasticbeanstalk:environment:proxy'
          OptionName: ProxyServer
          # ResourceName:
          Value: 'nginx'
        -
          Namespace: 'aws:elasticbeanstalk:container:python'
          OptionName: WSGIPath
          Value: 'webapp:application'
        -
          Namespace: 'aws:elasticbeanstalk:container:python'
          OptionName: NumProcesses
          Value: 12
        -
          Namespace: 'aws:elasticbeanstalk:container:python'
          OptionName: NumThreads
          Value: 20
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: RDS_HOSTNAME
          Value: !GetAtt DatabaseInstance.Endpoint.Address
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: RDS_DB_NAME
          Value: !Ref DatabaseName
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: TRIM_ENV_PROFILE
          Value: !Ref ShortEnvironmentProfile
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: TRIM_DOCKERIZED_STATEMACHINE_ARN
          Value: !Ref DockerStateMachineWrapper
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: AWS_DEFAULT_REGION
          Value: "us-east-1"
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: RDS_USERNAME
          Value: !Ref DatabaseMasterAccountUsername
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: RDS_PORT
          Value: !GetAtt DatabaseInstance.Endpoint.Port
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: SECRET_KEY
          Value: xxxxfromcf
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: SQLALCHEMY_DATABASE_URI
          Value: !Join
            - ''
            -
              - 'mysql+pymysql://'
              - !Ref DatabaseMasterAccountUsername
              - ':'
              - !Ref DatabaseMasterAccountPassword
              - '@'
              - !GetAtt DatabaseInstance.Endpoint.Address
              - ':'
              - !GetAtt DatabaseInstance.Endpoint.Port
              - '/'
              - !Ref DatabaseName
        -
          Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: RDS_PASSWORD
          Value: !Ref DatabaseMasterAccountPassword
        -
          # I can't get this setting to work...
          Namespace: 'aws:elasticbeanstalk:environment:process:default'
          OptionName: StickinessEnabled
          Value: 'true'
        -
          Namespace: 'aws:elasticbeanstalk:environment:process:default'
          OptionName: StickinessLBCookieDuration
          Value: 86400
        -
          Namespace: 'aws:elasticbeanstalk:environment:process:default'
          OptionName: StickinessType
          Value: lb_cookie
        -
          Namespace: 'aws:elb:policies'
          OptionName: LoadBalancerPorts
          Value: "443"
        -
          Namespace: 'aws:elb:policies'
          OptionName: ConnectionDrainingEnabled
          Value: true
        -
          Namespace: 'aws:elb:listener'
          OptionName: ListenerEnabled
          Value: false
        -
          Namespace: 'aws:elb:listener:443'
          OptionName: ListenerEnabled
          Value: true
        -
          Namespace: 'aws:elb:listener:443'
          OptionName: ListenerProtocol
          Value: HTTPS
        -
          Namespace: 'aws:elb:listener:443'
          OptionName: InstancePort
          Value: 80
        -
          Namespace: 'aws:elb:listener:443'
          OptionName: InstanceProtocol
          Value: HTTP
        -
          Namespace: 'aws:elb:listener:443'
          OptionName: SSLCertificateId
          Value: !Ref WebServerCertId
        -
          Namespace: 'aws:elasticbeanstalk:command'
          OptionName: DeploymentPolicy
          Value: Rolling
        -
          Namespace: 'aws:elasticbeanstalk:command'
          OptionName: BatchSizeType
          Value: Percentage
        -
          Namespace: 'aws:elasticbeanstalk:command'
          OptionName: BatchSize
          Value: 30
        -
          Namespace: 'aws:autoscaling:updatepolicy:rollingupdate'
          OptionName: RollingUpdateType
          Value: Health
        -
          Namespace: 'aws:autoscaling:updatepolicy:rollingupdate'
          OptionName: MaxBatchSize
          Value: 1
        -
          Namespace: 'aws:autoscaling:updatepolicy:rollingupdate'
          OptionName: MinInstancesInService
          Value: 1
        -
          Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: EC2KeyName
          Value: !Ref BastionPassthroughKeyPairName
        -
          Namespace: 'aws:elasticbeanstalk:sns:topics'
          OptionName: Notification Endpoint
          Value: !Ref NotificationEmail
        # see https://aws.amazon.com/blogs/security/how-to-control-tls-ciphers-in-your-aws-elastic-beanstalk-application-by-using-aws-cloudformation/
        # if not set, the load balancer defaults to the insecure ELBSecurityPolicy-2016-08 (see
        # EC2 console, find the LB, look at listeners, look at Cipher).
        # actually I couldn't get this to work either so in interests of time just did it manually.
        -
          Namespace: 'aws:elb:policies:TLSHighPolicy'
          OptionName: SSLReferencePolicy
          Value: ELBSecurityPolicy-TLS-1-2-2017-01
        -
          Namespace: aws:elb:listener:443
          OptionName: PolicyNames
          Value: TLSHighPolicy
      Tier: 
        Name: WebServer
        Type: Standard
          
Outputs:
  PyTrimPrivateECRRepoName:
    Value: !Ref ContainerRepository

  PyTrimPrivateECRRepoUri:
    Value: !GetAtt ContainerRepository.RepositoryUri

  PyTrimDockerizedStateMachineArn:
    Value: !Ref DockerStateMachineWrapper
