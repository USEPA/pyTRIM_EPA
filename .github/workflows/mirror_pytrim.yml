name: Sync pyTRIM EPA GitHub Mirror
on: [push, workflow_dispatch]
concurrency:
  group: mirror_repo
jobs:
  mirror_repo:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ICF-Corp/trim-builder' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add SSH Private Keys
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.TRIM_SOURCE_SSH_PRIVATE_KEY }}" > ~/.ssh/trim_src_key
          echo "${{ secrets.TRIM_MIRROR_SSH_PRIVATE_KEY }}" > ~/.ssh/trim_mirror_key
          chmod 600 ~/.ssh/trim_src_key
          chmod 600 ~/.ssh/trim_mirror_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/trim_src_key
          ssh-add ~/.ssh/trim_mirror_key

      - name: Clone Source
        run: cd ~ && git clone --bare git@github.com:ICF-Corp/trim-builder.git

      - name: Push Mirror
        run: cd ~/trim-builder.git && git push --mirror git@github.com:USEPA/pyTRIM_EPA.git
