<div class="row mx-0 justify-content-end mb-2">
    <a href="#" class="simulation-btn text-decoration-none" data-action="overview" title="Back" tabindex="0">
        &lt; Back to Overview
    </a>
</div>
<div class="card">
    <div class="card-header">
        <div class="container mx-0 mb-1 px-0">
            <div id="current-simulation-actions" class="float-right">
                <a href="#clone-simulation" class="simulation-btn ml-2 text-dark text-decoration-none" title="Clone" data-action="clone">
                    <i class="fa fa-clone"></i>
                </a>
                <a href="#delete-simulation" class="simulation-btn ml-2 text-danger text-decoration-none" title="Delete" data-action="delete">
                    <i class="fa fa-trash"></i>
                </a>
            </div>
            <span id="mirc-results-name" class="h5 mb-0">Simulation</span>
        </div>
        <div class="row mx-0">
            <span id="mirc-results-shortdesc">Profile, Date</span>
        </div>
    </div>
    <div class="card-body">
        <div class="container mx-0 px-0">
            <div id="mirc-results-desc" class="float-right">
                <a href="#simulation-details" data-toggle="modal" data-target="#simulation-desc-modal"
                >
                    <i class="fa fa-cog mr-1"></i>View Inputs
                </a>
            </div>
            <div id="simulation-description" class="lead mb-2"></div>
            <h5 class="card-title">Intake and Risk Results</h5>
        </div>

        <div id="simulation-error" style="display: none;">
            <div class="text-danger"></div>
        </div>

        <div id="results-chart-legend" class="container-fluid border-bottom my-2 pb-2">
        </div>

        <div id="results-chart" class="ct-chart mb-2">
        </div>

        <div id="results-download" class="text-right p-1" style="display: none;">
            <button type="button" id="export-btn" class="btn btn-sm btn-dark simulation-btn" data-action="export">
                <i class="fa fa-download mr-2"></i>Download Excel
            </button>
        </div>

        <div class="table-responsive">
            <table id="results-table" class="table table-striped table-bordered">
                <thead>
                    <tr class="headers">
                        <th scope="col" rowspan="2" style="display: none;">Fixed</th>
                        <th scope="col" rowspan="2">Product</th>
                        <th scope="col" rowspan="2">Concentration</th>
                        <th scope="col" rowspan="2" class="cursor-default" title="Concentration Units">
                            Units
                        </th>
                        <th scope="col" colspan="4" class="text-center p-0">
                            <select id="breakout-age"
                                name="breakout-age"
                                title="Age picker"
                                class="form-control font-weight-bold text-reset p-1 cursor-pointer"
                                style="text-align-last: center; text-align: center;"
                            >
                                <option value="Lifetime">Lifetime</option>
                            </select>
                        </th>
                    </tr>
                    <tr class="headers">
                        <th scope="col" title="Average Daily Dose">ADD</th>
                        <th scope="col" class="cursor-default" title="Average Daily Dose Units">
                            ADD Units
                        </th>
                        <th scope="col" title="Hazard Quotient">HQ</th>
                        <th scope="col">Cancer Risk</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="10" class="text-center table-light">
                            Loading Assessment results ...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        {% if current_user.is_superuser %}
            <div class="card mt-2">
                <div class="card-header p-0">
                    <a id="logToggle" href="#logCollapse"
                        class="btn-block font-weight-bold py-2 px-3 text-decoration-none"
                        aria-expanded="False" aria-controls="logCollapse"
                        data-toggle="collapse"
                    >
                        Logs
                    </a>
                </div>
                <div id="logCollapse"
                    class="card-body collapse"
                    aria-labelledby="logToggle"
                >
                    <ul id="results-log">
                    </ul>
                </div>
            </div>
        {% endif %}
    </div>
</div>

<div id="simulation-desc-modal" class="modal fade" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Simulation Inputs</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group form-row mb-1">
                    <label class="col-3 col-form-label py-0 font-weight-bold" for="exposure-profile">
                        Exposure Profile
                    </label>
                    <div class="col">
                        <input id="exposure-profile" name="exposure-profile" readonly="readonly"
                            class="form-control-plaintext py-0"
                            style="max-width: 100%;"
                            value="Loading ..."
                        />
                    </div>
                </div>
                <div class="form-group form-row mb-1">
                    <label class="col-3 col-form-label py-0 font-weight-bold" for="trim-timestamp">
                        Date
                    </label>
                    <div class="col">
                        <input id="trim-timestamp" name="trim-timestamp" readonly="readonly"
                            class="form-control-plaintext py-0"
                            style="max-width: 100%;"
                            value="Loading ..."
                        />
                    </div>
                </div>
                <div class="form-group form-row mb-2">
                    <label class="col-3 col-form-label py-0 font-weight-bold" for="fish-pathway">
                        Fish Calculation Type
                    </label>
                    <div class="col">
                        <input id="fish-pathway" name="fish-pathway" readonly="readonly"
                            class="form-control-plaintext py-0"
                            style="max-width: 100%;"
                            value="Loading ..."
                        />
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="simulation-inputs-table" class="table table-sm table-striped">
                        <thead>
                            <tr>
                                <th scope="col"></th>
                                <th scope="col">Value</th>
                                <th scope="col">Source</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Done</button>
            </div>
        </div>
    </div>
</div>

<script>
onDomLoad(function() {
    window.MIRC = (function(mirc) {
        
        mirc.loadResults = function(id, format) {
            LoadingScreen.show('getResults');

            format = format || 'json';

            var ans = $.Deferred();

            var url = '{{ url_for("mirc_simulation_api.get_results", trim_scenario_id=scenario.id, simulation_id=0) }}';

            $.ajax({
                url: url.replace('/0', '/' + id) + '?format=' + format,
                method: 'GET',
                contentType: 'application/json'
            }).then(function(data) {
                ans.resolve(data);
            }).fail(function(data, status, error) {
                ans.reject(data, status, error);
            }).always(function() {
                LoadingScreen.hide('getResults');
            });

            return ans.promise();
        };

        mirc.displayResults = function (id) {
            updateMeta({});

            var desc = $('#mirc-results-desc').hide();

            var err = $('#simulation-error').hide();

            var legend = $('#results-chart-legend').hide();
            var chart = $('#results-chart').hide();
            var tbl = $('#results-table').hide();

            var downloader = $('#results-download').hide();

            $('#results-log').empty();
            var logs = $('#logToggle').closest('.card').hide();

            if (!id) {
                window.MIRC.showScreen('details');
                return;
            }

            mirc.loadResults(id).then(function(data) {
                // console.log(data)
                updateMeta(data.meta);
                if (data.results == undefined || data.results.error) {
                    showErrors([
                        'Error in simulation; unable to load results.',
                        (data.results?.error || '')
                    ]);
                }
                else {
                    legend.show();
                    chart.show();
                    downloader.show();
                    tbl.show();
                    updateChart(data);
                    updateTable(data);
                }
                updateLog(data.logs);
                window.MIRC.currentSimulation = data;
            }).fail(function(data, status, error) {
                // console.log(data)
                var msg = ['Error in simulation; unable to load results.']
                if (data && data.responseJSON && data.responseJSON.message) {
                    msg.push(data.responseJSON.message);
                }
                showErrors(msg);
            }).always(function() {
                desc.show();
                logs.show();
                window.MIRC.showScreen('details');
            });

            function showErrors(msg) {
                var msgDiv = err.find('.text-danger').empty();
                for (var i = 0; i < msg.length; i++) {
                    if (!msg[i]) {
                        continue;
                    }
                    msgDiv.append($('<div/>').text(msg[i]));
                }
                err.show();
            }
        };

        mirc.downloadResults = function(id) {
            if (id != undefined) {
                mirc.loadResults(id, 'xlsx').then(function(data) {
                    if (data.success) {
                        var link = $('<a href="' + data.url + '">Download</a>');
                        link.attr('download', data.attachment_name);
                        link.css({'display': 'none'});
                        link.appendTo('body');
                        link[0].click();
                        link.remove();
                    }
                });
            }
            else {
                downloadAllResults().then(function(data) {
                    if (data.success) {
                        var link = $('<a href="' + data.url + '">Download</a>');
                        link.attr('download', data.attachment_name);
                        link.css({'display': 'none'});
                        link.appendTo('body');
                        link[0].click();
                        link.remove();
                    }
                });
            }
        };

        function downloadAllResults() {
            LoadingScreen.show('downloadAllResults');

            var ans = $.Deferred();

            var url = "{{ url_for('mirc_simulation_api.get_simulations', trim_scenario_id=scenario.id) }}";

            $.ajax({
                url: url + '?format=xlsx',
                method: 'GET',
                contentType: 'application/json'
            }).then(function(data) {
                ans.resolve(data);
            }).fail(function(data, status, error) {
                ans.reject(data, status, error);
            }).always(function() {
                LoadingScreen.hide('downloadAllResults');
            });

            return ans.promise();
        }

        return mirc;
    })(window.MIRC || {});

    $('#logAccordion').collapse();

    var tbl = $('#results-table');
    var riskTbody = $('#risk-results tbody');

    function simplifyUnit(unit, timeLast) {
        var simple = unit
            .replace(/gram/g, 'g')
            .replace(/milli/g, 'm')
            .replace(/kilo/g, 'k')
            .replace(/liter/g, 'L')
            .replace(/ /g, '');

        if (timeLast) {
            if (simple.indexOf('/day') > -1) {
                simple = simple.replace(/\/day/g, '');
                simple += '/day';
            }
        }

        return simple;
    }
    function asScientific(number, decimals) {
        if (number == null || number.toString() == '') {
            return '';
        }

        decimals = decimals || 0;
        var sci = Number.parseFloat(number).toExponential(decimals);
        sci = sci.replace(/e\+0/g, '').replace(/e\-0/g, '');
        if (parseFloat(sci) == 0) {
            return '0';
        }
        return sci;
    }
    function round(number, decimals) {
        var oldE = undefined;
        if (number.toString().indexOf('e') > -1) {
            number = number.toString().split('e');
            oldE = parseInt(number[1]);
            number = number[0];
        }
        var n = Number(Math.round(number + 'e' + decimals) + 'e-' + decimals);
        if (oldE != undefined) {
            return n + 'e' + oldE;
        }
        return n;
    }

    var timeDisplayOpts = {
        year: "numeric",
        month: "long",
        day: "numeric",
    };

    function updateMeta(meta) {
        var chemical = meta.chemical || {};

        var actions = $('#current-simulation-actions');
        actions.find('[data-action="clone"]').data('simulation_id', meta._id);
        actions.find('[data-action="delete"]').data('simulation_id', meta._id);

        $('#export-btn').data('simulation_id', meta._id);

        if (meta.name != undefined) {
            var simNum = parseInt(meta.name?.replace('Simulation', '').trim());

            $('#mirc-results-name').text(
                `(${simNum}) ${chemical.name} Simulation (CAS ${chemical.cas_number?.replace(/ /g, '')})`
            );
            $('#mirc-results-shortdesc').text(
                `${(new Date(meta.timestamp)).toLocaleDateString('en-US', timeDisplayOpts)} | ${meta.exposureProfile?.name}`
            ).show();
        }
        else {
            $('#mirc-results-name').text(
                'Simulation Not Found'
            );
            $('#mirc-results-shortdesc').hide();
        }

        if (meta.description) {
            $('#simulation-description').text(meta.description).show();
        }
        else {
            $('#simulation-description').hide();
        }

        $('#exposure-profile').val(meta.exposureProfile?.name);

        $('#fish-pathway').val(meta.fishPathway);

        meta.fishPathway = meta.fishPathway || '';
        meta.percentiles = meta.percentiles || {};
        meta.other_parameters = meta.other_parameters || [];

        function getInput(name) {
            var param = meta.other_parameters.filter(x => x.variable_name == name);
            if (param.length) {
                return param[0];
            }
            return undefined;
        }

        var tt = $('#trim-timestamp').val((new Date(meta.timestamp)).toLocaleDateString('en-US', timeDisplayOpts));
        if (!(tt.val() || '').length) {
            tt.closest('.form-group').hide();
        }
        else {
            tt.closest('.form-group').show();
        }

        function findFish(trophicLevel) {
            var param = meta.other_parameters
                .filter(x => x.full_name.indexOf(`Average Concentration in Trophic Level ${trophicLevel}`) == 0);
            if (param.length) {
                return param[0];
            }
            return undefined;
        }

        var otherInputs = $('#simulation-inputs-table tbody').empty();

        function addPercentile(name) {
            var pct = meta.percentiles[name];
            if (pct == undefined) {
                return;
            }

            var tr = $('<tr />').appendTo(otherInputs);

            if (name == 'body_weight') {
                $('<th scope="row" />').text('Body Weight Percentile').appendTo(tr);
            }
            else {
                function toTitleCase(s) {
                    return s.toLowerCase().split(' ').map(x => x[0].toUpperCase() + x.slice(1)).join(' ')
                }
                $('<th scope="row" />').text(`${toTitleCase(name.replace(/_/g, ' '))} Ingestion Rate Percentile`).appendTo(tr);
            }
            $('<td />').text(pct).appendTo(tr);
            $('<td />').appendTo(tr);
        }

        function addInput(name) {
            var param = getInput(name);
            if (param == undefined) {
                return;
            }

            var tr = $('<tr />').appendTo(otherInputs);

            $('<th scope="row" />').html(param.full_name || param.variable_name).appendTo(tr);

            var val = param.value;
            try {
                if (
                    (val > 0 && (val < 0.0001 || val > 1_000_000))
                    || (val < 0 && (val > -0.0001 || val < -1_000_000))
                ) {
                    val = val.toExponential(2);
                }
            }
            catch (err) {
                // console.log(err)
                val = param.value; // don't worry
            }
            $('<td />').text(val == 0 ? val : val || '').appendTo(tr);

            $('<td />').text(param.source || '').appendTo(tr);
        }

        addPercentile('body_weight');
        if (meta.usesAermod) {
            addInput('Ca');
            addInput('Fv');
            addInput('rho_a');
        }
        addInput('C_water');
        addInput('C_soil');
        addInput('C_root_veg');
        addInput('C_root_veg');
        addInput('Kd');
        addInput('Cs_s');
        addInput('Kd_feed');
        addInput('Drdp');
        addInput('Drwp');
        if (meta.fishPathway.toLowerCase() == 'direct') {
            var fishParam = findFish(3.5);
            addInput(fishParam?.variable_name);
            var fishParam = findFish(4);
            addInput(fishParam?.variable_name);
        }
        else {
            addInput('C_sed');
            addInput('C_surf_water');
            addInput('FMD');
        }
        for (var pct in meta.percentiles) {
            if (pct != 'body_weight' && pct != 'breast_milk') {
                addPercentile(pct);
            }
        }
    }

    function standardProductName(product) {
        var str = product.replace(/\_/g, ' ');
        var name = str.toLowerCase().split(' ').map(function(word) {
            return word.replace(word[0], word[0].toUpperCase());
        }).join(' ');
        if (name == 'Root') {
            name = 'Root Vegetable';
        }
        return name;
    }

    function updateTable(simulation) {
        var results = simulation.results;

        function formatChildRow(data) {
            var t = document.createElement('table');
            t.className = 'table table-sm m-0';

            if (!data.risk) {
                return t.outerHTML;
            }

            var thead = document.createElement('thead');
            var tr = document.createElement('tr');
            tr.className = 'bg-transparent cursor-default';

            var th = document.createElement('th');
            th.innerText = 'Life Stage';
            tr.appendChild(th);

            th = document.createElement('th');
            th.colSpan = 2;
            th.innerText = 'ADD';
            if (data.chemical.mutagenic) {
                th.innerText = 'Base ADD';
            }
            th.title = 'Average Daily Dose';
            tr.appendChild(th);

            if (data.chemical.mutagenic) {
                th = document.createElement('th');
                th.colSpan = 2;
                th.innerText = 'Adjusted ADD';
                th.title = 'Adjusted Average Daily Dose';
                tr.appendChild(th);
            }

            th = document.createElement('th');
            th.innerText = 'HQ';
            th.title = 'Hazard Quotient';
            tr.appendChild(th);

            th = document.createElement('th');
            th.innerText = 'Cancer Risk';
            tr.appendChild(th);

            thead.appendChild(tr);
            t.appendChild(thead);

            var tb = document.createElement('tbody');
            t.appendChild(tb);

            $.each(data.risk, function(age, riskData) {
                var tr = document.createElement('tr');

                var td = document.createElement('td');
                td.innerText = age;
                tr.appendChild(td);

                var i = riskData.intake;
                if (i == null) {
                    i = {value: NaN, unit: ''};
                }
                td = document.createElement('td');
                td.style.whiteSpace = 'nowrap';
                td.innerText = asScientific(i.value, 4);
                tr.appendChild(td);
                td = document.createElement('td');
                td.innerText = simplifyUnit(i.unit, true);
                tr.appendChild(td);

                if (data.chemical.mutagenic) {
                    var adj = riskData.adjusted_intake;
                    if (adj == null) {
                        i = {value: NaN, unit: ''};
                    }
                    td = document.createElement('td');
                    td.style.whiteSpace = 'nowrap';
                    td.innerText = asScientific(adj.value, 4);
                    tr.appendChild(td);
                    td = document.createElement('td');
                    td.innerText = simplifyUnit(adj.unit, true);
                    tr.appendChild(td);
                }

                var hq = riskData.hazard_quotient;
                td = document.createElement('td');
                td.style.whiteSpace = 'nowrap';
                if (hq == null) {
                    td.innerText = 'N/A';
                }
                else {
                    td.innerText = asScientific(hq, 4);
                }
                tr.appendChild(td);


                var r = riskData.risk_factor;
                td = document.createElement('td');
                td.style.whiteSpace = 'nowrap';
                if (r == null) {
                    td.innerText = 'N/A';
                }
                else {
                    td.innerText = asScientific(r, 4);
                }
                tr.appendChild(td);

                tb.appendChild(tr);
            });

            return t.outerHTML;
        }

        var data = [];
        $.each(results, function(product, info) {
            var fixed = 0;
            if (product.toLowerCase() == 'total') {
                fixed = 1e10;
            }
            data.push({
                fixed: fixed,
                chemical: simulation.meta.chemical,
                product: product,
                concentration: info.concentration,
                risk: info.risk
            });
        });

        // Remove any old headers
        tbl.find('thead tr').each(function() {
            if (this.className != 'headers') {
                $(this).remove();
            }
        });

        if (!data.length) {
            return;
        }

        // Get the breakout selector
        var ageSelect = $('#breakout-age');

        // Initialize base data
        var dt = tbl.DataTable({
            destroy: true, // override previous initialization
            dom: 't', // only show the table
            data: data,
            paging: false,
            aaSortingFixed: [[0, 'desc']],
            order: [[1, 'asc']],
            columns: [
                {
                    title: 'Fixed',
                    data: 'fixed',
                    orderable: false,
                    visible: false
                },
                {
                    title: 'Product',
                    data: 'product',
                    className: 'cursor-pointer',
                    render: function(data, type, row, meta) {
                        var d = document.createElement('div');
                        d.className = 'd-flex';
                        d.setAttribute("tabindex", "0");
                        d.innerText = standardProductName(data);

                        if (row.risk != null) {
                            var fa = document.createElement('i');
                            fa.className = 'ml-auto mt-1 fa fa-plus-circle';
                            d.appendChild(fa);
                        }

                        return d.outerHTML;
                    }
                },
                {
                    title: 'Concentration',
                    data: 'concentration',
                    className: 'white-space-nowrap text-right',
                    render: function(data, type, row, meta) {
                        if (data == undefined) {
                            return 'N/A';
                        }
                        return asScientific(data.value, 4);
                    }
                },
                {
                    title: 'Units',
                    data: 'concentration',
                    orderable: false,
                    render: function(data, type, row, meta) {
                        if (data == undefined) {
                            return '';
                        }
                        var u = simplifyUnit(data.unit);
                        // if (u) {
                        //     if (row.product == 'soil') {
                        //         u += ' dry weight';
                        //     }
                        //     else if (row.product != 'water') {
                        //         u += ' wet weight';
                        //     }
                        // }
                        return u;
                    }
                },
                {
                    title: 'ADD',
                    data: 'risk',
                    className: 'white-space-nowrap text-right',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var add = data[ageSelect.val()].intake;
                        if (data[ageSelect.val()].adjusted_intake) {
                            add = data[ageSelect.val()].adjusted_intake;
                        }
                        return asScientific(add.value, 4);
                    }
                },
                {
                    title: 'ADD Units',
                    data: 'risk',
                    orderable: false,
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var add = data[ageSelect.val()].intake;
                        if (data[ageSelect.val()].adjusted_intake) {
                            add = data[ageSelect.val()].adjusted_intake;
                        }
                        return simplifyUnit(add.unit, true);
                    }
                },
                {
                    title: 'HQ',
                    data: 'risk',
                    className: 'white-space-nowrap text-right',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var hq = data[ageSelect.val()].hazard_quotient;
                        if (hq == null) {
                            return 'N/A';
                        }
                        return asScientific(hq, 4);
                    }
                },
                {
                    title: 'Cancer Risk',
                    data: 'risk',
                    className: 'white-space-nowrap text-right',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var risk = data[ageSelect.val()].risk_factor;
                        if (risk == null) {
                            return 'N/A';
                        }
                        return asScientific(risk, 4);
                    }
                }
            ]
        });

        // Initialize breakout options
        ageSelect.empty();
        var sortedAges = Object.keys(results.total.risk).sort((a, b) => {
            if (a.indexOf('Lifetime') == 0) {
                return 1; // Lifetime comes after everything
            }
            if (a.indexOf('Adult') == 0) {
                return b.indexOf('Lifetime') == 0 ? -1 : 1; // Adult comes after everything except Lifetime
            }
            if (a.indexOf('Child') == 0) {
                if (a.indexOf('<') > -1) {
                    return -1; // Child<* comes before anything
                }
                if (b.indexOf('Child') < 0) {
                    return -1; // Child* comes before anything that isn't Child*
                }
                // Else check if Child[a] is younger than Child[b]
                var aAgeStart = parseInt(a.split(' ')[1].split('-')[0]);
                var bAgeStart = parseInt(b.split(' ')[1].split('-')[0])
                return aAgeStart < bAgeStart ? -1 : 1;
            }
            return 0; // else no opinion
        });
        $.each(sortedAges, function(i, age) {
            var etc = results.total.risk[age];
            ageSelect.append($('<option />').val(age).text(age));
        });
        ageSelect.val('Lifetime').off('change').change(function() {
            dt.rows().invalidate('data');
            dt.draw();
            updateChart(simulation, this.value);
        });

        // Initialize filter fields
        var tr = $('<tr />');
        tbl.find('thead').append(tr);
        tr.append('<th style="display: none;" /><th /><th /><th /><th /><th /><th /><th />')
            .find('th').each(function(i) {
                var th = $(this);
                th.addClass('p-0');
                th.attr("scope", "col");
                th.html('<input type="text" class="form-control form-control-sm" placeholder="filter" />');

                var last = undefined;
                $('input', this).on('keyup change', function () {
                    var s = this.value;
                    if (last !== s) {
                        last = s;
                        dt.draw();
                    }
                });
            });
        $.fn.dataTable.ext.search.push(
            function(settings, searchData, index, rowData, counter) {
                if (rowData.fixed) {
                    return true;
                }

                var include = true;
                $('thead input[placeholder="filter"]').each(function(i) {
                    var s = this.value.toLowerCase();
                    if (searchData[i].toLowerCase().indexOf(s) < 0) {
                        include = false;
                        return false;
                    }
                });

                return include;
            }
        );

        // Initialize child rows
        tbl.off('click keydown', 'td.cursor-pointer');
        tbl.on('click keydown', 'td.cursor-pointer', function(e) {
            if (e.type !== 'click' && (e.key !== 'Enter' && e.which !== 13)) {
                return;
            }

            var td = $(this);
            var fa = td.find('.fa');

            if (!fa.length) {
                return;
            }

            fa.toggleClass('fa-plus-circle').toggleClass('fa-minus-circle');

            var row = dt.row(td.closest('tr'));
            if (row.child.isShown()) {
                row.child.hide();
            }
            else {
                row.child(formatChildRow(row.data())).show();
            }
        });
        
        tbl.find('thead').css('background', 'rgba(0, 0, 0, 0.05)');

        tbl.find('tbody tr').each(function() {
            var tr = $(this);
            if (tr.html().indexOf('Total') > -1) {
                tr.addClass('font-weight-bold');
                tr.css('background', 'rgb(241, 105, 19, 0.35)');
                tr.find('td').css('border-bottom-width', '2px');
                return false;
            }
        });
    }

    var alph = 'abcdefghijklmnopqrstuvwxyz';

    function updateChart(simulation, age, factor) {
        age = age || 'Lifetime';
        factor = factor || $('#factor-select').val() || 'intake';

        var results = simulation.results;

        function getVals(info) {
            if (info.risk == null || $.isEmptyObject(info.risk)) {
                return {
                    intake: 0,
                    hazard: 0,
                    risk: 0
                };
            }

            i = info.risk[age].adjusted_intake;
            iu = '';
            if (i == null) {
                i = info.risk[age].intake;
            }
            if (i == null) {
                i = 0;
            }
            else {
                // iu = ' ' + i.unit;
                i = i.value;
            }

            hq = info.risk[age].hazard_quotient;
            if (hq == null) {
                hq = 0;
            }
            else {
                hq = hq;
            }

            rf = info.risk[age].risk_factor;
            if (rf == null) {
                rf = 0;
            }
            else {
                rf = rf;
            }

            return {
                intake: i,
                intakeUnits: iu,
                hazard: hq,
                risk: rf
            };
        }

        var products = [];

        var productData = {};

        var percents = {intake: [], hazard: []};
        var otherPercent = {intake: 0, hazard: 0};

        function setPercent(name, vals, factorName) {
            var v = vals[factorName] / total[factorName];
            if (v < 0.01) {
                otherPercent[factorName] += v;
                v = 0;
            }
            if (factorName == 'intake' && Number.isNaN(v)) {
                productData[name] = null;
            }
            percents[factorName].push(v);
        }

        var total = getVals(results.total);
        var sortedResults = [];
        $.each(results, function(product, info) {
            if (product.toLowerCase() == 'total') {
                return;
            }
            var vals = getVals(info);
            vals.product = standardProductName(product);
            sortedResults.push(vals);
        });
        sortedResults.sort(function(a, b) {
            return b.intake - a.intake;
        })
        $.each(sortedResults, function(i, vals) {
            var name = vals.product
            products.push(name);

            productData[name] = vals;

            setPercent(name, vals, 'intake');
            setPercent(name, vals, 'hazard');
        });

        var targetPercents = percents[factor];
        var sigPaths = targetPercents.filter(x => x != 0 && !Number.isNaN(x)).length;
        if (otherPercent[factor] > 0) {
            products.push('Other');
            targetPercents.push(otherPercent[factor]);
            productData['Other'] = null;
        }

        var legend = $('#results-chart-legend').empty();

        function addKpis() {
            function makeKpi(title, value) {
                var col = $('<div class="col-lg-4 mb-4" />');
                var card = $('<div class="card border-left-primary shadow h-100" />').appendTo(col);
                var cardBody = $('<div class="card-body p-3" />').appendTo(card);

                $('<small class="d-block font-weight-bold text-uppercase mb-1 text-muted" />')
                    .text(title)
                    .appendTo(cardBody);
                $('<div class="h5 mb-0 font-weight-bold text-gray-800" />')
                    .text(value)
                    .appendTo(cardBody);

                return col;
            }

            var kpiRow = $('<div class="row" />').prependTo(legend);
            if (Number.isNaN(targetPercents[0])) {
                makeKpi('Primary Path', 'N/A').appendTo(kpiRow);
            }
            else {
                makeKpi('Primary Path', `${products[0]} (${round(parseFloat(targetPercents[0]) * 100, 2)}%)`)
                    .appendTo(kpiRow);
            }
            makeKpi('Total Risk', `${round(total.risk, 3)}`)
                .appendTo(kpiRow);
            makeKpi('Significant Paths', `${round(sigPaths, 2)}`)
                .appendTo(kpiRow);
        }

        if (targetPercents.filter(x => !Number.isNaN(x)).length < 1) {
            addKpis();
            $('#results-chart').hide();
            return;
        }
        legend.show();
        $('#results-chart').show();

        function shadowOn(e) {
            var path = $(e.target);
            var g = path.closest('g');
            var shadow = path.clone();
            shadow.attr({
                class: 'ct-slice-pie ct-shadow',
                stroke: '#9f4912',
                fill: 'none',
                'stroke-width': 4,
                'stroke-opacity': 0.6,
                'fill-opacity': 1
            });
            g.parent().append(shadow); // make sure highlighting is on top

            g.popover('show');
        }

        function shadowOff(e) {
            var path = $(e.target);
            var g = path.closest('g');
            var shadow = g.parent().find('.ct-shadow');
            shadow.remove();

            g.popover('hide')
        }

        $('#results-chart').empty();
        var chart = new Chartist.Pie('#results-chart', {
            series: targetPercents
        }, {
            width: '100%',
            height: '280px',
            chartPadding: 10,
            ignoreEmptyValues: true,
            showLabel: false,
            plugins: [
                Chartist.plugins.hover({
                    onMouseEnter: shadowOn,
                    onMouseLeave: shadowOff
                })
            ]
        });

        chart.on('created', function() {
            legend.empty();

            $('#results-chart .ct-slice-pie').each(function() {
                var path = $(this);
                var g = path.closest('g');

                var row = legend.find('.row').last();
                if (!row.length || row.children().length == 4) {
                    row = $('<div class="row" />');
                    legend.append(row);
                }

                prodIdx = -1;
                $.each(g[0].className.baseVal.split(' '), function(i, val) {
                    if (val.indexOf('ct-series-') > -1) {
                        prodIdx = alph.indexOf(val.replace('ct-series-', ''));
                    }
                });

                var name = products[prodIdx];

                var entry = $('<div class="col-sm" />');
                var dot = $('<span class="d-inline-block rounded-circle p-2 mt-2 mr-2" />');
                dot.css({
                    'background-color': path.css('fill'),
                    'margin-bottom': '-0.15rem'
                });
                entry.append(dot);
                var pct = path.attr('ct:value');
                pct = round(parseFloat(pct) * 100, 2);
                if (!Number.isNaN(pct)) {
                    entry.append(
                        '<span>'
                        + name + ', ' + pct + '%'
                        + '</span>'
                    );
                }
                else {
                    entry.append(
                        '<span>'
                        + name + ', N/A'
                        + '</span>'
                    );
                }
                row.append(entry);

                var pData = productData[name];

                var content = '';
                if (name == 'Other') {
                    content = '<b>Other</b>';
                    name = '';
                }
                else if (pData == null) {
                    content = 'N/A'
                }
                else {
                    var addName = 'ADD';
                    if ($('#breakout-age').val() == 'Lifetime') {
                        addName = 'LADD';
                    }
                    content = (
                        '<b>' + addName + ':</b>&nbsp;' + asScientific(pData.intake, 4) + pData.intakeUnits
                        + '<br/><b>Hazard Quotient:</b>&nbsp;' +  asScientific(pData.hazard, 4)
                        + '<br/><b>Cancer Risk:</b>&nbsp;' +  asScientific(pData.risk, 4)
                    );
                }

                g.popover({
                    trigger: 'manual',
                    container: 'body',
                    title: name,
                    html: true,
                    content: content
                });
            });
            var row = legend.find('.row').last();
            while (row.children().length < 4) {
                row.append('<div class="col-sm" />');
            }

            // var factorRow = $('<div class="row justify-content-end" />').prependTo(legend);
            // $('<span class="form-text mt-0 mr-2" />').text('Show:').appendTo(factorRow);
            // var factorSelect = $('<select id="factor-select" class="custom-select custom-select-sm w-auto" />').appendTo(factorRow);
            // $('<option value="intake" />').text('ADD').prop('selected', factor == 'intake').appendTo(factorSelect);
            // $('<option value="hazard" />').text('HQ').prop('selected', factor == 'hazard').appendTo(factorSelect);
            // factorSelect.change(function() {
            //     updateChart(simulation, age);
            // });

            addKpis();
        });

        // console.log(targetPercents)
        if (targetPercents.every(function(x) { return Number.isNaN(x) || (x == 0); })) {
            $('#results-chart').hide();
        }
        else {
            $('#results-chart').show();
        }

        updateChartStyles(targetPercents, otherPercent[factor] > 0);
    }

    function updateLog(logs) {
        var log = $('#results-log');
        if (!log.length) {
            return;
        }

        var htmlLogs = [];
        var depth = 0;
        for (var i = 0; i < logs.length; i++) {
            var entry = logs[i];
            if (i > 0) {
                var d = 0;
                while (entry[d] == '\t') {
                    d++;
                }
                if (d <= depth) {
                    if (d < depth) {
                        htmlLogs.push('</li></ul>'); // close the previous sub-li & sub-ul
                        depth--;
                    }
                    htmlLogs.push('</li>') // close the previous li
                }
                else {
                    htmlLogs.push('<ul>'); // start a sub-ul
                    depth++;
                }
            }
            htmlLogs.push('<li>' + '<span>' + entry + '</span>');
        }
        if (htmlLogs.filter(x => x.indexOf('ul>') > 1).length % 2 != 0) {
            htmlLogs.push('</ul>');
        }
        if (htmlLogs.filter(x => x.indexOf('li>') > 1).length % 2 != 0) {
            htmlLogs.push('</li>');
        }
        log.append(htmlLogs.join(''));
    }

    function updateChartStyles(series, hasOther) {
        $('#chart-styles').remove();

        var seriesCount = series.filter(x => x != 0 && !Number.isNaN(x)).length; // we don't show 0-value entries

        var topThree = [
            '#A63603', // dark orange
            '#F16913', // medium orange
            '#FDBE85' // light orange
        ];
        var startGray = parseInt('4A', 16); // -> #4A4A4A
        var endGray = parseInt('D0', 16); //  -> #D0D0D0

        var colors = undefined;

        function toHexColor(num) {
            var hex = num.toString(16).padStart(2, '0');
            return `#${hex}${hex}${hex}`; // e.g., #4a4a4a
        }

        if (seriesCount <= 3 ) {
            colors = topThree.slice(0, seriesCount);
        }
        else {
            colors = Array.from(topThree);

            var numGrayscale = seriesCount - 3;

            var stepSize = numGrayscale > 1 ? (endGray - startGray) / (numGrayscale - 1) : 0;

            for (var i = 0; i < numGrayscale; i++) {
                colors.push(toHexColor(Math.round(startGray + i * stepSize)));
            }
        }

        if (hasOther) {
            // make sure the last value is the lowest grayscale, no matter the count
            colors = colors.slice(0, -1);
            colors.push(toHexColor(endGray))
        }

        // even though we don't show 0-value entries, we need dummy colors for them ...
        if (series.length > seriesCount) {
            var lastColor = colors.slice(-1)[0];
            colors = colors.slice(0, -1);
            while (colors.length < series.length - 1) {
                colors.push(null);
            }
            colors.push(lastColor);
        }

        var chartStyles = $('<style />').text(
            colors.map((val, i) => {
                if (val == null) {
                    return '';
                }
                var selector = `.ct-chart .ct-series-${alph[i]} .ct-slice-pie`;
                var options = [`fill: ${val}`];
                return `${selector} {\n\t${options.join(';\n\t')};\n}\n`;
            }).join('')
        );
        document.body.appendChild(chartStyles[0]);
    }
});
</script>
