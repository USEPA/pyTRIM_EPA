
<h4>
    <button type="button"
        class="btn btn-lg btn-block px-0 text-primary text-left border-light border-top-0 border-left-0 border-right-0 rounded-0"
        data-toggle="collapse" aria-expanded="true"
        data-target="#bm-collapse" aria-controls="bm-collapse"
        style="font-weight: 500;"
    >
        {{ form.breast_milk_parameters.label.text }}&nbsp;
        <small class="text-muted">
            <i class="fa fa-eye-slash"></i>
        </small>
    </button>
</h4>

<div id="bm-collapse" class="collapse show">    
    <div class="table-responsive">
    <table id="breast-milk-parameters" class="table table-sm table-bordered">
        <thead>
            <tr class="text-center">
                <th scope="col"
                    class="border-top-0 border-left-0 border-primary align-middle"
                >
                    Parameter
                </th>
                <th scope="col" class="table-primary border-primary align-middle">
                    Value
                </th>
                <th scope="col" class="table-primary border-primary align-middle">
                    Unit
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th colspan="3" class="table-light align-middle text-center">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </th>
            </tr>
        </tbody>
    </table>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var tbl = $('#breast-milk-parameters tbody');
        $.ajax({
            url: '{{ url_for("mirc_scenario.get_form_fragment") }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                name: 'breast_milk_parameter',
                parent: '{{ form.parent.data or "" }}',
                scenario_id: '{{ form.scenario_id.data or "" }}'
            })
        }).then(function(data) {
            tbl.find('tr').hide();
            tbl.append(data);
            // Enable popups
            $('[data-toggle="popover"]').popover();
        });
    });
    </script>
</div>

<hr />
