<form id="property-summary-gui"
    data-async-form="true"
    data-form-src="scenario_property_summary_form"
>
    <section class="container px-0">
        <div class="props-row row mb-3">
            <div class="col-sm">
                <h3 class="m-0">General Properties</h3>
                <div class="tree-grid-responsive my-2">
                    <div class="general-props-tree tree-grid" role="treegrid" aria-label="Chemical properties">
                        <div class="tree-row tree-row-header" role="row">
                            <div class="tree-cell" role="columnheader">Property</div>
                            <div class="tree-cell text-left" role="columnheader">Value</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="props-row row mb-3">
            <div class="col-sm">
                <div class="d-flex justify-content-between">
                    <h3>Chemical Properties</h3>
                    <div>
                        <button type="button" class="tree_grid_show_all btn btn-sm btn-secondary" data-show="false">
                            Show All
                        </button>
                        <button type="button" class="tree_grid_show_nz btn btn-sm btn-outline-dark">
                            Show Non-Zero
                        </button>
                    </div>
                </div>

                <div class="tree-grid-responsive my-2">
                    <div class="chemical-props-tree tree-grid" role="treegrid" aria-label="Chemical properties" style="--data-col-width: 280px;">
                        <div class="tree-row tree-row-header" role="row">
                            <div class="tree-cell" role="columnheader">Property</div>
                            <div class="tree-cell text-left" role="columnheader">Value</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="props-row row mb-3">
            <div class="col-sm">
                <div class="d-flex justify-content-between">
                    <h3>Environment Properties</h3>
                    <div>
                        <button type="button" class="tree_grid_show_all btn btn-sm btn-secondary" data-show="false">
                            Show All
                        </button>
                        <button type="button" class="tree_grid_show_nz btn btn-sm btn-outline-dark">
                            Show Non-Zero
                        </button>
                        <div class="dropdown d-inline">
                            <button type="button" class="tree_grid_show_prop btn btn-sm btn-outline-dark dropdown-toggle btn-character-limit" 
                                id="show-env-props" type="button" data-toggle="dropdown"
                            >
                                Show Property
                            </button>
                            <div class="dropdown-menu dropdown-menu-right">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tree-grid-responsive my-2">
                    <div class="compartment-props-tree tree-grid" role="treegrid" aria-label="Environment properties">
                        <div class="tree-row tree-row-header" role="row">
                            <div class="tree-cell" role="columnheader">Property</div>
                            <div class="tree-cell text-left" role="columnheader">Value</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
<script>
    onDomLoad(function(e) {
        var form = document.getElementById('property-summary-gui');

        form.addEventListener('form:visible', function() {
            console.log('property summary form visible')
            LoadingScreen.show('property_summary_loading');
            TRIM.api.getChemicalProperties('{{ scenario.id }}').on('load', function () {
                TRIM.store.currentScenario.chemical_properties = this.responseJSON
            });
            TRIM.api.getMeteorology(TRIM.store.currentScenario).on('load', function () {
                TRIM.store.currentScenario.meteorology = this.responseJSON.meteorology;
            });
            document.body.removeEventListener('parcels:ready', updateSummaryFields);
            document.body.addEventListener('parcels:ready', updateSummaryFields);
            TRIM.refreshParcels();
            
            attachGlobalEventHandlers();
        });

        function attachGlobalEventHandlers() {
            const gui = $(form);

            gui.find('.tree_grid_show_all').on('click', function(e) {
                e.preventDefault();
                showAll($(this).closest('.props-row').find('.tree-grid'));
            });

            gui.find('.tree_grid_show_nz').on('click', function(e) {
                e.preventDefault();
                showNonZero($(this).closest('.props-row').find('.tree-grid'));
            });

            gui.on('click', "a.dropdown-item.prop-select-item", function (e) {
                e.preventDefault();
                const me = $(e.target);
                const tree = me.closest('.props-row').find('.tree-grid');
                showPropValues(tree, me.text());
            });
        }

        function updateSummaryFields() {
            if (
                !TRIM.store.currentScenario
                || !TRIM.store.currentScenario.parcels
                || !TRIM.store.currentScenario.chemical_properties
                || !TRIM.store.currentScenario.meteorology
            ) {
                // Parcels haven't loaded yet; wait a bit and try again
                setTimeout(function() { updateSummaryFields(); }, 1000);
                return;
            }

            buildGeneralPropsTree();
            buildChemicalPropsTree();
            buildCompartmentPropsTree();

            console.log('populated property summary form!')
            LoadingScreen.hide('property_summary_loading');
        }

        function buildPropsTree(tree, propsMap, options) {
            options = options || {};
            const levels = options.levels || 2;

            tree.find('.tree-row:not(.tree-row-header)').remove();

            const collapseBtnClass = 'tree-row-collapse btn btn-block bg-transparent border-0 rounded-0 text-left text-body font-weight-bold';

            let treeHTML = '<div>';
            for (const header in propsMap) {
                if (levels == 2) {
                    treeHTML += `
                        <div class="tree-row" role="row" aria-level="1" aria-expanded="true">
                            <div class="tree-cell p-0" role="gridcell">
                                <button type="button" class="${collapseBtnClass} btn-primary" aria-label="Collapse ${header} properties">
                                    <i class="fas fa-angle-down mr-1"></i>
                                    <span>${header} Properties</span>
                                </button>
                            </div>
                            <div class="tree-cell text-left" role="gridcell"></div>
                        </div>`;
                    for (const prop in propsMap[header]) {
                        const val = propsMap[header][prop];
                        treeHTML += `
                            <div class="tree-row tree-level-1 font-weight-normal" role="row" aria-level="2" aria-expanded="true">
                                <div class="tree-cell" role="gridcell">
                                    <span class="prop-name">${prop}</span>
                                </div>
                                <div class="tree-cell text-left prop-val" role="gridcell" data-numeric="${val}">${val}</div>
                            </div>`;
                    }
                }
                else {
                    treeHTML += `
                        <div class="tree-row" role="row" aria-level="1" aria-expanded="true">
                            <div class="tree-cell p-0" role="gridcell">
                                <button type="button" class="${collapseBtnClass} btn-primary" aria-label="Collapse ${header} properties">
                                    <i class="fas fa-angle-down mr-1"></i>
                                    <span>${header}</span>
                                </button>
                            </div>
                            <div class="tree-cell text-left" role="gridcell"></div>
                        </div>`;
                    for (const subheader in propsMap[header]) {
                        treeHTML += `
                            <div class="tree-row tree-level-1" role="row" aria-level="2" aria-expanded="true">
                                <div class="tree-cell p-0" role="gridcell">
                                    <button type="button" class="${collapseBtnClass} btn-secondary" aria-label="Collapse ${subheader} properties">
                                        <i class="fas fa-angle-down mr-1"></i>
                                        <span>${subheader} Properties</span>
                                    </button>
                                </div>
                                <div class="tree-cell text-left" role="gridcell"></div>
                            </div>`;
                        let propBadge = '';
                        if (options.badgeFromLevel != undefined) {
                            const badgeLvl = options.badgeFromLevel;
                            propBadge = `
                                <span class="badge badge-pill badge-${badgeLvl == 1 ? 'primary' : 'secondary'} ml-1" style="line-height: 1.2em;">
                                    ${badgeLvl == 1 ? header : subheader}
                                </span>`;
                        }
                        for (const prop in propsMap[header][subheader]) {
                            const val = propsMap[header][subheader][prop];
                            const nameText = val.name ? val.name : (val.fieldname ? val.fieldname : prop);
                            const valText = val.value == null ? '-' : val.value;
                            const unitText = (val.unit == null || val.unit == '-' ? '' : ' ' + val.unit).replace(/\[.*?\]/g, '');
                            treeHTML += `
                                <div class="tree-row tree-level-2 font-weight-normal" role="row" aria-level="3" aria-expanded="true">
                                    <div class="tree-cell" role="gridcell">
                                        <span class="prop-name">${nameText}</span>${propBadge}
                                    </div>
                                    <div class="tree-cell text-left prop-val" role="gridcell" data-numeric="${valText}">${valText}${unitText}</div>
                                </div>`;
                        }
                    }
                }
            }
            treeHTML += '</div>';
            $(treeHTML).children().appendTo(tree);
            showAll(tree, false);
        }

        function buildGeneralPropsTree() {
            const tree = $('.general-props-tree');
            const scenario = TRIM.store.currentScenario;
            const propsMap = {
                "Simulation": {
                    "Start Date": scenario['simulation_start_date'],
                    "End Date": scenario['simulation_end_date'],
                    "Erosion Rate Source": "Option " + scenario['erosionRateSource']
                },
                "Scenario": {
                    // "Name": scenario['name'],
                    // "Description": scenario['description'],
                    "Precipitation Rate": scenario.parcels[0]?.precip_rate
                }
            };
            buildPropsTree(tree, propsMap);
        }

        function buildChemicalPropsTree() {
            const tree = $('.chemical-props-tree');
            buildPropsTree(tree, TRIM.store.currentScenario.chemical_properties, {levels: 3, badgeFromLevel: 1});
        }

        function buildCompartmentPropsTree() {
            const tree = $('.compartment-props-tree');
            const envMap = buildEnvMap();
            buildPropsTree(tree, envMap, {levels: 3, badgeFromLevel: 1});
            const envProps = [];
            for (const pcl in envMap) {
                for (const propType in envMap[pcl]) {
                    for (const prop in envMap[pcl][propType]) {
                        envProps.push(prop);
                    }
                }
                break;
            }
            populatePropsDropdown($("#show-env-props").siblings(".dropdown-menu"), envProps);
        }

        function toggleTreeGrid(tree, doOpen) {
            tree[0].dispatchEvent(new CustomEvent('tree-grid:toggle-all', {
                bubbles: true,
                detail: {
                    doOpen: doOpen
                }
            }));
        }

        function toggleTreeGridRows(rows, doOpen) {
            rows.each(function() {
                this.dispatchEvent(new CustomEvent('tree-grid:toggle', {
                    bubbles: true,
                    detail: {
                        doOpen: doOpen,
                        skipChildren: true,
                    }
                }));
            });
        }

        function updateShowPropText(tree, txt) {
            tree.closest('.props-row').find('.tree_grid_show_prop').text(txt);
        }

        function resetShowPropText(tree) {
            updateShowPropText(tree, 'Show Property');
        }

        function showAll(tree, doShow) {
            const btn = tree.closest('.props-row').find('.tree_grid_show_all');
            if (doShow === true || (btn.data('show') == 'true' && doShow !== false)) {
                btn.data('show', 'false').text('Hide All');
                toggleTreeGrid(tree, true);
            }
            else {
                btn.data('show', 'true').text('Show All');
                toggleTreeGrid(tree, false);
            }
            resetShowPropText(tree);
        }

        function showByFilter(tree, filterFunc) {
            showAll(tree, false); // close others first
            toggleTreeGridRows(tree.find('.tree-row[aria-level]').filter(filterFunc), true);
            resetShowPropText(tree);
        }

        function showNonZero(tree) {
            showByFilter(tree, (i, el) => {
                const val = $(el).find('.prop-val').data('numeric');
                return (
                    val > 0 || (val && parseInt(val) == NaN && val != '-')
                )
            });
        }

        function showPropValues(tree, propName) {
            showByFilter(tree, (i, el) => $(el).find('.prop-name').text() == propName);
            updateShowPropText(tree, propName);
        }

        function populatePropsDropdown(dropdownMenu, propList){
            const uniqueEntries = [... new Set(propList)];
            uniqueEntries.sort().forEach(function(e) {
                $("<a href='#' class='dropdown-item prop-select-item'>" + e + "</a>")
                    .appendTo(dropdownMenu);
            });
        }
    });
</script>
