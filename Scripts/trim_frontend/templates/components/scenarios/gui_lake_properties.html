
<form id="lake-props-gui"
    data-async-form="true"
    data-form-src="scenario_lake_props_form"
>
    <section class="container px-0">
        <div class="row">
            <div class="col-md">
                <div class="pill pill-alert col-sm">
                    <small>
                        <strong>
                            <u>Click on the table cells to edit properties</u>. 
                        </strong>
                        <br><span style='color: firebrick;'>*</span> All editable cells are required.
                    </small>
                </div>
                <button id="toggleData" class="btn btn-outline-secondary mt-4" data-isactive="true">Show/Hide Non-Interactive Data</button> <sup><a href="javascript:void(0);" title="" data-toggle="popover" data-html="true" data-placement="left" data-content="Select to show or hide properties which cannot be edited directly. These are property values which the model calculates from other property values. You have the option to see the calculated values, but you cannot change them except by changing the other property values they depend on. The help text on the non-interactive properties specifies the dependent properties, and when you click on one of the non-interactive properties then any dependent properties on this page will be highlighted in blue." data-original-title="Non-Interactive Data"><i class="fa fa-question"></i></a></sup>
                <h4 class="mt-2">Water Column Properties</h4>
                <table class="hover wrap-text" id="LakeTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div class="row">
             <div class="col-md">
                 <h4 class="mt-4">Sediment Properties</h4>
                 <table class="hover wrap-text" id="SedTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                        </tr>
                    </thead>
                </table>
             </div>
        </div>
    </section>
</form>
 <div class="modal fade" id="WBP_editModal" tabindex="-1" role="dialog" aria-labelledby="ModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="WBP_ModalLabel">Modal title</h5>
                    <!--<button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>-->
                </div>
                <div class="modal-body">
                </div>
                <div class="modal-footer">
                    <a  class="btn btn-secondary" id="WBP_closeModalButton" data-dismiss="modal">Cancel</a>
                    <!-- <button type="button"  id="saveModalButton" class="btn btn-primary" data-dismiss="modal">Save</button> -->
                    <button type="button"  id="WBP_saveModalButton" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
 </div>
<link rel="stylesheet" href="{{url_for('static', filename='css/form_styles.css')}}"/>

</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/jquery.dataTables.min.js') }}">
</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/dataTables.bootstrap4.min.js') }}">
</script>
<script>
    onDomLoad(function() {
        let lkTable = $('#LakeTable').removeAttr('width').DataTable()
        let sdTable = $('#SedTable').removeAttr('width').DataTable()
        let default_water_data = {
            'Water Column pH':{
                'short_name':'water_ph',
                'is_editable': true,
                'default_value': 7.3,
                'unit': 'unitless',
                'min': 0,
                'max': 14,
                'helpText': 'Enter the pH of the water column. Valid values are 0 to 14. The default value of 7.3 is the midpoint of the optimal pH range for most aquatic organisms (6.5 to 8.0, a range provided by the U.S. EPA Casual Analysis/Diagnosis Decision Information System (CADDIS; available online at: https://www.epa.gov/caddis-vol2/caddis-volume-2-sources-stressors-responses-ph). Typical sources of site-specific values include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs.'
            },
            'Water Temperature':{
                'short_name':'water_temp',
                'is_editable': true,
                'default_value': 298,
                'unit': 'K',
                'min': Number.MIN_VALUE,
                'helpText': 'Enter the average water temperature. Valid values are > 0. The default value of 298 is from Table B-4-12 of U.S. EPA 2005 (Human Health Risk Assessment Protocol for Hazardous Waste Combustion Facilities). Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Depth':{
                'short_name':'mean_depth',
                'is_editable': true,
                'default_value': 1,
                'unit': 'm',
                'min': Number.MIN_VALUE,
                'helpText': 'Enter the average depth of the water column (i.e., lake depth). Valid values are > 0. There is no recommended default value. Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs.'
            },
            'Water Column Algae Density':{
                'short_name':'algae_density',
                'is_editable': true,
                'default_value': 0.0025,
                'unit': 'g [algae wet weight]/L [water]',
                'helpText': 'Enter the algae density (wet weight) in the water column. Valid values are >= 0. The default value of 0.0025 is from Millard et al. 1996 (Phytoplankton photosynthesis at two index stations in Lake Ontario 1987–1992: assessment of the long-term response to phosphorus control). A typical way of calculating a site-specific value uses lake depth and total phosphorus level: (0.4*TPhos+0.2*TPhos^1.4)/WaterColumnDepth, where Tphos = average total phosphorus level (µg/L = mg/m3; not a model input parameter) and WaterColumnDepth = Water Column Depth (m; a model input parameter), as adapted from Table 2 of Peters 1996 (The role of prediction in limnology).Then, divide by Water Column Depth (m) and divide by 1,000 to obtain the correct units. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Chloride Concentration':{
                'short_name':'chloride_conc',
                'is_editable': true,
                'default_value': 8,
                'unit': 'mg [chloride]/L [water]',
                'helpText': 'Enter the chloride ion concentration in the water column. Valid values are >= 0. The default value of 8 is from Table 1 (maximum value from streams without nearby roadways) of Kaushal et al. 2005 (Increased salinization of fresh water in the northeastern United States). Typical sources of site-specific values include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses) and local watershed watch programs. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Chlorophyll Concentration':{
                'short_name':'chlorophyll_conc',
                'is_editable': true,
                'default_value': 0.0029,
                'unit': 'mg [chlorophyll]/L [water]',
                'helpText': 'Enter the chlorophyll concentration in the water column. Valid values are >= 0. The default value of 0.0029 is from Table 1 (2.9 µg/L; median of average epilimnetic summer chlorophyll values from 43 North American lakes) of Nürnberg 1996 (Trophic state of clear and colored, soft- and hardwater lakes with special consideration of nutrients, anoxia, phytoplankton and fish). A typical source of site-specific values is the respective state department of environment or natural resources. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Organic Carbon Fraction in Suspended Sediments':{
                'short_name':'suspended_organic_carbon',
                'is_editable': true,
                'default_value': 0.02,
                'unit': 'unitless',
                'min': 0,
                'max': 1,
                'helpText': 'Enter the organic carbon fraction in sediments suspended in the water column. Valid values are 0 to 1. The default value of 0.02 is from Table 3 (assumed equivalent to the organic carbon fraction in sediments) of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). For site-specific values, it is typical to assume the same value as Water Body Organic Carbon Fraction in Sediment Bed (also a model input). See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Suspended Sediment Concentration':{
                'short_name':'suspended_sed_conc',
                'is_editable': true,
                'default_value': 0.05,
                'unit': 'kg [sediment particles]/m<sup>3</sup> [water]',
                'helpText': 'Enter the concentration of suspended sediments in the water column. Valid values are >= 0. The default value of 0.05 is based on the value of 0.088 used in the CalTOX model (see Table 1 of CalEPA 1996 [The Distribution of California Landscape Variables for CalTOX]). The data from which the 0.088 average was calculated (from 14 California water quality sites) had a large standard deviation (also 0.088). Screening scenarios have shown TRIM to be sensitive to this parameter, with higher values generally leading to lower concentrations in fish. As such, we utilize a more conservative default value of 0.05 (professional judgment), but we recommend utilizing site-specific values where available. Sources of site-specific data might include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs. See the TRIM User Guide for full reference information.'
            },
            'Water Column External Sediment Inflow from Other Water Bodies':{
                'short_name':'sed_inflow',
                'is_editable': true,
                'default_value': 0,
                'unit': 'kg [sediment particles]/d',
                'helpText': "Enter the volumetric inflow rate of suspended sediment received from other water bodies. Valid values are >= 0. The default value is 0 (i.e., assumption of no inflow from other water bodies). If that assumption is not valid, this inflow can be equal to (or some fraction of) the product of the other water body&#39;s discharge (which is based on that other water body&#39;s Water Column Flush Rate) and its Water Column Suspended Sediment Concentration, divided by 365 d."
            },
            'Water Column Sediment Deposition Velocity':{
                'short_name':'sed_deposition_vel',
                'is_editable': true,
                'default_value': 2,
                'unit': 'm [water]/d',
                'helpText': 'Enter the sediment deposition velocity in the water column. Valid values are >= 0. The default of 2 is for fine silt with a diameter of 0.005 mm and is from Section B.2.22 of U.S. EPA 1997 (Mercury study report to Congress, volume III: fate and transport of mercury in the environment). There is no typical source of site-specific values. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Sediment Discharge Rate':{
                'short_name':'sed_discharge_rate',
                'is_editable': false,
                'default_value': 2,
                'unit': 'kg [sediment particles]/y',
                'helpText': 'Volume of suspended sediment lost per year by the water column to discharge. Product of the Water Column Suspended Sediment Concentration and the Water Column Discharge Volumetric Rate\n' +
                    '<p><strong>= (Water Column Suspended Sediment Concentration * Water Column Discharge Volumetric Rate)</strong></p>'
            },
            'Water Column Flush Rate':{
                'short_name':'flush_rate',
                'is_editable': true,
                'default_value': 1,
                'unit': 'y<sup>-1</sup>',
                'min': Number.MIN_VALUE,
                'helpText': 'Enter the flush rate of the water column (the number of times per year that the water column is completely refreshed with new water). Valid values are > 0. There is no default value recommended. Typical sources of site-specific values include state departments of fish and wildlife or natural resources, and state or local lake stewardship programs. Otherwise, if water column retention time is available, the flush rate is a simple conversion: the ratio of 365 d to the water column retention time (also in unit of d). If a value is not available for flush rate or retention time, then flush rate will be calculated for you as the ratio of the water body&#39;s estimated annual discharge and the water body&#39;s volume, with the assumption that the water body maintains a constant volume, that is, water input (from precipitation, watershed runoff, groundwater seepage, and any contributions from other water bodies) is balanced against output (from evaporation and discharge).'
            },
            'Water Column Discharge Volumetric Rate':{
                'short_name':'discharge_vol_rate',
                'is_editable': false,
                'default_value': 2,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Volume of water lost per year by the water column to discharge. The Water Column Evaporation Volumetric Rate subtracted from the sum of the Precipitation Runoff Volumetric Rate from Land to Water Body, Precipitation Volumetric Rate to Water Body, Precipitation Seepage Volumetric Rate to Groundwater, and Water Column External Inflow from Other Water Bodies, assuming the lake maintains a constant volume (a simplifying assumption). That is, water inputs minus loss to evaporation.' +
                    '<p><strong>= (Precipitation Runoff Volumetric Rate from Land to Water Body + Precipitation Volumetric Rate to Water Body + Precipitation Seepage Volumetric Rate to Groundwater + Water Column External Water Inflow from Other Water Bodies) - Water Column Evaporation Volumetric Rate.</strong></p>'
            },
            'Water Column Evaporation Rate':{
                'short_name':'evaporation_rate',
                'is_editable': true,
                'default_value': 0.7,
                'unit': 'm [water]/y',
                'helpText': 'Enter the evaporation rate of the water body. Valid values are >= 0. The default value is 0.7, from Table 11 (approximately the value of 0.002 m/d [0.73 m/y] estimated for Wisconsin and Illinois, and similar to the value of 0.0021 m/d [0.77 m/y] estimated for many northeastern states) of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). This reference provides values for other states that range from 0.0011 m/d [0.40 m/y] in Maine and New Hampshire to 0.007 m/d [2.6 m/y] in Arizona, which might be more appropriate for site-specific simulations. See the TRIM User Guide Appendix for full reference information.'
            },
            'Water Column Evaporation Volumetric Rate':{
                'short_name':'evaporation_vol_rate',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Volume of water lost per year by the water column to evaporation. Product of the Water Column Evaporation Rate and the water body surface area.' +
                    '<p><strong>= (Water Column Evaporation Rate * water body surface area)</strong></p>'
            },
            'Water Column External Water Inflow from Other Water Bodies':{
                'short_name':'externalWaterInflow',
                'is_editable': true,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'The volumetric inflow rate of water received from other water bodies. The default value assumes no inflow from other water bodies. If the assumption of no inflow from other water bodies is not valid, this inflow can be equal to (or some fraction of) the other water body’s discharge, which is based on that other water body’s Water Column Flush Rate. To accomplish this, use the dropdown to identify the connecting water body (or bodies). Then click the green/blue icon, where you then will enter the fraction of the selected water body’s discharge that flows into this water body.'
            },
            'Precipitation Runoff Watershed Area':{
                'short_name':'connected_watershed_area',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>2</sup>',
                'helpText': "Portion of the modeling domain whose runoff terminates in this water body. Matrix multiplication on the matrix of parcel-to-parcel runoff fractions and the parcel surface areas. For the parcels directly sending runoff to the water body, it follows the flow lines upstream through the parcels contributing to those sending parcels, multiplying parcel areas by aggregate runoff fractions. For example: If a parcel sends 100% of its runoff directly to the water body, then that sending parcel&apos;s whole surface area is included in this Precipitation Runoff Watershed Area calculation. If Parcel A sends 10% of its runoff to Parcel B which sends 50% of its runoff to the water body, then the Precipitation Runoff Watershed Area calculation incorporates 10% * 50% = 5% of Parcel A&apos;s surface area and 50% of Parcel B&apos;s surface area."
            },
            'Precipitation Runoff Volumetric Rate from Land to Water Body':{
                'short_name':'connected_runoff_to_this_sw',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Volume of water inflow received per year by the water column from precipitation runoff from the watershed. Product of the precipitation rate, fraction of precipitation that contributes to overland runoff, and Precipitation Runoff Watershed Area' +
                    '<p><strong>= (precipitation rate * fraction of precipitation that contributes to overland runoff * Precipitation Runoff Watershed Area)</strong></p>' +
                    'If spatially-varying (i.e., parcel-specific) values are used for fraction of precipitation that contributes to overland runoff, then the math here would be: precipitation rate * sum across all parcels [parcel&#39;s fraction of precipitation that contributes to overland runoff * parcel&#39;s precipitation runoff area]'
            },
            'Precipitation Volumetric Rate to Water Body':{
                'short_name':'precip_vol_rate_to_SW',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Volume of water inflow received per year by the water column from direct precipitation. Product of the precipitation rate and the water body surface area \n' +
                    '<p><strong>= (precipitation rate * water body surface area)</strong></p>'
            },
            'Precipitation Seepage Volumetric Rate to Groundwater':{
                'short_name':'connected_seepage_to_gw',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [water]/y',
                'helpText': 'Volume of water inflow received per year by groundwater from precipitation seepage in the watershed, all of which is assumed to transfer to the water body water column. Product of the precipitation rate, fraction of precipitation that seeps into groundwater, and the Precipitation Runoff Watershed Area (assumes complete transfer to the water body water column)' +
                    '<p><strong>= (precipitation rate * fraction of precipitation that seeps into groundwater * Precipitation Runoff Watershed Area)</strong></p>'
            }
        }
        let default_sed_data = {
            'Sediment Bed Thickness':{
                'short_name':'bed_thickness',
                'is_editable': true,
                'default_value': 0.05,
                'unit': 'm',
                'min': Number.MIN_VALUE,
                'helpText': 'Enter the average thickness of the water body sediment bed (i.e., the unburied sediment). Valid values are > 0. The default value of 0.05 is from Table 3 of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). There is no typical source of site-specific values. See the TRIM User Guide Appendix for full reference information.'
            },
            'Sediment Bed Density':{
                'short_name':'bed_density',
                'is_editable': true,
                'default_value': 2600,
                'unit': 'kg [sediment particles]/m<sup>3</sup> [sediment particles]',
                'min': Number.MIN_VALUE,
                'helpText': 'Enter the density of dry sediment in the water bodys sediment bed (i.e., the unburied sediment). Valid values are > 0. The default value of 2600 is from Table 3 of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). There is no typical source of site-specific values. See the TRIM User Guide Appendix for full reference information.'
            },
            'Sediment Bed pH':{
                'short_name':'bed_pH',
                'is_editable': true,
                'default_value': 7.3,
                'unit': 'unitless',
                'min': 0,
                'max': 14,
                'helpText': 'Enter the pH of the water body sediment bed (i.e., the unburied sediment). Valid values are 0 to 14. The default value of 7.3 assumes equilibrium with the overlying surface water and is the midpoint of the optimal pH range for most aquatic organisms (6.5 to 8.0, a range provided by the U.S. EPA Casual Analysis/Diagnosis Decision Information System (CADDIS; available online at: https://www.epa.gov/caddis-vol2/caddis-volume-2-sources-stressors-responses-ph). Typical sources of site-specific values of water column pH include the Water Quality Portal of the National Water Quality Monitoring Council (available online at: http://www.waterqualitydata.us/; includes data from U.S. Geological Survey National Water Information System and U.S. Environmental Protection Agency STORET data warehouses), state department of environment or natural resources, and state or local watershed watch or lake stewardship programs.'
            },
            'Organic Carbon Fraction in Sediment Bed':{
                'short_name':'organic_carbon_frac',
                'is_editable': true,
                'default_value': 0.02,
                'unit': 'unitless',
                'min': 0,
                'max': 1,
                'helpText': 'Enter the organic carbon fraction in sediments in the sediment bed (i.e., the unburied sediment). Valid values are 0 to 1. The default value of 0.02 is from Table 3 of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). Also, approximately the lowest value obtained from surface sediments in 46 Minnesota lakes (range: 0.029 to 28.6), from Dean et al. 2006 (Characterization of organic matter in lake sediments from Minnesota and Yellowstone National Park). Many contaminants will sorb to organic carbon, so it is health-protective to assume a lower value. Sources of site-specific data might include state departments of natural resources or environmental protection: organic carbon content is measured when sediment samples are analyzed for organic contaminants. See the TRIM User Guide Appendix for full reference information.'
            },
            'Sediment Bed Porosity':{
                'short_name':'bed_porosity',
                'is_editable': true,
                'default_value': 0.6,
                'unit': 'unitless',
                'min': 0,
                'max': 1,
                'helpText': 'Enter the porosity of the sediment bed (i.e., the ratio of the volume of the pore space in the sediment bed to the overall volume of the sediment bed). Valid values are 0 to 1. The default value of 0.6 is based on the value of 0.2 used in Table 3 of McKone et al. 2001 (Development and evaluation of state-specific landscape data sets for multimedia source-to-dose models). Screening scenarios with TRIM have shown that higher values generally lead to higher concentrations in fish. As such, we utilize a more conservative default value of 0.6 (midpoint between 0.2 and 1.0; professional judgment). See the TRIM User Guide Appendix for full reference information. There are no typical sources of site-specific values.'
            },
            'Sediment Resuspension Velocity':{
                'short_name':'sed_resuspension_vel',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm/d',
                'helpText': 'Velocity of sediment returning to the water column (as suspended sediment) from the sediment bed. Ratio of the difference between the Water Body Sediment Deposition Volumetric Rate and the Water Body Sediment Burial Volumetric Rate to the difference between 1 and the Water Body Sediment Bed Porosity' +
                    '<strong><p>= (Water Body Sediment Deposition Volumetric Rate - Water Body Sediment Burial Volumetric Rate) / (1 - Water Body Sediment Bed Porosity)</p></strong>'
            },
            'Sediment Deposition Volumetric Rate':{
                'short_name': 'sed_deposition_vol_rate',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [sediment] /m<sup>2</sup> [sediment bed interface] /d',
                'helpText': 'Volume of sediment received per day by the water body’s sediment bed (per unit area) from the suspended sediment in the water column. Ratio of the product of the Water Column Sediment Deposition Velocity and the Water Column Suspended Sediment Concentration to the Sediment Bed Density.' +
                    '<strong><p>= (Water Column Sediment Deposition Velocity * Water Column Suspended Sediment Concentration / Sediment Bed Density)</p></strong>'
            },
            'Soil Erosion Rate to Water Body':{
                'short_name':'sed_soil_erosion_to_sw',
                'is_editable': false,
                'default_value': 0,
                'unit': 'kg [soil] / d',
                'helpText': 'Mass of soil per day eroding into the water body. Sum-product of the runoff fractions from parcel to water body, the parcel erosion rates, and the parcel surface areas, for the parcels directly adjacent to the water body. For example: If Parcel A sends 100% of its runoff directly to the water body, then that sending parcel&apos;s whole surface area is multiplied by that parcel&#39;s erosion rate. If Parcel B sends 10% of its runoff the water body, then 10% of that sending parcel&apos;s surface area is multiplied by that parcel&#39;s erosion rate.'
            },
            'Sediment Burial Volumetric Rate':{
                'short_name':'sed_burial_vol_rate',
                'is_editable': false,
                'default_value': 0,
                'unit': 'm<sup>3</sup> [sediment] /m<sup>2</sup> [sediment bed interface] /d',
                'helpText': 'Volume of sediment buried per day into the sediment bed (per unit area) from the suspended sediment in the water column. Ratio of the difference between the sum (across all contributing water bodies) of the Water Column External Sediment Inflow from Other Water Bodies and the Soil Erosion Rate to Water Body and the Water Column Sediment Discharge Rate (converted from kg/y to kg/d) to the product of the Water Body Sediment Bed Density and water body surface area.' +
                    '<strong><p>= (Water Column External Sediment Inflow from Other Water Bodies + Soil Erosion Rate to Water Body - [Water Column Sediment Discharge Rate]/365) / (Sediment Bed Density* water body surface area)</p></strong>'                
            }            
        }

        $('#toggleData').click(function(event){
            event.preventDefault()
            if ($(this).attr("data-isactive") == "true") {
                $(this).attr("data-isactive","false")
                $('.nonEditableCell').each(function(c){
                    $(this).closest("tr").css("display","none")
                })
            } else {
                $(this).attr("data-isactive","true")
                $('.nonEditableCell').each(function(c){
                    $(this).closest("tr").css("display","")
                })
            }
        })

        let Auto_calculable = ["Water Column Flush Rate"]
        let linked_data = ["Water Column External Water Inflow from Other Water Bodies"]
        function TableRedraw(table_data, table_type){
            let tblHandle = table_type == "lake" ? lkTable : sdTable
            let tblId = table_type == "lake" ? '#LakeTable' : '#SedTable'
            
            let scrollBody = $(tblId + '_wrapper').find('.dataTables_scrollBody');
            let scrollTop = scrollBody.length > 0 ? scrollBody.scrollTop() : 0;
            
            tblHandle.clear().draw();
            tblHandle.destroy()
            
            tblHandle = $(tblId).removeAttr('width').DataTable({
                data : table_data,
                aaSorting: [],
                paging: false,
                bFilter: false,
                info: false,
                bAutoWidth: false,
                scrollX: true,
                scrollY: 500,
                columnDefs: [
                    { width: '100%', targets: 0 },
                ],
                fnCreatedRow: function (row, data, index) {
                    $(row).find("td.rightBorder-pivoted").addClass("freeze-column")
                },
                columns: setDynamicColumnWidths(tblId, get_pivoted_columns(table_type), table_data),
                initComplete: function (settings, json) {
                    // $(tblId).wrap("<div style='overflow:auto; width: 100%; position:relative;'></div>");
                    $(".dataTables_scrollBody").css({"max-height": "500px", "height": "100%"});
                    $(".dataTables_scrollBody").addClass('wrap-text-scrollbody');
                    $(".dataTables_scrollHead").addClass('wrap-text-scrollhead');
                    $('[data-toggle="tooltip"]').tooltip()
                    $('[data-toggle="popover"]').popover()

                    if (scrollTop > 0) {
                        //using setTimeout to ensure DOM is fully rendered
                        setTimeout(function() {

            function submit_external_water_inflow(pcl_name, total_IF, discharge_rate) {
                let pcl = getParcelByKey('name', pcl_name);
                let parcel_info = [
                    {type: 'data', name: 'id', value: pcl.id},
                    {type: 'data', name: 'field', value: 'externalWaterInflow'},
                    {type: 'input', name: 'externalWaterInflow', value: total_IF},
                ];
                LoadingScreen.show('external_water_inflow');
                TRIM.api.updateParcel('{{ scenario.id }}', parcel_info).on('load', (rsp)=>{
                    pcl.surface_water.wc_props.externalWaterInflow = total_IF;
                    pcl.surface_water.wc_props.discharge_vol_rate = discharge_rate;
                    LoadingScreen.hide('external_water_inflow');
                });

            function validate_input(e) {
                let elem = $(e).closest("div.modal-content").find("input.form-control")
                elem = elem[0]
                let isValidated = $(elem).data("validate")
                if (isValidated == "True") {
                    let validation_type = $(elem).data("valtype")
                    if (validation_type == "numValue") {
                        let chk_val = parseFloat($(elem).data("chkval"))
                        let val = parseFloat($(elem).val())
                        if (val > chk_val) {
                            $("label.warningTT").tooltip('dispose')
                            $("label.warningTT").remove()
                            let tt = '<label class="warningTT" data-toggle="tooltip" data-placement="right" data-html="true" title="Discharge fraction cannot exceed 1"><i class="ml-1 fas fa-exclamation-triangle"></i></label>'
                            let this_cell = $(elem).siblings("label")
                            $(this_cell).append(tt)
                            $("label.warningTT").tooltip('show')
                            return false
                        } else {
                            $("label.warningTT").tooltip('hide')
                            $("label.warningTT").remove()
                            return true
                        }
                    }
                }
            }

            $('input.editableCell,select.editableCell').blur(function() {
                let focusTblId = $(this).closest(`table`).attr('id');
                let elm = this;
                let this_table = $(elm).closest("table").attr("id")
                if (`#${focusTblId}` !== tblId) {
                    return;
                }
                if (!ErrorValidation.isPositiveValue(this)) {
                    return;
                }
                if (elementIsValid(($(elm).parent()))) {
                    let minAttr = elm.getAttribute('min');
                    let maxAttr = elm.getAttribute('max');
                    let min = minAttr !== null ? parseFloat(minAttr) : undefined;
                    let max = maxAttr !== null ? parseFloat(maxAttr) : undefined;
                    if (min || max)
                        if (!ErrorValidation.isWithinRange(elm, $(elm).parent(), min, max)) {
                            return;
                        }
                }
                let parcel_name = $($(this).closest("table").find("thead > tr > th")[$(this).closest("td").prevAll().length]).text()
                let parcels = TRIM.store.currentScenario.parcels;
                let area = Number(parcels.find(e => e.name == parcel_name).area)
                let data = $(this).val()
                let $label = $(this).next("label")
                $label.siblings().hide()
                let this_cell_data = !isNaN(Number(data)) && String(data).length > 6 ? Number.parseFloat(data).toExponential(4) : data
                $label.show().text(this_cell_data)
                let parcel_info = $(this).data('parcelinfo')
                if (parcel_info) {
                    let old_data = parcel_info[parcel_info.findIndex(e => e.type == 'input')].value
                    parcel_info[parcel_info.findIndex(e => e.type == 'input')].value = data
                    let param_store_key = "surface_water"
                    let ls_info = "Water_body_prop_update"
                    let sub_cat = this_table == "LakeTable" ? "wc_props" : "sed_props"
                    param_store_key = param_store_key + "." + sub_cat
                    
                    let field_name = parcel_info[parcel_info.findIndex(e => e.name == 'field')].value

                    let table_col_headers = $("#LakeTable thead th").map((i,h)=>h.innerHTML).toArray()
                    let table_row_headers = $("#LakeTable tbody tr td:nth-child(1) label").map((i,r) => r.innerHTML).toArray()
                    let fr_row_idx = table_row_headers.indexOf("Water Column Flush Rate")
                    let col_idx = table_col_headers.indexOf(parcel_name)
                    let is_auto_calculated = $("#LakeTable").find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("button").data("active")

                    if (field_name == 'flush_rate') {
                        parcel_info = parcel_info.concat([
                            {
                                'type': 'data',
                                'name': 'field',
                                'value': 'autocalc'
                            },{
                                'type': 'input',
                                'name': 'autocalc',
                                'value': is_auto_calculated
                            }
                        ])                        
                    }

                    LoadingScreen.show(ls_info)
                    TRIM.api.updateParcel('{{ scenario.id }}', parcel_info).on('load', (rsp)=>{
                        update_data_store_callback(rsp, elm, parcel_info, param_store_key, data, old_data)
                        LoadingScreen.hide(ls_info)
                    })
                    // table_data = get_Data_from_table(tblId)
                    let wc_table_data = get_Data_from_table("#LakeTable")
                    let sed_table_data = get_Data_from_table("#SedTable")
                    
                    switch (field_name) {
                        case "evaporation_rate":
                            var val=calculate_wc_evaporation_vol_rate(wc_table_data, parcel_name, area)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Evaporation Volumetric Rate')][parcel_name] = val
                            var val_dvr = calculate_discharge_vol_rate(wc_table_data, parcel_name)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Discharge Volumetric Rate')][parcel_name] = val_dvr
                            if (is_auto_calculated == 'True') {
                                var val_fr = calculate_flush_rate(wc_table_data,parcel_name)
                                wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Flush Rate')][parcel_name] = val_fr
                            }
                            var val_sdr=calculate_sed_discharge_rate(wc_table_data,parcel_name)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Sediment Discharge Rate')][parcel_name] = val_sdr
                            var val_sbr = calculate_sed_burial_vol_rate(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Burial Volumetric Rate')][parcel_name] = val_sbr
                            var val_srv = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val_srv
                            break;
                        case "flush_rate":
                            // Fall through to discharge_vol_rate... no break!
                            var val_dvr = calculate_discharge_vol_rate(wc_table_data, parcel_name)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Discharge Volumetric Rate')][parcel_name] = val_dvr      
                        case "discharge_vol_rate":
                            if (is_auto_calculated == 'True') {
                                var val_fr = calculate_flush_rate(wc_table_data,parcel_name)
                                wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Flush Rate')][parcel_name] = val_fr
                            }
                            var val_sdr=calculate_sed_discharge_rate(wc_table_data,parcel_name)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Sediment Discharge Rate')][parcel_name] = val_sdr
                            var val_sbr = calculate_sed_burial_vol_rate(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Burial Volumetric Rate')][parcel_name] = val_sbr
                            var val_srv = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val_srv
                            break;
                        case "suspended_sed_conc":
                            var val=calculate_sed_discharge_rate(wc_table_data,parcel_name)
                            wc_table_data[wc_table_data.findIndex(e => e.Property == 'Water Column Sediment Discharge Rate')][parcel_name] = val
                            var val_dvr=calculate_sed_deposition_vol_rate(wc_table_data,sed_table_data,parcel_name)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Deposition Volumetric Rate')][parcel_name] = val_dvr
                            var val_srv = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val_srv
                            break;
                        case "sed_inflow":
                            var val=calculate_sed_burial_vol_rate(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Burial Volumetric Rate')][parcel_name] = val
                            var val_srv = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val_srv
                            break;
                        case "bed_density":
                            var val_bvr=calculate_sed_burial_vol_rate(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Burial Volumetric Rate')][parcel_name] = val_bvr
                            var val_dvr=calculate_sed_deposition_vol_rate(wc_table_data,sed_table_data,parcel_name)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Deposition Volumetric Rate')][parcel_name] = val_dvr
                            var val = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val
                            break;
                        case "sed_deposition_vel":
                            var val=calculate_sed_deposition_vol_rate(wc_table_data,sed_table_data,parcel_name)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Deposition Volumetric Rate')][parcel_name] = val
                            var val_srv = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val_srv
                            break;
                        case "bed_porosity":
                            var val = calculate_sed_resuspension_vel(wc_table_data,sed_table_data,parcel_name, area)
                            sed_table_data[sed_table_data.findIndex(e => e.Property == 'Sediment Resuspension Velocity')][parcel_name] = val
                    }

                    let wc_store = getParcelByKey('name', parcel_name).surface_water.wc_props;
                    wc_table_data.map(function(e,i){
                            e['unit'] = default_water_data[e['Property']]['unit']
                            e['helpText'] = default_water_data[e['Property']]['helpText']
                            e['shortProperty'] = default_water_data[e['Property']]['short_name']
                            e['isEditable'] = default_water_data[e['Property']]['is_editable']
                            e['min'] = default_water_data[e['Property']]['min']
                            e['max'] = default_water_data[e['Property']]['max']

                            wc_store[e['shortProperty']] = e[parcel_name];
                        }
                    )
                    TableRedraw(wc_table_data, "lake")

                    let sed_store = getParcelByKey('name', parcel_name).surface_water.sed_props;
                    sed_table_data.map(function(e,i){
                            e['unit'] = default_sed_data[e['Property']]['unit']
                            e['helpText'] = default_sed_data[e['Property']]['helpText']
                            e['shortProperty'] = default_sed_data[e['Property']]['short_name']
                            e['isEditable'] = default_sed_data[e['Property']]['is_editable']
                            e['min'] = default_sed_data[e['Property']]['min']
                            e['max'] = default_sed_data[e['Property']]['max']

                            sed_store[e['shortProperty']] = e[parcel_name];
                        }
                    )
                    TableRedraw(sed_table_data, "sed")
                }
            })
        }

                            "</select>" +
                            "<div class='overSelect'>" +
                            "</div>" +
                            "</div>" +
                            "<div class='parcelSelectOptions'>" +
                            "</div>" +
                            "</div></div>"
                            let hq_ms = new $(multi_select_html)
                        link_options.forEach(function(p,i) {
                            // Get ratios if they already exist.
                            let inp_id = "#MS_" + p + "_" + e.name

                            $(hq_ms).find('div.parcelSelectOptions').append("<label for='MS_" + p + "_"+ e.name +"'>" +
                            "<input type='checkbox' id='MS_" + p + "_"+ e.name +"' data-" + p + "_ratio='" + r + "' value='" + p + "' />" + p +
                            "</label>")
                        })
                        let linked_prop_input = linked_data.indexOf(row.Property) >= 0 ? $(hq_ms).html() : ""
                        // let linked_prop_input = linked_data.indexOf(row.Property) >= 0 ? "<p><select class='form-select'>" + link_options.map(el => "<option>" + el + "</option>").join("") + "</select></p>" : ""
                        let this_cell_data = !isNaN(Number(data)) && String(data).length > 6 ? Number.parseFloat(data).toExponential(4) : data
                        let this_cell_prop = row.isEditable ? 'editableCell badge badge-light' : 'nonEditableCell text-muted'
                        let input_prop = 'editableCell form-control form-control-sm'
                        let min = row.min !== undefined ? " min='" + row.min + "' " : ""
                        let max = row.max !== undefined ? " max='" + row.max + "' " : ""
                        if (linked_data.indexOf(row.Property) >= 0) {

        function get_Data_from_table(thisTableID){
            var myRows = [];
            var headersText = [];
            var head_section = thisTableID + ' thead th'
            var $headers = $(head_section);

            // Loop through grabbing everything
            thisRows = thisTableID + ' tbody tr'
            var $rows = $(thisRows).each(function(index) {
                $cells = $(this).find("td");
                myRows[index] = {};
                $cells.each(function(cellIndex) {
                    // Set the header text
                    if(headersText[cellIndex] === undefined) {
                        headersText[cellIndex] = $($headers[cellIndex]).text();
                    }
                    // Update the row object with the header/cell combo
                    myRows[index][headersText[cellIndex]] = $(this).find("label").first().text();
                });
            });
            return myRows
        }

        function calculate_flush_rate(data, parcel_name) {
            let pcls = TRIM.store.currentScenario.parcels;
            let P = pcls.filter(e=>e.name==parcel_name)[0];

            let precip_rate = P.precip_rate * 365;
            let evapo_rate = P.surface_water.wc_props.evaporation_rate;
            let watershed_area = P.surface_water.wc_props.connected_watershed_area;
            let lake_depth = P.surface_water.wc_props.mean_depth;
            let external_inflow = Number(data.find(e=>e.Property == "Water Column External Water Inflow from Other Water Bodies")[parcel_name])
            let area = P.area;
            let wgt_ave_runoff_frac = pcls.filter(e=>e.runoff_fraction!=null).map(e=>e.runoff_fraction*e.area).reduce((a,e)=>a+e, 0)/
                pcls.filter(e=>e.runoff_fraction!=null).map(e=>e.area).reduce((a,e)=>a+e, 0)
            let wgt_ave_seepage_frac = pcls.filter(e=>e.seepage_frac!=null).map(e=>
                e.seepage_frac*e.area).reduce((a,e)=>a+e, 0)/
                pcls.filter(e=>e.seepage_frac!=null).map(e=>e.area).reduce((a,e)=>a+e, 0)
            let res = ((area * precip_rate) + (watershed_area * precip_rate * wgt_ave_runoff_frac) +
                (watershed_area * precip_rate * wgt_ave_seepage_frac) + (external_inflow) - (area * evapo_rate)) /
                (area * lake_depth)
            // let parcels = TRIM.store.currentScenario.parcels;
            // let wc_discharge_vol_rate = Number(data.find(e=>e.Property == "Water Column Discharge Volumetric Rate")[parcel_name])
            // let wc_depth = Number(data.find(e=>e.Property == "Water Column Depth")[parcel_name])
            // let res = wc_discharge_vol_rate/(area * wc_depth)
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_discharge_vol_rate(data, parcel_name){
            // use flush rate if manually applied
            let table_col_headers = $("#LakeTable thead th").map((i,h)=>h.innerHTML).toArray()
            let table_row_headers = $("#LakeTable tbody tr td:nth-child(1) label").map((i,r) => r.innerHTML).toArray()
            let fr_row_idx = table_row_headers.indexOf("Water Column Flush Rate")
            let col_idx = table_col_headers.indexOf(parcel_name)
            let is_auto_calculated = $("#LakeTable").find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("button").data("active");
            if (is_auto_calculated == 'False') {
                let flush_rate = Number(data.find(e=>e.Property == "Water Column Flush Rate")[parcel_name])
                let area = getParcelByKey('name', parcel_name).area
                let wc_depth = Number(data.find(e=>e.Property == "Water Column Depth")[parcel_name])
                let res = flush_rate * area * wc_depth
                return Number.parseFloat(res).toExponential(5)
            }

            let runoff_gain = Number(data.find(e=>e.Property == "Precipitation Runoff Volumetric Rate from Land to Water Body")[parcel_name])
            let precipitation_gain = Number(data.find(e=>e.Property == "Precipitation Volumetric Rate to Water Body")[parcel_name])
            let precipitation_gw_seepage_gain = Number(data.find(e=>e.Property == "Precipitation Seepage Volumetric Rate to Groundwater")[parcel_name])
            let external_inflow_gain = Number(data.find(e=>e.Property == "Water Column External Water Inflow from Other Water Bodies")[parcel_name])
            let evaporation_loss = Number(data.find(e=>e.Property == "Water Column Evaporation Volumetric Rate")[parcel_name])
            let res = (runoff_gain + precipitation_gain + precipitation_gw_seepage_gain + external_inflow_gain) - evaporation_loss
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_wc_evaporation_vol_rate(data, parcel_name, area){
            let evaporation_rate = Number(data.find(e=>e.Property == "Water Column Evaporation Rate")[parcel_name])
            let res = evaporation_rate * area
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_sed_discharge_rate(data, parcel_name){
            let wc_discharge_vol_rate = Number(data.find(e=>e.Property == "Water Column Discharge Volumetric Rate")[parcel_name])
            let suspended_sed_conc = Number(data.find(e=>e.Property == "Water Column Suspended Sediment Concentration")[parcel_name])
            let res = wc_discharge_vol_rate * suspended_sed_conc
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_sed_burial_vol_rate(data_wc, data_sed, parcel_name, area){
            let wc_external_sed_inflow = Number(data_wc.find(e=>e.Property == "Water Column External Sediment Inflow from Other Water Bodies")[parcel_name])
            let soil_erosion_rate_to_wc = Number(data_sed.find(e=>e.Property == "Soil Erosion Rate to Water Body")[parcel_name])
            let wc_sed_discharge_rate = Number(data_wc.find(e=>e.Property == "Water Column Sediment Discharge Rate")[parcel_name])
            let sed_bed_density = Number(data_sed.find(e=>e.Property == "Sediment Bed Density")[parcel_name])
            let res = (wc_external_sed_inflow + soil_erosion_rate_to_wc - wc_sed_discharge_rate) / (sed_bed_density * area)
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_sed_deposition_vol_rate(data_wc, data_sed, parcel_name){
            let wc_sed_deposition_vel = Number(data_wc.find(e=>e.Property == "Water Column Sediment Deposition Velocity")[parcel_name])
            let wc_suspended_sed_conc = Number(data_wc.find(e=>e.Property == "Water Column Suspended Sediment Concentration")[parcel_name])
            let sed_bed_density = Number(data_sed.find(e=>e.Property == "Sediment Bed Density")[parcel_name])
            let res = wc_sed_deposition_vel * wc_suspended_sed_conc / sed_bed_density
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_sed_resuspension_vel(data_wc, data_sed, parcel_name, area){
            let sed_deposition_vol_rate = calculate_sed_deposition_vol_rate(data_wc, data_sed, parcel_name)
            let sed_burial_vol_rate = calculate_sed_burial_vol_rate(data_wc, data_sed, parcel_name, area)
            let sed_bed_porosity = Number(data_sed.find(e=>e.Property == "Sediment Bed Porosity")[parcel_name])
            let res = (sed_deposition_vol_rate - sed_burial_vol_rate) / (1 - sed_bed_porosity)
            return Number.parseFloat(res).toExponential(5)
        }

        function updateLakeProps() {
            if (!TRIM.store.currentScenario.parcels) {
                // Parcels haven't loaded yet; wait a bit and try again
                setTimeout(function() { updateLakeProps(); }, 1000);
                return;
            }
            let parcels = TRIM.store.currentScenario.parcels;
            let water_data = []
            let sed_data = []
            let water_properties = Object.keys(default_water_data)
            let sed_properties = Object.keys(default_sed_data)
            if (parcels.length > 0) {
                water_properties.forEach(function (p, i) {
                    let this_water_property = {}
                    this_water_property["min"] = default_water_data[p]['min'];
                    this_water_property["max"] = default_water_data[p]['max'];
                    parcels.forEach(function (e, i) {
                        if (e.parcelType == "Water Only" || e.parcelType == "Water & Air") {
                            let exceptions = ['Precipitation Runoff Watershed Area',
                                'Precipitation Runoff Volumetric Rate from Land to Water Body',
                                'Precipitation Volumetric Rate to Water Body',
                                'Precipitation Seepage Volumetric Rate to Groundwater'
                            ]
                            let d = (p.startsWith("Precipitation ") && exceptions.indexOf(p) == -1 )? e : e['surface_water']['wc_props']
                            this_water_property['Property'] = p
                            this_water_property[e.name] = d[default_water_data[p]['short_name']] ? d[default_water_data[p]['short_name']] : default_water_data[p]['default_value'],
                                this_water_property["helpText"] = default_water_data[p]['helpText'] ? default_water_data[p]['helpText'] : "Some text"
                            this_water_property["unit"] = default_water_data[p]['unit'] ? default_water_data[p]['unit'] : "No units"
                            this_water_property["shortProperty"] = default_water_data[p]['short_name']
                            this_water_property["isEditable"] = default_water_data[p]['is_editable']
                        }
                    })
                    water_data.push(this_water_property)
                })
                TableRedraw(water_data, "lake")
                sed_properties.forEach(function (p, i) {
                    let this_sed_property = {}
                    this_sed_property["min"] = default_sed_data[p]['min'];
                    this_sed_property["max"] = default_sed_data[p]['max'];
                    parcels.forEach(function (e, i) {
                        if (e.parcelType == "Water Only" || e.parcelType == "Water & Air") {
                            let d = e['surface_water']['sed_props']
                            this_sed_property['Property'] = p
                            this_sed_property[e.name] = d[default_sed_data[p]['short_name']] ? d[default_sed_data[p]['short_name']] : default_sed_data[p]['default_value'],
                                this_sed_property["helpText"] = default_sed_data[p]['helpText'] ? default_sed_data[p]['helpText'] : "Some text"
                            this_sed_property["unit"] = default_sed_data[p]['unit'] ? default_sed_data[p]['unit'] : "No units"
                            this_sed_property["shortProperty"] = default_sed_data[p]['short_name']
                            this_sed_property["isEditable"] = default_sed_data[p]['is_editable']
                        }
                    })
                    sed_data.push(this_sed_property)
                })
                TableRedraw(sed_data, "sed")
            }

            console.log('populated lake props form!')
            LoadingScreen.hide('lake_props_loading');
        }
    });
