# DMAP variant: Deploy TRIM Webapp to AWS Elastic Beanstalk
#
# Builds the TRIM web application, uploads a versioned zip to S3, creates an
# Elastic Beanstalk application version, and optionally deploys it to the
# target EB environment.
#
# Authentication uses GitHub OIDC federation — no stored AWS credentials.
# The IAM role trust policy is defined in dmap-infra foundation/iam.tf:182-205.
#
# This workflow lives on the `dmap` branch and is namespaced separately from
# the team's existing `deploy_web_eb_artifact.yml` so the two pipelines do not
# collide. Configure the secrets below in the "dmap-stage" GitHub Environment.
#
# Required GitHub Secrets (set under Settings → Environments → dmap-stage):
#   DMAP_DEPLOY_IAM_ROLE    - ARN of the GitHub Actions OIDC IAM role
#   DMAP_DEPLOY_S3_BUCKET   - S3 bucket for EB deployment archives
#   DMAP_DEPLOY_EB_APP_NAME - Elastic Beanstalk application name
#   DMAP_DEPLOY_EB_ENV_NAME - Elastic Beanstalk environment name
#
# Required GitHub Environment:
#   dmap-stage
#
# This workflow also injects a .platform/hooks/predeploy hook into the bundle so
# each EB instance pulls LOGIN_GOV_CLIENT_SECRET from the Secrets Manager secret
# named by the LOGIN_GOV_SECRET_ARN option setting, rather than carrying it as a
# cleartext EB option setting. That secret (pytrim/login_gov/credentials) must be
# populated in AWS before login works. LOGIN_GOV_CLIENT_ID and
# LOGIN_GOV_SERVER_URL are not sensitive and come straight from EB option
# settings set in dmap-infra.

name: DMAP — Deploy webapp to Elastic Beanstalk

on:
  workflow_dispatch:
    inputs:
      deploy_to_environment:
        description: 'Deploy to EB environment after creating version'
        type: boolean
        required: false
        default: true

# Minimum permissions for OIDC authentication and code checkout
permissions:
  id-token: write   # Required for requesting the OIDC JWT
  contents: read    # Required for actions/checkout

# Prevent overlapping deploys from clobbering each other
concurrency:
  group: dmap-deploy-eb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dmap-stage

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Authenticate to AWS via OIDC — no access keys required
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DMAP_DEPLOY_IAM_ROLE }}
          aws-region: us-east-1

      - name: Store build timestamp and current commit SHA
        run: |
          # Use colon-free timestamp to avoid issues in version labels and S3 keys
          echo "TIMESTAMP=$(date +'%Y-%m-%dT%H%M%S')" >> "$GITHUB_ENV"
          echo "CURRENT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Strip the aws:elbv2:loadbalancer option from Scripts/.ebextensions/pytrim.config.
      # That namespace only applies when EB owns the LB. The DMAP env uses a shared
      # ALB managed in terraform (dmap-infra/application/alb.tf), so EB rejects the
      # option and fails the deploy. IdleTimeout is set on the ALB directly via the
      # `idle_timeout` argument on aws_lb.application-lb. yq is preinstalled on
      # ubuntu-latest runners.
      - name: Strip shared-LB-incompatible .ebextensions setting
        run: |
          yq -i '.option_settings |= map(select(.namespace != "aws:elbv2:loadbalancer"))' \
            Scripts/.ebextensions/pytrim.config
          echo "Resulting pytrim.config:"
          cat Scripts/.ebextensions/pytrim.config

      # Inject a predeploy hook that pulls the EPA WAM SSO (login.gov) OAuth2
      # client secret from Secrets Manager on each EB instance and exports it
      # into the application environment at deploy time. It is NOT an EB option
      # setting, because those are stored and displayed in cleartext. The client
      # id is not sensitive and is a plain option setting.
      #
      # Written here rather than committed so DMAP-specific changes stay
      # confined to dmap_*.yml. Scripts/ is the root of the deployment bundle
      # (iac/src/deployer/helpers/beanstalk_helper.py:build_flask_zip copies it
      # wholesale), so Scripts/.platform lands at .platform in the zip.
      #
      # The script is carried in `env` rather than a heredoc in `run`: a YAML
      # block scalar strips its own indentation, so the hook's inner heredoc
      # terminator lands at column 0 as bash requires.
      - name: Inject login.gov credential predeploy hook
        env:
          HOOK_SCRIPT: |
            #!/usr/bin/env bash
            # Generated by .github/workflows/dmap_deploy_web_eb_artifact.yml — not in git.
            #
            # Appends LOGIN_GOV_CLIENT_SECRET to the EB environment file, which
            # systemd passes to the application process as its EnvironmentFile.
            # The secret ARN arrives as the
            # LOGIN_GOV_SECRET_ARN option setting
            # (dmap-infra/application/beanstalk.tf); the instance role is granted
            # secretsmanager:GetSecretValue on it in dmap-infra/foundation/iam.tf
            # (statement "ReadLoginGovSecret").
            set -euo pipefail

            ENV_FILE=/opt/elasticbeanstalk/deployment/env

            secret_arn="$(sed -n 's/^LOGIN_GOV_SECRET_ARN=//p' "$ENV_FILE" | head -1)"
            if [ -z "$secret_arn" ]; then
              echo "login.gov: LOGIN_GOV_SECRET_ARN unset in $ENV_FILE; skipping injection" >&2
              exit 0
            fi

            # predeploy runs after the platform has built the application
            # virtualenv, so boto3 (requirements.txt) is importable there.
            py="$(ls -d /var/app/venv/*/bin/python 2>/dev/null | head -1 || true)"
            [ -x "${py:-}" ] || py=/usr/bin/python3

            creds="$("$py" - "$secret_arn" <<'PY'
            import json, sys
            import boto3

            arn = sys.argv[1]
            region = arn.split(":")[3]
            raw = boto3.client("secretsmanager", region_name=region).get_secret_value(
                SecretId=arn)["SecretString"]
            secret = json.loads(raw)

            value = secret.get("client_secret")
            if not value:
                raise SystemExit("login.gov secret is missing required key 'client_secret'")
            # Entries in the EB env file are read to end-of-line.
            if "\n" in value:
                raise SystemExit("login.gov secret value for 'client_secret' spans lines")
            print(f"LOGIN_GOV_CLIENT_SECRET={value}")
            PY
            )"

            # Idempotent: drop any entry from a previous run before appending.
            sed -i '/^LOGIN_GOV_CLIENT_SECRET=/d' "$ENV_FILE"
            printf '%s\n' "$creds" >> "$ENV_FILE"
            echo "login.gov: exported LOGIN_GOV_CLIENT_SECRET"
        run: |
          HOOK=Scripts/.platform/hooks/predeploy/10_login_gov_env.sh
          mkdir -p "$(dirname "$HOOK")"
          printf '%s' "$HOOK_SCRIPT" > "$HOOK"
          chmod +x "$HOOK"
          bash -n "$HOOK"
          echo "Hook written to $HOOK:"
          cat "$HOOK"

      # Build is inlined (rather than calling a wrapper script) so all DMAP-specific
      # changes stay confined to dmap_*.yml — no new files in the upstream source tree.
      - name: Build zip archive for deployment
        working-directory: iac/src/deployer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install boto3
          python -c 'from helpers.beanstalk_helper import BeanstalkHelper; BeanstalkHelper().build_flask_zip()'

      - name: Store version name
        run: echo "APP_VERSION=PyTRIM_${{ env.TIMESTAMP }}" >> "$GITHUB_ENV"

      # Upload the build artifact to the AWS-account-level EB-managed bucket,
      # under a key prefix matching the EB application name. The IAM role
      # (foundation/iam.tf) is scoped to this prefix.
      - name: Upload zip archive to S3
        env:
          S3_BUCKET: ${{ secrets.DMAP_DEPLOY_S3_BUCKET }}
          EB_APP: ${{ secrets.DMAP_DEPLOY_EB_APP_NAME }}
        run: |
          ARCHIVE=$(find ./iac/flask_temp_package_dir -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No zip archive found in ./iac/flask_temp_package_dir/"
            exit 1
          fi
          echo "S3_KEY=${EB_APP}/${APP_VERSION}.zip" >> "$GITHUB_ENV"
          aws s3 cp "$ARCHIVE" "s3://${S3_BUCKET}/${EB_APP}/${APP_VERSION}.zip"

      - name: Create an app version from the archive on EB
        env:
          EB_APP: ${{ secrets.DMAP_DEPLOY_EB_APP_NAME }}
          S3_BUCKET: ${{ secrets.DMAP_DEPLOY_S3_BUCKET }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$APP_VERSION" \
            --description "$CURRENT_COMMIT" \
            --source-bundle S3Bucket="${S3_BUCKET}",S3Key="${S3_KEY}"

      - name: Update the EB environment
        if: ${{ inputs.deploy_to_environment == true }}
        env:
          EB_APP: ${{ secrets.DMAP_DEPLOY_EB_APP_NAME }}
          EB_ENV: ${{ secrets.DMAP_DEPLOY_EB_ENV_NAME }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APP" \
            --environment-name "$EB_ENV" \
            --version-label "$APP_VERSION"

      # Render a summary table visible in the Actions run UI.
      # Secrets are passed through env vars so values display in the summary
      # instead of being masked as "***".
      - name: Deployment Summary
        env:
          EB_APP: ${{ secrets.DMAP_DEPLOY_EB_APP_NAME }}
          S3_BUCKET: ${{ secrets.DMAP_DEPLOY_S3_BUCKET }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${EB_APP} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ env.APP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ env.CURRENT_COMMIT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Location | s3://${S3_BUCKET}/${{ env.S3_KEY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Updated | ${{ inputs.deploy_to_environment }} |" >> $GITHUB_STEP_SUMMARY
