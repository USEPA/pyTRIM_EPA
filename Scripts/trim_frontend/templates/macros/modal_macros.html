
{% macro render_modal(id, title, body, footer=None) %}

<div id="{{ id }}"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="{{ id }}-label"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="{{ id }}-label" class="modal-title">
                    {{ title }}
                </h5>
                <button type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                {{ body }}
            </div>

            {% if footer %}
                <div class="modal-footer">
                    {{ footer }}
                </div>
            {% endif %}
        </div>
    </div>
</div>

{% endmacro %}
