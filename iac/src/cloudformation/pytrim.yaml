  NATGatewayElasticIPAllocationID:
    Description: See EC2 Dashboard | Network & Security | Elastic IPs and take an Allocation ID for an
      unused elastic IP. This will be used in creating the NAT Gateway that allows the private subnets
      to talk to other services on the internet (such as the Elastic Beanstalk service, external MongoDB
      hosts, etc.)
    Type: String
    # Default: 'eipalloc-ea8c74d8'

  #
  # Bastion Related
  #
  BastionPassthroughKeyPairName:
    Description: Enter a Public/private key pair for ssh access to the bastion and instances.
      If you do not have one in this region, please create it before continuing.
    Type: 'AWS::EC2::KeyPair::KeyName'
      
  #
  # RDS-related
  #
  DatabaseName:
    Description: name for the database
    Type: String
    Default: pytrim
  DatabaseInstanceType:
    Description: RDS instance type
    Type: String
    Default: db.t3.large
    AllowedValues:
      - db.m5.large
      - db.m5.xlarge
      - db.m5.2xlarge
