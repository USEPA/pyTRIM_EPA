
<form id="lake-props-gui"
    data-async-form="true"
    data-form-src="scenario_lake_props_form"
>
    <section class="container px-0">
        <div class="row">
            <div class="col-md">
                <div class="pill pill-alert col-sm">
                    <small>
                        <strong>
                            <u>Click on the table cells to edit properties</u>. 
                        </strong>
                        <br><span style='color: firebrick;'>*</span> All editable cells are required.
                    </small>
                </div>
            </div>
            <div class="col-md text-right">
                <div class="custom-control custom-switch">
                    <input type="checkbox" class="custom-control-input" id="toggleData"
                        data-isactive="true" checked="checked"
                    />
                    <label class="custom-control-label" for="toggleData">
                        Show/Hide Non-Interactive Data
                    </label>
                    <sup>
                        <a href="javascript:void(0);" aria-label="Show/Hide Non-Interactive Data" title="" data-toggle="popover" data-html="true" data-placement="left" data-content="Select to show or hide properties which cannot be edited directly. These are property values which the model calculates from other property values. You have the option to see the calculated values, but you cannot change them except by changing the other property values they depend on. The help text on the non-interactive properties specifies the dependent properties, and when you click on one of the non-interactive properties then any dependent properties on this page will be highlighted in blue." data-original-title="Non-Interactive Data"><i class="fa fa-question"></i></a>
                    </sup>
                </div>
            </div>
        </div>
        <div class = "row">
            <div class="col-md mt-4 text-center">
                <h4>Water Column Properties</h4>
            </div>
        </div>
        <div class ="row">
            <div class="col-md">
                <table data-slot="true" data-target="WaterColumnTable" data-pivot="true" class="hover wrap-text" id="WaterColumnTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                            <th>Default Value</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div class = "row">
            <div class="col-md mt-4 text-center">
                <h4>Sediment Bed Properties</h4>
            </div>
        </div>
        <div class ="row">
            <div class="col-md">
                <table data-slot="true" data-target="SedimentTable" data-pivot="true" class="hover wrap-text" id="SedimentTable">
                    <thead>
                        <tr>
                            <th>Property</th>
                            <th>Default Value</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </section>
</form>
<div class="modal fade" id="inflow-modal" tabindex="-1" role="dialog" aria-labelledby="ModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Lake Inflow</h5>
                </div>
                <div class="modal-body "></div>
                <div class="modal-footer">
                    <button class="btn btn-sm btn-outline-dark" id="inflow-modal-close" data-dismiss="modal">Cancel</button>
                    <button type="button"  id="inflow-modal-save" class="btn btn-sm btn-outline-secondary text-dark">
                        <i class="fas fa-save mr-1"></i> Save
                    </button>
                </div>
            </div>
        </div>
</div>
<link rel="stylesheet" href="{{url_for('static', filename='css/form_styles.css')}}"/>
<script src="{{url_for('static', filename='js/lib/jquery-3.4.1.min.js')}}">
</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/jquery.dataTables.min.js') }}">
</script>
<script src="{{ url_for('static', filename='js/lib/dataTables/dataTables.bootstrap4.min.js') }}">
</script>
<script>
    onDomLoad(function() {
        const lkTblId = '#WaterColumnTable';
        const sedTblId = '#SedimentTable';

        let lkTable = $(lkTblId).removeAttr('width').DataTable({
            paging: false, bFilter: false, info: false,
            language: { emptyTable: 'No data available in table' }
        })
        let sdTable = $(sedTblId).removeAttr('width').DataTable({
            paging: false, bFilter: false, info: false,
            language: { emptyTable: 'No data available in table' }
        })

        let waterParcels = undefined;
        let default_water_data = undefined;
        let default_sed_data = undefined;
        function getTableFields(table_id) {
            waterbodies_form = TRIM.forms.get("scenario_lake_props_form");
            for (let table of waterbodies_form.fields) {
                if (table.id === table_id) {
                    let fields = table.form_definition.fields;
                    // return fields;

                    // temp rewrite to work with original format
                    let _data = {};
                    for (let field_grp of fields) {
                        _data[field_grp.label] = field_grp
                    }
                    return _data;
                }
            }
        }

        function getParam(pcl_name, table_type, param_name) {
            let pcl_sw = getParcelByKey('name', pcl_name).surface_water;
            if (table_type == "wc")
                return pcl_sw.wc_props[param_name];
            else if (table_type == "sed")
                return pcl_sw.sed_props[param_name];
        }

        $('#toggleData').on('change', function(event) {
            event.preventDefault()
            if ($(this).attr("data-isactive") == "true") {
                $(this).attr("data-isactive","false")
                $('.nonEditableCell').each(function(c){
                    $(this).closest("tr").css("display","none")
                })
            } else {
                $(this).attr("data-isactive","true")
                $('.nonEditableCell').each(function(c){
                    $(this).closest("tr").css("display","")
                })
            }
        })

        function TableRedraw(table_data, table_type) {
            let tblHandle = table_type == "lake" ? lkTable : sdTable
            let tblId = table_type == "lake" ? lkTblId : sedTblId
            
            let scrollBody = $(tblId + '_wrapper').find('.dataTables_scrollBody');
            let scrollTop = scrollBody.length > 0 ? scrollBody.scrollTop() : 0;
            
            tblHandle.clear().draw();
            tblHandle.destroy()
            $(tblId).find('tbody').remove();
            $(tblId).find('thead tr th:not(:first-child)').remove();

            tblHandle = $(tblId).removeAttr('width').DataTable({
                data : table_data,
                aaSorting: [],
                paging: false,
                bFilter: false,
                info: false,
                language: { emptyTable: 'No data available in table' },
                bAutoWidth: false,
                scrollX: true,
                scrollY: 500,
                columnDefs: [
                    { width: '100%', targets: 0 },
                ],
                fnCreatedRow: function (row, data, index) {
                    $(row).find("td.rightBorder-pivoted").addClass("freeze-column")
                    $(row).find('td').each(function() {
                        wrapIcon($(this));
                    });
                },
                columns: setDynamicColumnWidths(tblId, get_pivoted_columns(tblId), table_data),
                initComplete: function (settings, json) {
                    // $(tblId).wrap("<div style='overflow:auto; width: 100%; position:relative;'></div>");
                    this.api().columns().header().to$().attr('scope', 'col');
                    $(".dataTables_scrollBody").css({"max-height": "500px", "height": "100%"});
                    $(".dataTables_scrollBody").addClass('wrap-text-scrollbody');
                    $(".dataTables_scrollHead").addClass('wrap-text-scrollhead');
                    $('[data-toggle="tooltip"]').tooltip()
                    $('[data-toggle="popover"]').popover()

                    if (scrollTop > 0) {
                        //using setTimeout to ensure DOM is fully rendered
                        setTimeout(function() {
                            let newScrollBody = $(tblId + '_wrapper').find('.dataTables_scrollBody');
                            if (newScrollBody.length > 0) {
                                newScrollBody.scrollTop(scrollTop);
                            }
                        }, 0);
                    }
                }
            });

            if (table_type == "lake") {
                lkTable = tblHandle
            }
            else if (table_type == "sed") {
                sdTable = tblHandle
            }

            tblHandle.on( 'draw', function () {
                tblHandle.columns.adjust();
            } );

            // find and highlight selected row and any associated rows used in calculations
            // NOTE: expects all calcs to include "= ("
            $(lkTblId + ', ' + sedTblId).on('click', 'tbody tr', function() {
                let color_white = "rgb(255, 255, 255)";
                let color_hover = "rgb(246, 246, 246)";
                let color_blue = "rgb(13, 202, 240, .4)";
                let color_green = "rgba(51, 170, 51, .4)";

                let selected_table = $(this).closest("table").attr("id");
                selected_table = $(`#${selected_table}`).DataTable();
                let row_text = selected_table.row(this).data().helpText;

                let lake_table = $(lkTblId).DataTable();
                let lake_columns = lake_table.column(0).data();
                lake_columns.each((name, idx)=>{
                    let iter_row = $(lake_table.row(idx).node());                
                    if (iter_row.css("background-color") !== color_white) {
                        iter_row.css("background-color", color_white);
                    }
                    if (row_text.includes("= (") && row_text.includes(name)){
                        iter_row.css("background-color", color_blue);
                    }
                })  

                let sed_table = $(sedTblId).DataTable();
                let sed_columns = sed_table.column(0).data();
                sed_columns.each((name, idx)=>{
                    let iter_row = $(sed_table.row(idx).node());
                    if (iter_row.css("background-color") !== color_white) {
                        iter_row.css("background-color", color_white);
                    }
                    if (row_text.includes("= (") && row_text.includes(name)){
                        iter_row.css("background-color", color_blue);
                    }
                })

                $(this).css("background-color", color_green);
            })

            let sort_order = "asc"
            $('.sortClass').click(function(e){
                e.preventDefault();
                let Table = $(tblId).dataTable()
                let cellIndex = $(this).closest("th").index()
                Table.fnSort([[cellIndex,sort_order]]);//use asc/desc as you want
                sort_order= sort_order == "desc" ? "asc" : "desc"
            });

            $('label.editableCell').click(function () {
                $(this).siblings("input").show()
                $(this).siblings("select").show()
                $(this).prev("input").focus()
                $(this).prev("select").focus()
                $(this).hide();
            });

            $('button.auto_calc').click(function (evt) {
                evt.preventDefault()
                if ($(this).data("active") == "False") {
                    $(this).data("active","True")
                    $(this).removeClass("btn-outline-dark")
                    $(this).addClass("btn-success")
                    let calcInfo = $(this).data("calcinfo")
                    let tbl_id = $(this).parents("table").attr("id")
                    tbl_id = "#" + tbl_id
                    let tbl_data = get_Data_from_table(tbl_id)
                    let parcel_name = calcInfo.parcel
                    let res = null
                    if (calcInfo.property == "flush_rate") {
                        res = calculate_flush_rate(tbl_data, parcel_name)
                    }
                    if (calcInfo.property == "discharge_vol_rate") {
                        res = calculate_discharge_vol_rate(tbl_data, parcel_name)
                    }
                    $(this).parent().siblings("label").text(Number(res))
                    $(this).parent().siblings("input").attr("value",Number(res))
                    $(this).parent().siblings("input").trigger("blur")
                }
            });

            // Calculating External Water Inflow from Other Water Bodies
            if (tblId == lkTblId) { // TODO better way to split lake/sed listeners
                $('.inflow-modal-btn').on('click', (e) => {
                    let thisPcl = getParcelByKey('name', $(e.currentTarget).data('parcel'));

                    let body = $('#inflow-modal').find('.modal-body');
                    body.empty();
                    body.append(
                        $(`<button class="btn btn-sm btn-outline-primary float-right m-n2" id="f-reset"
                            data-toggle="tooltip" data-trigger="hover" title="Set all fractions to 0">
                            <i class="fas fa-redo"></i>
                        </button>`)
                    );

                    $('#inflow-modal').find('.modal-title').text(`Lake Inflow into ${thisPcl.name}`);
                    $('#inflow-modal').find('.modal-title').data('parcel', thisPcl.name);

                    // init fraction select
                    for (let otherPcl of waterParcels) {
                        if (otherPcl.name == thisPcl.name) {
                            continue;
                        }
                        
                        // If thisPcl already flows into otherPcl, otherPcl can't flow into thisPcl
                        let isUsed = otherPcl.surface_water.inflow.find(_p => _p.name == thisPcl.name)?.fraction || false;
                        let fraction = thisPcl.surface_water.inflow.find(_p => _p.name == otherPcl.name)?.fraction ?? 0;
                        $(`<div class="mb-3">
                                <label class="form-label" for="f-${otherPcl.name}">Fraction of discharge from ${otherPcl.name}</label>   
                                <input class="form-control w-75 inflow-fraction" type="number"
                                    ${(isUsed) ? 'disabled':''} id="f-${otherPcl.name}" value="${fraction}"
                                    oninput="ErrorValidation.isValidFraction(this);" title="" />
                            </div> 
                        `).appendTo(body);
                    }

                    $("#inflow-modal").modal("show");
                    $('[data-toggle="tooltip"]').tooltip();
                    $(body).on('click', '#f-reset', (e) => {
                        $('.inflow-fraction').each((i, el) => {$(el).val(0)});
                    });
                });

                $("#inflow-modal-save").click(function(e){
                    e.preventDefault();
                    $(this).removeAttr("data-dismiss");

                    let new_inflow = [];
                    let is_valid = $(".inflow-fraction").toArray().every((el) => {
                        new_inflow.push({'name': $(el).attr('id').slice(2), 'fraction': +$(el).val()})
                        return elementIsValid($(el).parent());
                    });
                    
                    if (!is_valid) {
                        return;
                    }

                    let total_inflow = calculate_external_water_inflow(new_inflow);
                    let pcl = $('#inflow-modal').find('.modal-title').data('parcel');
                    pcl = getParcelByKey('name', pcl);
                    let parcel_info = [
                        {type: 'data', name: 'id', value: pcl.id},
                        {type: 'data', name: 'field', value: 'externalWaterInflow'},
                        {type: 'input', name: 'externalWaterInflow', value: total_inflow},
                        {type: 'input', name: 'allInflow', value: JSON.stringify(new_inflow)},
                        {type: 'input', name: 'parcelType', value: pcl.parcelType},
                    ];

                    $(this).attr("data-dismiss","modal");  
                    LoadingScreen.show('external_water_inflow');
                    TRIM.api.updateParcel(TRIM.store.currentScenario.id, parcel_info).on('load', (rsp)=>{
                        if (rsp.target.status === 200) {
                            pcl.surface_water= rsp.target.responseJSON;
                            updateLakeProps();
                        } else {
                            alert("Error while updating parcel");
                        }
                        LoadingScreen.hide('external_water_inflow');
                    });                                      
                })
            }

            $('input.editableCell,select.editableCell').blur(function() {
                let focusTblId = $(this).closest(`table`).attr('id');
                let elm = this;
                let this_table = $(elm).closest("table").attr("id")
                if (`#${focusTblId}` !== tblId) {
                    return;
                }
                if (!ErrorValidation.isPositiveValue(this)) {
                    return;
                }
                if (elementIsValid(($(elm).parent()))) {
                    let minAttr = elm.getAttribute('min');
                    let maxAttr = elm.getAttribute('max');
                    let min = minAttr !== null ? parseFloat(minAttr) : undefined;
                    let max = maxAttr !== null ? parseFloat(maxAttr) : undefined;
                    if (min || max)
                        if (!ErrorValidation.isWithinRange(elm, $(elm).parent(), min, max)) {
                            return;
                        }
                }
                let parcel_name = $($(this).closest("table").find("thead > tr > th")[$(this).closest("td").prevAll().length]).text()
                let area = Number(getParcelByKey('name', parcel_name).area)
                let data = $(this).val()
                let $label = $(this).next("label")
                $label.siblings().hide()
                let this_cell_data = !isNaN(Number(data)) && String(data).length > 6 ? Number.parseFloat(data).toExponential(4) : data
                $label.show().text(this_cell_data)
                let parcel_info = $(this).data('parcelinfo')
                if (parcel_info) {
                    let old_data = parcel_info[parcel_info.findIndex(e => e.type == 'input')].value
                    parcel_info[parcel_info.findIndex(e => e.type == 'input')].value = data

                    let field_name = parcel_info[parcel_info.findIndex(e => e.name == 'field')].value

                    let table_col_headers = $(lkTblId + " thead th").map((i,h)=>h.innerHTML).toArray()
                    let table_row_headers = $(lkTblId + " tbody tr td:nth-child(1) label").map((i,r) => r.innerHTML).toArray()
                    let fr_row_idx = table_row_headers.indexOf("Flush Rate")
                    let col_idx = table_col_headers.indexOf(parcel_name)
                    let is_auto_calculated = $(lkTblId).find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("button").data("active")

                    if (field_name == 'flush_rate') {
                        parcel_info = parcel_info.concat([
                            {
                                'type': 'data',
                                'name': 'field',
                                'value': 'autocalc'
                            },{
                                'type': 'input',
                                'name': 'autocalc',
                                'value': is_auto_calculated
                            }
                        ])                        
                    }

                    LoadingScreen.show("Water_body_prop_update")
                    let pcl = getParcelByKey('name', parcel_name);
                    parcel_info.push({type: 'input', name: 'parcelType', value: pcl.parcelType});
                    TRIM.api.updateParcel(TRIM.store.currentScenario.id, parcel_info).on('load', (rsp)=>{
                        if (rsp.target.status === 200) {
                            pcl.surface_water= rsp.target.responseJSON;
                            updateLakeProps();
                        }
                        LoadingScreen.hide("Water_body_prop_update");
                    });
                }
            })
        }

        var form = document.getElementById('lake-props-gui');

        form.addEventListener('form:visible', function() {
            console.log('lake props form visible')
            LoadingScreen.show('lake_props_loading');
            document.body.removeEventListener('parcels:ready', updateLakeProps);
            document.body.addEventListener('parcels:ready', updateLakeProps);
            TRIM.refreshParcels();
        });

        function get_pivoted_columns(tblId) {
            let table_header = tblId + '>thead>tr'
            let cols = [
                {
                    'data': "Property",
                    'bSortable': false,
                    'className': 'font-weight-bold rightBorder-pivoted freeze-column',
                    'render': function (data, type, row){
                        let help_text = row.helpText;
                        let tooltip = row.unit || row.tooltip;
                        return  `<label data-toggle='tooltip' data-placement='top' data-html='true' title='${tooltip}'>${data}</label>
                        <sup>
                            <a href='javascript:void(0);'
                                title='${data}'
                                aria-label='${data}'
                                data-trigger='focus'
                                data-toggle='popover'
                                data-html='true'
                                data-placement='left'
                                data-content='${help_text}'>
                                    <i class='fa fa-question'></i>
                            </a>
                        </sup>`;
                    }
                }
            ];

            function make_autocalc_btn(calc_info, is_active) {
                is_active = (is_active === true) ? 'True' : 'False';
                return `<p>
                    <button data-active='${is_active}' data-calcinfo='${calc_info}' class='btn btn-sm btn-outline-dark auto_calc'>
                        <small>Auto-calculate</small>
                    </button></p>`;
            };

            waterParcels.forEach(function (e, i) {
                if ($(table_header).find("th").length < (waterParcels.length + 1)) {
                    $(table_header).append("<th>" + e.name + "</th>")
                }
                cols.push({
                    'data': e.name,
                    'bSortable': false,
                    'render': function (data, type, row) {
                        let parcel_info = [{
                            'type': 'data',
                            'name': 'id',
                            'value': e.id,
                        },{
                            'type': 'data',
                            'name': 'field',
                            'value': String(row.shortProperty)
                        },{
                            'type': 'input',
                            'name': String(row.shortProperty),
                            'value': data
                        }]
                        parcel_info = JSON.stringify(parcel_info)                        
                        let this_cell_data = !isNaN(Number(data)) && String(data).length > 6 ? Number.parseFloat(data).toExponential(4) : data;
                        let this_cell_prop = row.isEditable ? 'editableCell badge badge-light' : 'nonEditableCell text-muted';
                        let min = row.min !== undefined ? " min='" + row.min + "' " : "";
                        let max = row.max !== undefined ? " max='" + row.max + "' " : "";

                        let inflow_button = "";
                        let autocalc_button = "";

                        if (row.shortProperty == 'externalWaterInflow') {
                            inflow_button = `<a class="inflow-modal-btn badge badge-secondary-accent ml-2" data-parcel='${e.name}'><i class="fa fa-list"></i></a>`;
                        }
                        else if (row.shortProperty == 'flush_rate') {
                            let calc_info = JSON.stringify({'property':row.shortProperty, 'parcel':e.name});
                            autocalc_button = make_autocalc_btn(calc_info, false);
                        }

                        return `<input class='editableCell form-control form-control-sm' type='text' style='display:none'
                                    data-parcelinfo='${parcel_info}' value='${data}' ${min} ${max} />
                                <label class='${this_cell_prop}'>${this_cell_data}</label>
                                ${autocalc_button} ${inflow_button}`;
                    }
                })
            })
            return cols
        }
        function get_Data_from_table(thisTableID){
            var myRows = [];
            var headersText = [];
            var head_section = thisTableID + ' thead th'
            var $headers = $(head_section);

            // Loop through grabbing everything
            thisRows = thisTableID + ' tbody tr'
            var $rows = $(thisRows).each(function(index) {
                $cells = $(this).find("td");
                myRows[index] = {};
                $cells.each(function(cellIndex) {
                    // Set the header text
                    if(headersText[cellIndex] === undefined) {
                        headersText[cellIndex] = $($headers[cellIndex]).text().trim();
                    }
                    // Update the row object with the header/cell combo
                    myRows[index][headersText[cellIndex]] = $(this).find("label").first().text().trim();
                });
            });
            return myRows
        }

        function calculate_external_water_inflow(inflow_data) {
            // [{'parcel': 'w1', 'fraction': 0.001}, ...]
            let total_inflow = 0;
            for (let inflow of inflow_data) {
                let pcl = getParcelByKey('name', inflow.name);
                let wc_discharge_vol_rate = pcl.surface_water.wc_props.discharge_vol_rate;
                total_inflow += wc_discharge_vol_rate * Number(inflow.fraction);
            }
            return Number.parseFloat(total_inflow).toExponential(5);
        }

        function calculate_flush_rate(data, parcel_name) {
            let pcls = TRIM.store.currentScenario.parcels;
            let P = getParcelByKey('name', parcel_name);

            let precip_rate = P.precip_rate * 365;
            let evapo_rate = P.surface_water.wc_props.evaporation_rate;
            let watershed_area = P.surface_water.wc_props.connected_watershed_area;
            let lake_depth = P.surface_water.wc_props.mean_depth;
            let external_inflow = P.surface_water.wc_props.externalWaterInflow;
            let area = P.area;
            let wgt_ave_runoff_frac = pcls.filter(e=>e.runoff_fraction!=null).map(e=>e.runoff_fraction*e.area).reduce((a,e)=>a+e, 0)/
                pcls.filter(e=>e.runoff_fraction!=null).map(e=>e.area).reduce((a,e)=>a+e, 0)
            let wgt_ave_seepage_frac = pcls.filter(e=>e.seepage_frac!=null).map(e=>
                e.seepage_frac*e.area).reduce((a,e)=>a+e, 0)/
                pcls.filter(e=>e.seepage_frac!=null).map(e=>e.area).reduce((a,e)=>a+e, 0)
            let res = ((area * precip_rate) + (watershed_area * precip_rate * wgt_ave_runoff_frac) +
                (watershed_area * precip_rate * wgt_ave_seepage_frac) + (external_inflow) - (area * evapo_rate)) /
                (area * lake_depth)
            return Number.parseFloat(res).toExponential(5)
        }

        function calculate_discharge_vol_rate(data, parcel_name){
            // use flush rate if manually applied
            let table_col_headers = $(lkTblId + " thead th").map((i,h)=>h.innerHTML).toArray()
            let table_row_headers = $(lkTblId + " tbody tr td:nth-child(1) label").map((i,r) => r.innerHTML).toArray()
            let fr_row_idx = table_row_headers.indexOf("Flush Rate")
            let col_idx = table_col_headers.indexOf(parcel_name)
            let is_auto_calculated = $(lkTblId).find('tr').eq(fr_row_idx+1).find('td').eq(col_idx).find("button").data("active");
            if (is_auto_calculated == 'False') {
                let flush_rate = Number(data.find(e=>e.Property == "Flush Rate")[parcel_name])
                let area = getParcelByKey('name', parcel_name).area
                let wc_depth = Number(data.find(e=>e.Property == "Water Depth")[parcel_name])
                let res = flush_rate * area * wc_depth
                return Number.parseFloat(res).toExponential(5)
            }

            let runoff_gain = Number(data.find(e=>e.Property == "Precipitation Runoff Volumetric Rate to Water Body")[parcel_name])
            let precipitation_gain = Number(data.find(e=>e.Property == "Precipitation Volumetric Rate to Water Body")[parcel_name])
            let precipitation_gw_seepage_gain = Number(data.find(e=>e.Property == "Precipitation Seepage Volumetric Rate to Groundwater")[parcel_name])
            let external_inflow_gain = Number(data.find(e=>e.Property == "External Water Inflow from Other Water Bodies")[parcel_name])
            let evaporation_loss = Number(data.find(e=>e.Property == "Evaporation Volumetric Rate")[parcel_name])
            let res = (runoff_gain + precipitation_gain + precipitation_gw_seepage_gain + external_inflow_gain) - evaporation_loss
            return Number.parseFloat(res).toExponential(5)
        }

        function updateLakeProps() {
            if (!TRIM.store.currentScenario || !TRIM.store.currentScenario.parcels) {
                // Parcels haven't loaded yet; wait a bit and try again
                setTimeout(function() { updateLakeProps(); }, 1000);
                return;
            }

            waterParcels = TRIM.store.currentScenario.parcels.filter(
                e => e.parcelType == "Water Only" || e.parcelType == "Water & Air"
            );
            default_water_data = getTableFields('WaterColumnTable');
            default_sed_data = getTableFields('SedimentTable');

            const water_data = []
            const sed_data = []
            const water_properties = Object.keys(default_water_data)
            const sed_properties = Object.keys(default_sed_data)
            
            try {
            if (waterParcels.length === 0) {
                $(lkTblId + ' tbody:gt(0)').remove();
                $(sedTblId + ' tbody:gt(0)').remove();
                return;
            }

            const mercuryTransformations = [
                'MethylationRate', 'OxidationRate', 'ReductionRate', 'DemethylationRate'
            ];
            const hasHg = (waterParcels[0]['mercury_transformation_rates'] != undefined);
            water_properties.forEach(function (p, i) {
                const shortName = default_water_data[p]['id'];
                const isHg = (mercuryTransformations.indexOf(shortName.split('.')[0]) > -1);
                if (isHg && !hasHg) {
                    return;
                }

                const this_water_property = {};
                this_water_property["min"] = default_water_data[p]['min'];
                this_water_property["max"] = default_water_data[p]['max'];
                this_water_property["shortProperty"] = shortName;
                this_water_property["isEditable"] = !default_water_data[p]['readonly'];
                this_water_property["helpText"] = default_water_data[p]['help'] || undefined;
                let defaultVal = default_water_data[p]['default'];
                let defaultUnit = default_water_data[p]['tooltip'];
                waterParcels.forEach(function (e, i) {
                    this_water_property['Property'] = p;
                    if (isHg) {
                        const rateName = shortName.split('.')[0];
                        let src = e['mercury_transformation_rates']['Surface_Water'];
                        for (const chem in src) {
                            for (const rate in src[chem]) {
                                if (rate != rateName) {
                                    continue;
                                }
                                let val = src[chem][rate].value;
                                defaultVal = val != undefined ? val : defaultVal;
                                defaultUnit = src[chem][rate].unit;
                                break;
                            }
                        }
                    }
                    else {
                        let exceptions = ['Precipitation Runoff Watershed Area',
                            'Precipitation Runoff Volumetric Rate to Water Body',
                            'Precipitation Volumetric Rate to Water Body',
                            'Precipitation Seepage Volumetric Rate to Groundwater'
                        ]
                        let d = (p.startsWith("Precipitation ") && exceptions.indexOf(p) == -1 )? e : e['surface_water']['wc_props']
                        defaultVal = d[shortName] != undefined ? d[shortName] : defaultVal;
                    }
                    this_water_property[e.name] = defaultVal;
                    this_water_property["unit"] = (defaultUnit != undefined ? defaultUnit : "unitless").replace('/', ' / ').replace(/\s/g, ' ').replace(/< \/ /g, '</');
                });
                water_data.push(this_water_property)
            })
            TableRedraw(water_data, "lake")
            sed_properties.forEach(function (p, i) {
                const shortName = default_sed_data[p]['id'];
                const isHg = (mercuryTransformations.indexOf(shortName.split('.')[0]) > -1);
                if (isHg && !hasHg) {
                    return;
                }

                const this_sed_property = {}
                this_sed_property["min"] = default_sed_data[p]['min'];
                this_sed_property["max"] = default_sed_data[p]['max'];
                this_sed_property["shortProperty"] = shortName;
                this_sed_property["isEditable"] = !default_sed_data[p]['readonly'];
                this_sed_property["helpText"] = default_sed_data[p]['help'] || undefined;
                let defaultVal = default_sed_data[p]['default'];
                let defaultUnit = default_sed_data[p]['tooltip'];
                waterParcels.forEach(function (e, i) {
                    this_sed_property['Property'] = p
                    if (isHg) {
                        const rateName = shortName.split('.')[0];
                        let src = e['mercury_transformation_rates']['Sediment'];
                        for (const chem in src) {
                            for (const rate in src[chem]) {
                                if (rate != rateName) {
                                    continue;
                                }
                                let val = src[chem][rate].value;
                                defaultVal = val != undefined ? val : defaultVal;
                                defaultUnit = src[chem][rate].unit;
                                break;
                            }
                        }
                    }
                    else {
                        let d = e['surface_water']['sed_props']
                        defaultVal = d[shortName] != undefined ? d[shortName] : defaultVal;
                    }
                    this_sed_property[e.name] = defaultVal;
                    this_sed_property["unit"] = (defaultUnit != undefined ? defaultUnit : "unitless").replace('/', ' / ').replace(/\s/g, ' ').replace(/< \/ /g, '</');
                })
                sed_data.push(this_sed_property)
            })
            TableRedraw(sed_data, "sed")
        
            console.log('populated lake props form!')
            } catch(e) {
                console.error('updateLakeProps error:', e);
            } finally {
                LoadingScreen.hide('lake_props_loading');
            }
        }
    });
</script>
