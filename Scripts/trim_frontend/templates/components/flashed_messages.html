
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <section class="fixed-bottom p-3 pl-4">
            {% for category, message in messages %}
                <div role="alert"
                    class="alert alert-{{ category }} alert-dismissable mb-0 fade show">
                    {{ message }}
                    <button type="button" class="close"
                        data-dismiss="alert"
                        aria-hidden="true">&times;</button>
                </div>
            {% endfor %}
        </section>
    {% endif %}
{% endwith %}
