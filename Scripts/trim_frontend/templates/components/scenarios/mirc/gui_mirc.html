
<div id="mirc-results-gui">
    <section id="simulations-overview-display">
        {% include 'components/scenarios/mirc/gui_simulations_overview.html' %}
    </section>

    <section id="single-simulation-details" style="display: none;">
        {% include 'components/scenarios/mirc/gui_simulation_results.html' %}
    </section>

    <div id="simulation-form-modal" class="modal fade" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Simulation Inputs</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    {% with form = simulation_form %}
                        {% include 'components/scenarios/mirc/gui_simulation_form.html' %}
                    {% endwith %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-secondary"
                        id="submit-simulation-form" data-dismiss="modal"
                    >
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
onDomLoad(function() {
    window.MIRC = (function(mirc) {
        var simOverview = $('#simulations-overview-display');
        var simDetails = $('#single-simulation-details');

        mirc.showScreen = function(name) {
            if (name == 'details') {
                simOverview.hide();
                simDetails.show();
            }
            else {
                simDetails.hide();
                simOverview.show();
            }
        };

        return mirc;
    })(window.MIRC || {});
});
</script>
