Parameters:
  KludgeDoDb:
    Type: String
    Description: used to set db condition
    Default: true

  KludgeDoBeanstalk:
    Type: String
    Description: used to set beanstalk condition
    Default: true

  EnvironmentName:
    Type: String
    Description: Environment name prefixed/appended to resource names; dashes only, no underscores!
    Default: pytrim-icfdev
  ShortEnvironmentProfile:
    Type: String
    Description: simple name like "dev" or "prod" to tell the app what env it is running in
    Default: dev
  CidrSegmentVPC:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value X, VPC will be configured with IPv4 CIDR of 10.X.0.0/16.
      See existing ones already in use!
    Default: 1
  AlphaAZSuffix:
    Description: >-
      suffix for the first AZ; will be combined with the current region (e.g.
      us-east-1[AlphaAZSuffix]) in created resources as needed
    Type: String
    Default: a
  BravoAZSuffix:
    Description: suffix for the second AZ. Must be different from AlphaAZSuffix!
    Type: String
    Default: b
  CidrSegmentRdsPrivateSubnetAlphaAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, private RDS subnet in AZ alpha will be configured with
      IPv4 CIDR of 10.?.Y.0/24.
    Default: 0
  CidrSegmentRdsPrivateSubnetBravoAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, private RDS subnet in AZ bravo will be configured with
      IPv4 CIDR of 10.?.Y.0/24.
    Default: 1
  CidrSegmentPrivateSubnetAlphaAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, private subnet in AZ alpha will be configured with IPv4
      CIDR of 10.?.Y.0/24.
    Default: 2
  CidrSegmentPrivateSubnetBravoAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, private subnet in AZ bravo will be configured with IPv4
      CIDR of 10.?.Y.0/24.
    Default: 3
  CidrSegmentPublicSubnetAlphaAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, public subnet in AZ alpha will be configured with IPv4
      CIDR of 10.?.Y.0/24.
    Default: 4
  CidrSegmentPublicSubnetBravoAZ:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, public subnet in AZ bravo will be configured with IPv4
      CIDR of 10.?.Y.0/24.
    Default: 5
  CidrSegmentNatSubnet:
    Type: Number
    MinValue: 0
    MaxValue: 255
    Description: >-
      for input value Y, NAT-related subnet will be configured with
      IPv4 CIDR of 10.?.Y.0/24.
    Default: 6
  NotificationEmail:
    Description: 'email address for AWS-related notifications'
    Type: String
    Default: 'tom.feiler@icf.com'
  WebServerCertId:
    Description: The Amazon Resource Name (ARN) of an SSL certificate to bind to the web tier listener. Visit ACM to find the appropriate value.
    Type: String
    # this default is a dev one, just for testing purposes
    Default: "arn:aws:acm:us-east-1:426714360284:certificate/6f39535c-f167-4048-9304-6af9803a2498"
  WebTierMinNumOfInstances:
    Description: 'minimum # of instances in the web tier'
    Type: Number
    Default: 1
  WebTierMaxNumOfInstances:
    Description: 'maximum # of instances in the web tier'
    Type: Number
    Default: 1
  WebTierInstanceType:
    Description: instance type for the web tier
