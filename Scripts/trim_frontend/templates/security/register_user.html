{% from 'macros/form_macros.html' import render_standard_form %}

{% extends 'layout.html' %}

{% block page_header %}

    <h2 class="text-secondary my-4">
        Register
    </h2>

{% endblock page_header %}

{% block content %}

    {% with form = register_user_form %}

        {{ render_standard_form(form) }}

    {% endwith %}

    <div class="form-group mt-3">
        <a class="btn btn-outline-dark"
            href="{{ url_for('security.login') }}">
            Login
        </a>
    </div>
</div>

{% endblock content %}
