
<div id="mirc-results-gui">
    <div class="container-fluid px-0">
        <button type="button" id="add-simulation" class="btn btn-secondary py-1 mb-2 float-right"
        >
            <i class="fa fa-plus"></i>&nbsp;
            New Risk Simulation
        </button>
    </div>

    <div class="form-group mb-3">
        <select id="simulation-id"
            class="form-control"
            style="max-width: 100%;"
            {% if not scenario.mirc_simulations %}disabled="disabled"{% endif %}
        >
            {% for sim in scenario.mirc_simulations %}
                <option value="{{ sim.id }}">
                    {{
                        sim.name + ' - ' +
                        (sim.chemical.hap_name or sim.chemical.name) + ' (' +
                        sim.chemical.cas_number + ')'
                    }}
                </option>
            {% else %}
                <option value="">No Simulations Created</option>
            {% endfor %}
        </select>
    </div>

    <div id="mirc-results-desc">
        <div class="form-group form-row mb-1">
            <label class="col-3 col-form-label col-form-label py-0 font-weight-bold">
                <span>&nbsp;Chemical</span>
            </label>
            <div class="col">
                <input id="chemical-name" readonly="readonly"
                    class="form-control-plaintext py-0"
                    style="max-width: 100%;"
                    value="Loading ..."
                />
            </div>
        </div>
        <div class="form-group form-row mb-1 d-none">
            <label class="col-3 col-form-label py-0 font-weight-bold">
                <span>&nbsp;Import Source</span>
            </label>
            <div class="col">
                <input id="import-name" readonly="readonly"
                    class="form-control-plaintext py-0"
                    style="max-width: 100%;"
                    value="Loading ..."
                />
            </div>
        </div>
        <div class="form-group form-row mb-1">
            <label class="col-3 col-form-label py-0 font-weight-bold">
                <span>&nbsp;Fish Calculation Type</span>
            </label>
            <div class="col">
                <input id="fish-pathway" readonly="readonly"
                    class="form-control-plaintext py-0"
                    style="max-width: 100%;"
                    value="Loading ..."
                />
            </div>
        </div>
    </div>
</div>

<h4 id="mirc-results-header" class="text-center mb-2">Results</h4>

<div id="simulation-error" style="display: none;">
    <div class="text-danger"></div>
</div>

<div id="results-chart-legend" class="container-fluid border-bottom my-2 pb-2">
</div>

<div id="results-chart" class="ct-chart mb-2">
</div>

<div id="results-download" class="text-right p-1" style="display: none;">
    <button type="button" id="export-btn" class="btn btn-sm btn-dark">
        <i class="fa fa-download mr-2"></i>Download Excel
    </button>
</div>

<div class="table-responsive">
    <table id="results-table" class="table table-striped table-bordered">
        <thead>
            <tr class="headers">
                <th rowspan="2" style="display: none;">Fixed</th>
                <th rowspan="2">Product</th>
                <th rowspan="2">Concentration</th>
                <th rowspan="2" class="cursor-default" title="Concentration Units">
                    Units
                </th>
                <th colspan="4" class="text-center p-0">
                    <select id="breakout-age"
                        class="form-control font-weight-bold text-reset p-1 cursor-pointer"
                        style="text-align-last: center; text-align: center;"
                    >
                        <option value="Lifetime">Lifetime</option>
                    </select>
                </th>
            </tr>
            <tr class="headers">
                <th title="Average Daily Dose">ADD</th>
                <th class="cursor-default" title="Average Daily Dose Units">
                    ADD Units
                </th>
                <th title="Hazard Quotient">HQ</th>
                <th>Cancer Risk</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="10" class="text-center table-light">
                    Loading Assessment results ...
                </td>
            </tr>
        </tbody>
    </table>
</div>

{% if current_user.is_superuser %}
    <div class="card mt-2">
        <div class="card-header p-0">
            <a id="logToggle" href="#logCollapse"
                class="btn-block font-weight-bold py-2 px-3 text-decoration-none"
                aria-expanded="False" aria-controls="logCollapse"
                data-toggle="collapse"
            >
                Logs
            </a>
        </div>
        <div id="logCollapse"
            class="card-body collapse"
            aria-labelledby="logToggle"
        >
            <ul id="results-log">
            </ul>
        </div>
    </div>
{% endif %}


<div id="simulation-form-modal" class="modal fade" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Simulation Inputs</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                {% with form = simulation_form %}
                    {% include 'components/scenarios/mirc/gui_simulation_form.html' %}
                {% endwith %}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-secondary"
                    id="submit-simulation-form" data-dismiss="modal"
                >
                    Save
                </button>
            </div>
        </div>
    </div>
</div>


<script>
onDomLoad(function() {
    var tbl = $('#results-table');
    var riskTbody = $('#risk-results tbody');

    $('#logAccordion').collapse()

    function simplifyUnit(unit, timeLast) {
        var simple = unit
            .replace(/gram/g, 'g')
            .replace(/milli/g, 'm')
            .replace(/kilo/g, 'k')
            .replace(/liter/g, 'L')
            .replace(/ /g, '');

        if (timeLast) {
            if (simple.indexOf('/day') > -1) {
                simple = simple.replace(/\/day/g, '');
                simple += '/day';
            }
        }

        return simple;
    }

    function asScientific(number, decimals) {
        if (number == null || number.toString() == '') {
            return '';
        }

        decimals = decimals || 0;
        var sci = Number.parseFloat(number).toExponential(decimals);
        sci = sci.replace(/e\+0/g, '').replace(/e\-0/g, '');
        if (parseFloat(sci) == 0) {
            return '0';
        }
        return sci;
    }
    function round(number, decimals) {
        return Number(Math.round(number + 'e' + decimals) + 'e-' + decimals);
    }

    function updateMeta(meta) {
        $('#import-name').val(meta.importSource);
        $('#fish-pathway').val(meta.fishPathway);

        var chemical = meta.chemical || {};

        if (chemical.hap_name || chemical.cas_number) {
            $('#chemical-name').val(
                (chemical.hap_name || chemical.name) + ' (CAS ' + chemical.cas_number + ')'
            );
        }
        else {
            $('#chemical-name').val('');
        }
        if (chemical.mutagenic) {
            $('#adaf-header').show();
        }
        else {
            $('#adaf-header').hide();
        }
    }

    function standardProductName(product) {
        var str = product.replace(/\_/g, ' ');
        var name = str.toLowerCase().split(' ').map(function(word) {
            return word.replace(word[0], word[0].toUpperCase());
        }).join(' ');
        if (name == 'Root') {
            name = 'Root Vegetable';
        }
        return name;
    }

    function formatChildRow(data) {
        var t = document.createElement('table');
        t.className = 'table table-sm m-0';

        if (!data.risk) {
            return t.outerHTML;
        }

        var thead = document.createElement('thead');
        var tr = document.createElement('tr');
        tr.className = 'bg-transparent cursor-default';

        var th = document.createElement('th');
        th.innerText = 'Life Stage';
        tr.appendChild(th);

        th = document.createElement('th');
        th.colSpan = 2;
        th.innerText = 'ADD';
        if (data.chemical.mutagenic) {
            th.innerText = 'Base ADD';
        }
        th.title = 'Average Daily Dose';
        tr.appendChild(th);

        if (data.chemical.mutagenic) {
            th = document.createElement('th');
            th.colSpan = 2;
            th.innerText = 'Adjusted ADD';
            th.title = 'Adjusted Average Daily Dose';
            tr.appendChild(th);
        }

        th = document.createElement('th');
        th.innerText = 'HQ';
        th.title = 'Hazard Quotient';
        tr.appendChild(th);

        th = document.createElement('th');
        th.innerText = 'Cancer Risk';
        tr.appendChild(th);

        thead.appendChild(tr);
        t.appendChild(thead);

        var tb = document.createElement('tbody');
        t.appendChild(tb);

        $.each(data.risk, function(age, riskData) {
            var tr = document.createElement('tr');

            var td = document.createElement('td');
            td.innerText = age;
            tr.appendChild(td);

            var i = riskData.intake;
            if (i == null) {
                i = {value: NaN, unit: ''};
            }
            td = document.createElement('td');
            td.style.whiteSpace = 'nowrap';
            td.innerText = asScientific(i.value, 4);
            tr.appendChild(td);
            td = document.createElement('td');
            td.innerText = simplifyUnit(i.unit, true);
            tr.appendChild(td);

            if (data.chemical.mutagenic) {
                var adj = riskData.adjusted_intake;
                if (adj == null) {
                    i = {value: NaN, unit: ''};
                }
                td = document.createElement('td');
                td.style.whiteSpace = 'nowrap';
                td.innerText = asScientific(adj.value, 4);
                tr.appendChild(td);
                td = document.createElement('td');
                td.innerText = simplifyUnit(adj.unit, true);
                tr.appendChild(td);
            }

            var hq = riskData.hazard_quotient;
            td = document.createElement('td');
            td.style.whiteSpace = 'nowrap';
            if (hq == null) {
                td.innerText = 'N/A';
            }
            else {
                td.innerText = asScientific(hq.value, 4);
            }
            tr.appendChild(td);


            var r = riskData.risk_factor;
            td = document.createElement('td');
            td.style.whiteSpace = 'nowrap';
            if (r == null) {
                td.innerText = 'N/A';
            }
            else {
                td.innerText = asScientific(r.value, 4);
            }
            tr.appendChild(td);

            tb.appendChild(tr);
        });

        return t.outerHTML;
    }

    function updateTable(simulation) {
        var results = simulation.results;

        var data = [];
        $.each(results, function(product, info) {
            var fixed = 0;
            if (product.toLowerCase() == 'total') {
                fixed = 1e10;
            }
            data.push({
                fixed: fixed,
                chemical: simulation.meta.chemical,
                product: product,
                concentration: info.concentration,
                risk: info.risk
            });
        });

        // Remove any old headers
        tbl.find('thead tr').each(function() {
            if (this.className != 'headers') {
                $(this).remove();
            }
        });

        if (!data.length) {
            return;
        }

        // Get the breakout selector
        var ageSelect = $('#breakout-age');

        // Initialize base data
        var dt = tbl.DataTable({
            destroy: true, // override previous initialization
            dom: 't', // only show the table
            data: data,
            paging: false,
            aaSortingFixed: [[0, 'desc']],
            order: [[1, 'asc']],
            columns: [
                {
                    title: 'Fixed',
                    data: 'fixed',
                    orderable: false,
                    visible: false
                },
                {
                    title: 'Product',
                    data: 'product',
                    className: 'cursor-pointer',
                    render: function(data, type, row, meta) {
                        var d = document.createElement('div');
                        d.className = 'd-flex';
                        d.innerText = standardProductName(data);

                        if (row.risk != null) {
                            var fa = document.createElement('i');
                            fa.className = 'ml-auto mt-1 fa fa-plus-circle';
                            d.appendChild(fa);
                        }

                        return d.outerHTML;
                    }
                },
                {
                    title: 'Concentration',
                    data: 'concentration',
                    className: 'white-space-nowrap',
                    render: function(data, type, row, meta) {
                        if (data == undefined) {
                            return 'N/A';
                        }
                        return asScientific(data.value, 4);
                    }
                },
                {
                    title: 'Units',
                    data: 'concentration',
                    orderable: false,
                    render: function(data, type, row, meta) {
                        if (data == undefined) {
                            return '';
                        }
                        var u = simplifyUnit(data.unit);
                        // if (u) {
                        //     if (row.product == 'soil') {
                        //         u += ' dry weight';
                        //     }
                        //     else if (row.product != 'water') {
                        //         u += ' wet weight';
                        //     }
                        // }
                        return u;
                    }
                },
                {
                    title: 'ADD',
                    data: 'risk',
                    className: 'white-space-nowrap',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var add = data[ageSelect.val()].intake;
                        if (data[ageSelect.val()].adjusted_intake) {
                            add = data[ageSelect.val()].adjusted_intake;
                        }
                        return asScientific(add.value, 4);
                    }
                },
                {
                    title: 'ADD Units',
                    data: 'risk',
                    orderable: false,
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var add = data[ageSelect.val()].intake;
                        if (data[ageSelect.val()].adjusted_intake) {
                            add = data[ageSelect.val()].adjusted_intake;
                        }
                        return simplifyUnit(add.unit, true);
                    }
                },
                {
                    title: 'HQ',
                    data: 'risk',
                    className: 'white-space-nowrap',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var hq = data[ageSelect.val()].hazard_quotient;
                        if (hq == null) {
                            return 'N/A';
                        }
                        return asScientific(hq.value, 4);
                    }
                },
                {
                    title: 'Cancer Risk',
                    data: 'risk',
                    className: 'white-space-nowrap',
                    render: function(data, type, row, meta) {
                        if (data == undefined || $.isEmptyObject(data)) {
                            return '';
                        }
                        var risk = data[ageSelect.val()].risk_factor;
                        if (risk == null) {
                            return 'N/A';
                        }
                        return asScientific(risk.value, 4);
                    }
                }
            ]
        });

        // Initialize breakout options
        ageSelect.empty();
        var sortedAges = Object.keys(results.total.risk).sort((a, b) => {
            if (a.indexOf('Lifetime') == 0) {
                return 1; // Lifetime comes after everything
            }
            if (a.indexOf('Adult') == 0) {
                return b.indexOf('Lifetime') == 0 ? -1 : 1; // Adult comes after everything except Lifetime
            }
            if (a.indexOf('Child') == 0) {
                if (a.indexOf('<') > -1) {
                    return -1; // Child<* comes before anything
                }
                if (b.indexOf('Child') < 0) {
                    return -1; // Child* comes before anything that isn't Child*
                }
                // Else check if Child[a] is younger than Child[b]
                var aAgeStart = parseInt(a.split(' ')[1].split('-')[0]);
                var bAgeStart = parseInt(b.split(' ')[1].split('-')[0])
                return aAgeStart < bAgeStart ? -1 : 1;
            }
            return 0; // else no opinion
        });
        $.each(sortedAges, function(i, age) {
            var etc = results.total.risk[age];
            ageSelect.append($('<option />').val(age).text(age));
        });
        ageSelect.val('Lifetime').off('change').change(function() {
            dt.rows().invalidate('data');
            dt.draw();
            updateChart(simulation, this.value);
        });

        // Initialize filter fields
        var tr = $('<tr />');
        tbl.find('thead').append(tr);
        tr.append('<th style="display: none;" /><th /><th /><th /><th /><th /><th /><th />')
            .find('th').each(function(i) {
                var th = $(this);
                th.addClass('p-0');
                th.html('<input type="text" class="form-control form-control-sm" placeholder="filter" />');

                var last = undefined;
                $('input', this).on('keyup change', function () {
                    var s = this.value;
                    if (last !== s) {
                        last = s;
                        dt.draw();
                    }
                });
            });
        $.fn.dataTable.ext.search.push(
            function(settings, searchData, index, rowData, counter) {
                if (rowData.fixed) {
                    return true;
                }

                var include = true;
                $('thead input[placeholder="filter"]').each(function(i) {
                    var s = this.value.toLowerCase();
                    if (searchData[i].toLowerCase().indexOf(s) < 0) {
                        include = false;
                        return false;
                    }
                });

                return include;
            }
        );

        // Initialize child rows
        tbl.off('click', 'td.cursor-pointer');
        tbl.on('click', 'td.cursor-pointer', function() {
            var td = $(this);
            var fa = td.find('.fa');

            if (!fa.length) {
                return;
            }

            fa.toggleClass('fa-plus-circle').toggleClass('fa-minus-circle');

            var row = dt.row(td.closest('tr'));
            if (row.child.isShown()) {
                row.child.hide();
            }
            else {
                row.child(formatChildRow(row.data())).show();
            }
        });

        tbl.find('tbody tr').each(function() {
            var tr = $(this);
            if (tr.html().indexOf('Total') > -1) {
                tr.addClass('font-weight-bold');
                tr.find('td').css('border-bottom-width', '2px');
                return false;
            }
        });
    }

    function updateChart(simulation, age) {
        age = age || 'Lifetime'
        var results = simulation.results;

        function getVals(info) {
            if (info.risk == null || $.isEmptyObject(info.risk)) {
                return {
                    intake: 0,
                    hazard: 0,
                    risk: 0
                };
            }

            i = info.risk[age].adjusted_intake;
            if (i == null) {
                i = info.risk[age].intake;
            }
            if (i == null) {
                i = 0;
            }
            else {
                i = i.value;
            }

            hq = info.risk[age].hazard_quotient;
            if (hq == null) {
                hq = 0;
            }
            else {
                hq = hq.value;
            }

            rf = info.risk[age].risk_factor;
            if (rf == null) {
                rf = 0;
            }
            else {
                rf = rf.value;
            }

            return {
                intake: i,
                hazard: hq,
                risk: rf
            };
        }

        var products = [];

        var pctIntakes = [];
        // var pctHazards = [];
        // var pctRisks = [];
        var productData = {}

        var other = 0;

        var total = getVals(results.total);
        var sortedResults = [];
        $.each(results, function(product, info) {
            if (product.toLowerCase() == 'total') {
                return;
            }
            var vals = getVals(info);
            vals.product = standardProductName(product);
            sortedResults.push(vals);
        });
        sortedResults.sort(function(a, b) {
            return b.intake - a.intake;
        })
        $.each(sortedResults, function(i, vals) {
            var name = vals.product
            products.push(name);

            productData[name] = vals;

            i = vals.intake / total.intake;
            if (i < 0.01) {
                other += i;
                i = 0;
            }
            if (Number.isNaN(i)) {
                productData[name] = null;
            }
            pctIntakes.push(i);
        });
        if (other >= 0) {
            products.push('Other');
            pctIntakes.push(other);
            productData['Other'] = null;
        }

        var alph = 'abcdefghijklmnopqrstuvwxyz';

        function shadowOn(e) {
            var path = $(e.target);
            var g = path.closest('g');
            var shadow = path.clone();
            shadow.attr({
                class: 'ct-slice-pie ct-shadow',
                stroke: '#9f4912',
                fill: 'none',
                'stroke-width': 4,
                'stroke-opacity': 0.6,
                'fill-opacity': 1
            });
            g.parent().append(shadow); // make sure highlighting is on top

            g.popover('show');
        }

        function shadowOff(e) {
            var path = $(e.target);
            var g = path.closest('g');
            var shadow = g.parent().find('.ct-shadow');
            shadow.remove();

            g.popover('hide')
        }

        $('#results-chart').empty();
        var chart = new Chartist.Pie('#results-chart', {
            series: pctIntakes
        }, {
            width: '100%',
            height: '280px',
            chartPadding: 10,
            ignoreEmptyValues: true,
            showLabel: false,
            plugins: [
                Chartist.plugins.hover({
                    onMouseEnter: shadowOn,
                    onMouseLeave: shadowOff
                })
            ]
        });

        var legend = $('#results-chart-legend').empty();

        chart.on('created', function() {
            legend.empty();
            $('#results-chart .ct-slice-pie').each(function() {
                var path = $(this);
                var g = path.closest('g');

                var row = legend.find('.row').last();
                if (!row.length || row.children().length == 4) {
                    row = $('<div class="row" />');
                    legend.append(row);
                }

                prodIdx = -1;
                $.each(g[0].className.baseVal.split(' '), function(i, val) {
                    if (val.indexOf('ct-series-') > -1) {
                        prodIdx = alph.indexOf(val.replace('ct-series-', ''));
                    }
                });

                var name = products[prodIdx];

                var entry = $('<div class="col-sm" />');
                var dot = $('<span class="d-inline-block rounded-circle p-2" />');
                dot.css('background-color', path.css('fill'));
                entry.append(dot);
                var pct = path.attr('ct:value');
                pct = round(parseFloat(pct) * 100, 2)
                if (!Number.isNaN(pct)) {
                    entry.append(
                        '<span class="d-inline-block p-1">'
                        + name + ', ' + pct + '%'
                        + '</span>'
                    );
                }
                else {
                    entry.append(
                        '<span class="d-inline-block p-1">'
                        + name + ', N/A'
                        + '</span>'
                    );
                }
                row.append(entry);

                var pData = productData[name];

                var content = '';
                if (name == 'Other') {
                    content = '<b>Other</b>';
                    name = '';
                }
                else if (pData == null) {
                    content = 'N/A'
                }
                else {
                    var addName = 'ADD';
                    if ($('#breakout-age').val() == 'Lifetime') {
                        addName = 'LADD';
                    }
                    content = (
                        '<b>' + addName + ':</b>&nbsp;' + asScientific(pData.intake, 4)
                        + '<br/><b>Hazard Quotient:</b>&nbsp;' +  asScientific(pData.hazard, 4)
                        + '<br/><b>Cancer Risk:</b>&nbsp;' +  asScientific(pData.risk, 4)
                    );
                }

                g.popover({
                    trigger: 'manual',
                    container: 'body',
                    title: name,
                    html: true,
                    content: content
                });
            });
            var row = legend.find('.row').last();
            while (row.children().length < 4) {
                row.append('<div class="col-sm" />');
            }
        });

        // console.log(pctIntakes)
        if (pctIntakes.every(function(x) { return Number.isNaN(x) || (x == 0); })) {
            $('#results-chart').hide();
        }
        else {
            $('#results-chart').show();
        }
    }

    function updateLog(logs) {
        var log = $('#results-log');
        if (!log.length) {
            return;
        }

        var htmlLogs = [];
        for (var i = 0; i < logs.length; i++) {
            htmlLogs.push('<li>' + logs[i] + '</li>');
        }
        log.append(htmlLogs.join(''));
    }

    var url = '{{ url_for("mirc_simulation_api.get_results", trim_scenario_id=scenario.id, simulation_id=0) }}';

    function loadResults(id, format) {
        LoadingScreen.show('getResults');
        var downloader = $('#results-download');
        if (format != 'xlsx') {
            updateMeta({});
            downloader.hide();
        }
        var err = $('#simulation-error');
        err.hide();
        var legend = $('#results-chart-legend');
        var chart = $('#results-chart');
        var tbl = $('#results-table');

        $('#results-log').empty();
        var logs = $('#logToggle').closest('.card');

        var ans = $.Deferred();

        var header = $('#mirc-results-header');
        var desc = $('#mirc-results-desc');
        if (!id) {
            header.hide();
            desc.hide();
            legend.hide();
            chart.hide();
            tbl.hide();
            logs.hide();
            LoadingScreen.hide('getResults');
            ans.resolve();
            return ans.promise();
        }

        format = format || 'json';

        $.ajax({
            url: url.replace('/0', '/' + id) + '?format=' + format,
            method: 'GET',
            contentType: 'application/json'
        }).then(function(data) {
            // console.log(data)
            if (format == 'json') {
                desc.show();
                header.show();
                legend.show();
                chart.show();
                downloader.show();
                tbl.show();
                logs.show();
                updateMeta(data.meta);
                updateChart(data);
                updateTable(data);
                updateLog(data.logs);
            }
            ans.resolve(data);
        }).fail(function(data, status, error) {
            // console.log(data)
            var msg = ['Error in simulation; unable to load results.']
            if (data && data.responseJSON && data.responseJSON.message) {
                msg.push(data.responseJSON.message);
            }
            var msgDiv = err.find('.text-danger').empty();
            for (var i = 0; i < msg.length; i++) {
                msgDiv.append($('<div/>').text(msg[i]));
            }
            desc.show();
            header.show();
            err.show();
            if (format == 'json') {
                legend.hide();
                chart.hide();
                downloader.hide();
                tbl.hide();
                logs.show();
            }
            ans.reject(data, status, error);
        }).always(function() {
            LoadingScreen.hide('getResults');
        });

        return ans.promise();
    }

    $('#simulation-id').change(function() {
        var id = $(this).val();
        loadResults(id);
    }).change();

    $('#export-btn').click(function(e) {
        e.preventDefault();
        var id = $('#simulation-id').val();
        loadResults(id, 'xlsx').then(function(data) {
            if (data.success) {
                var link = $('<a href="' + data.url + '">Download</a>');
                link.attr('download', data.attachment_name);
                link.css({'display': 'none'});
                link.appendTo('body');
                link[0].click();
                link.remove();
            }
        });
    });

    $('#submit-simulation-form').click(function(e) {
        e.preventDefault();
        $('#simulation-form').submit();
    });

    $('#add-simulation').click(function(e) {
        e.preventDefault();
        e.stopPropagation();

        if (TRIM.store.mirc_data === undefined) {
            LoadingScreen.show('loadMircData');
            TRIM.api.exportScenarioForMirc(TRIM.store.currentScenario.id).on('load', function() {
                TRIM.store.mirc_data = this.responseJSON.trim_data;
                initSimulationForm();
                LoadingScreen.hide('loadMircData');
                $('#simulation-form-modal').modal('show');
            });
        }
        else {
            initSimulationForm();
            $('#simulation-form-modal').modal('show');
        }
    });
});
</script>
